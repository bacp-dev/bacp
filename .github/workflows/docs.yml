---
# Build and deploy bacp.dev (GitHub Pages, gh-pages branch), mirroring ucp.dev:
#   main               -> /draft/   (spec, mike) and /  (root landing site)
#   release/YYYY-MM-DD -> /YYYY-MM-DD/ (spec, mike); the newest release is also /latest/
name: Docs build and deploy

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-build-env
      - name: Lint YAML
        run: uv run yamllint -c .yamllint.yml .
      - name: Validate schemas, examples, handler registry and OpenAPI
        run: uv run python scripts/validate.py
      - name: Build spec (strict)
        run: DOCS_MODE=spec uv run mkdocs build --strict
      - name: Build root site (strict)
        run: DOCS_MODE=root uv run mkdocs build --strict

  deploy_main:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-env
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy /draft/ and the root site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin gh-pages:gh-pages || true
          DOCS_MODE=spec BACP_BUILD_VERSION=draft uv run mike deploy --push draft
          # Until the first dated release exists, /latest/ points at the draft.
          if ! git ls-remote --exit-code --heads origin 'release/*' >/dev/null; then
            uv run mike alias --push -u draft latest
          fi

          DOCS_MODE=root uv run mkdocs build --strict -d site_root
          git clone --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages-branch
          cd gh-pages-branch
          # Replace root files; keep the versioned spec folders and mike metadata.
          git ls-files | grep -vE '^(\.nojekyll|draft/|latest/|[0-9]{4}-[0-9]{2}-[0-9]{2}/|versions\.json)' | xargs -r git rm -q -f
          cp -r ../site_root/. .
          rm -rf specification schemas
          ln -s latest/specification specification
          ln -s latest/schemas schemas
          touch .nojekyll
          git add -A
          git commit -m "Deploy root site from ${GITHUB_SHA::7}" --allow-empty
          git push origin gh-pages

  deploy_release:
    needs: validate
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-env
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy /YYYY-MM-DD/ (and /latest/ if newest)
        run: |
          git fetch origin gh-pages:gh-pages || true
          VERSION="${GITHUB_REF#refs/heads/release/}"
          git fetch origin "+refs/heads/release/*:refs/remotes/origin/release/*"
          NEWEST=$(git branch -r --list 'origin/release/*' | sed 's|.*origin/release/||' | sort -V | tail -n1 | tr -d ' ')
          export DOCS_MODE=spec BACP_BUILD_VERSION="$VERSION"
          if [ "$VERSION" = "$NEWEST" ]; then
            uv run mike deploy --push --update-aliases "$VERSION" latest
          else
            uv run mike deploy --push "$VERSION"
          fi
      - name: Tag and draft release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${GITHUB_REF#refs/heads/release/}"
          gh release create "$TAG" --title "BACP $TAG" --generate-notes --target "$GITHUB_REF_NAME" || echo "release $TAG exists"
