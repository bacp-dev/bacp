      description: 'Intersection of registry, BAP profile, BPP accepted handlers, the TermSheet payment option and tranche, mandates,

        presence, amount limits and Trusted-Surface-reported instrument availability. Empty result returns 200 with message

        handlers_incompatible (resolution requires_buyer_input). Read-only, but POST because of the body.

