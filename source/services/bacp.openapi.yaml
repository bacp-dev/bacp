                  firm: true
                  expires_in: PT30M
                  acceptance_revocation: waived
                  waiver_basis:
                    doc_type: contract
                    id: RC-2026-114
                    hash: sha-256:M5UfYcafnlsmBR85CRvl7P0xBxMx19WS5F0r33UstjI
                  term_sheet_patch:
                  - op: replace
                    path: /lines/0/unit_price/value
                    value:
                      value: 180000
                      currency: INR
                  - op: replace
                    path: /lines/0/unit_price/status
                    value: Assert
              withdraw:
                value:
                  type: withdraw
                  offer_hash: sha-256:Wc6l4R0gH0b0dXzcrZmLtJ3x3yQ6m5PZb1oS2kA9VQo
                  reason: offeror_choice
      responses:
        '200':
          description: Message sent, or escalation required, or business message (full state)
          content:
