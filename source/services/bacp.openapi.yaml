          type: string
        expected_delivery:
          type: string
        hash:
          $ref: '#/components/schemas/Hash'
        price_breakup:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - type
            - amount
            properties:
              type:
                type: string
              amount:
                $ref: '#/components/schemas/Amount'
        fx:
          $ref: ../schemas/fx.json
    StepUp:
      type: object
      required:
      - step_up_id
      - kind
      - reason
      - trusted_surface_url
      - expires_at
      properties:
        step_up_id:
          type: string
        kind:
          enum:
          - confirm
          - rail_auth
          description: confirm = user signs closed mandate on Trusted Surface. rail_auth = fresh per-transaction 2FA (UPI PIN) because a rail
            cap or AFA threshold is exceeded.
        reason:
          enum:
          - above_step_up_threshold
          - above_amount_per_txn
          - above_rail_limit
          - above_afa_limit
          - new_merchant
          - outside_categories
          - budget_exhausted
          - constraint_unresolved
          - negotiation_out_of_mandate
          - negotiation_between_reservation_and_max
          - afa_threshold_card_emandate
          - credit_acceptance
          - split_tender_afa_on_total
          - afa_crossborder_cnp
          - pre_debit_notice_pending
        summary:
          $ref: '#/components/schemas/LangText'
        trusted_surface_url:
          type: string
        expires_at:
          type: string
          format: date-time
        a2a_state:
          const: AUTH_REQUIRED
        mcp_error:
          const: insufficient_scope
    PaymentState:
      type: object
      required:
      - handler
      - status
      properties:
        handler:
          anyOf:
          - $ref: '#/components/schemas/Handler'
          - $ref: '#/components/schemas/RailType'
          - $ref: ../schemas/common.json#/$defs/HandlerRef
        collected_by:
          enum:
          - BAP
          - BPP
        type:
          enum:
          - ON-ORDER
          - ON-FULFILLMENT
        status:
          enum:
          - not_started
          - initiated
          - debited
          - confirmed
          - in_doubt
          - reversal_pending
          - reversed
          - failed
        receipt:
          anyOf:
          - $ref: '#/components/schemas/Receipt'
          - $ref: '#/components/schemas/ReceiptRef'
        reversal_deadline:
          type: string
          format: date-time
          description: T+5 for UPI P2M debited-not-confirmed
        budget_after:
          type: array
          description: Unsigned, computed by the gateway from its mandate ledger after applying the PSP-signed receipt. Never part of the receipt.
          items:
            type: object
            required:
            - period
            - remaining
            properties:
              period:
                type: string
              remaining:
                $ref: '#/components/schemas/Amount'
    Session:
      type: object
      required:
