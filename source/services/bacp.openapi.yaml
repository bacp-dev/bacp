        '409':
          $ref: '#/components/responses/StaleOffer'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/BppNack'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/BppTimeout'
  /negotiations/{negotiation_id}/accept:
    parameters:
    - $ref: '#/components/parameters/NegotiationId'
    post:
      tags:
      - negotiation
      operationId: acceptOffer
      summary: Absolute, unqualified ACCEPT of the live offer (bacp.neg.accept, sent on Beckn init)
      description: 'The gateway obtains a `within_bounds` attestation from the buyer credential provider (which re-verifies the

        closed mandate against the open checkout mandate and the negotiation mandate) and sends Beckn init carrying

        bacp.neg.accept. The seller BPP receives only the attestation. Accept of a firm offer gives

        legal_effect acceptance (state ACCEPT_PENDING then AGREED). Accept of a non-firm offer gives purchase_offer

        (state PURCHASE_OFFERED). on_init with the identical term hash moves to BOUND and opens or updates the

        checkout session, whose checkout_hash is the hash of the BPP-signed quote (not the offer hash).

        Outside the mandate: 200 with requires_escalation, then retry with step_up_id after approval.

        '
