              $ref: '#/components/schemas/AcceptRequest'
            examples:
              accept:
                value:
                  offer_hash: sha-256:Wc6l4R0gH0b0dXzcrZmLtJ3x3yQ6m5PZb1oS2kA9VQo
      responses:
        '200':
          description: ACCEPT dispatched (AGREED, PURCHASE_OFFERED, BOUND), or requires_escalation, or a breach flag
          content:
            application/json:
              schema:
                $ref: ../schemas/negotiation-session.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '409':
          $ref: '#/components/responses/StaleOffer'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
