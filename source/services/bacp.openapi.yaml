                          - O
                          - C
                          - A
                          - D
                        all_in_total:
                          $ref: '#/components/schemas/Amount'
                        method_fee:
                          $ref: '#/components/schemas/Amount'
                        afa_expected:
                          type: boolean
                        rank_reason:
                          enum:
                          - user_preference
                          - lowest_total
                          - lowest_friction
                  excluded:
                    type: array
                    items:
                      type: object
                      required:
                      - handler_id
                      - reason
                      properties:
                        handler_id:
                          type: string
                        reason:
                          enum:
                          - not_in_registry
                          - not_offered_by_bap
                          - not_accepted_by_seller
                          - not_in_term_sheet
                          - not_in_mandate
                          - presence_handler_mismatch
                          - above_limit
                          - instrument_unavailable
                          - card_not_enabled_for_cnp
                          - cod_not_allowed
                          - reservepay_block_wrong_payee
                          - pilot_not_attested
                          - cod_open_orders_cap
                          - credit_funding_not_allowed
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  comparison:
                    type: array
                    description: Every option and its all-in total (selection log). For a leg of a multi-seller basket it also records which option
                      was chosen and why each other one was skipped.
                    items:
                      type: object
                      properties:
                        handler_id:
                          type: string
                        all_in_total:
                          $ref: '#/components/schemas/Amount'
                        method_charge:
                          $ref: '#/components/schemas/Amount'
                          description: The sum of the payer-borne charge lines that apply only to this option's handlers (a convenience fee or a COD fee scoped
                            to them). The gateway computes it; a value supplied by a counterparty is ignored. It is a log value, and no view labels it as who pays.
                        option_id:
                          type: string
                        chosen:
                          type: boolean
                        reason:
                          type: string
                          description: Why the option was chosen (a rank_reason) or skipped (an excluded reason, or not_principal_preference).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
webhooks:
  mandate.status_changed:
    post:
      summary: Mandate status changed (ACTIVE, PAUSED, REVOKED, EXPIRED, EXHAUSTED). Delivered within 60 s of the Trusted Surface event.
      description: Also sent when the set of pause reasons of a PAUSED mandate changes. A mandate stays PAUSED while pause_reasons is not
        empty; the gateway itself removes only binding_ineligible.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MandateStatusChangedData'
            examples:
              revoked:
                value:
                  event_id: evt_01HZXR
                  type: mandate.status_changed
                  created_at: '2026-10-25T08:00:03+05:30'
                  data:
                    mandate_id: mdt_PAY7Q2W9X4K1M3
                    status: REVOKED
                    reason: user_revoked_on_trusted_surface
                    affected_sessions:
                    - ses_01HZXD
              binding_paused:
                summary: Gateway pause because the rail binding is no longer eligible; the gateway removes this reason on a newer registry
                  version in which the binding is eligible again
                value:
                  event_id: evt_01HZXS
                  type: mandate.status_changed
                  created_at: '2026-10-25T08:00:03+05:30'
                  data:
                    mandate_id: mdt_PAY7Q2W9X4K1M3
                    status: PAUSED
                    reason: binding_ineligible
                    pause_reasons:
                    - binding_ineligible
                    registry_version: '2026-10-17'
                    affected_sessions:
                    - ses_01HZXD
              principal_paused_during_binding_pause:
                summary: The principal pauses on the Trusted Surface while a binding pause is in force; both reasons are kept
                value:
                  event_id: evt_01HZXT
                  type: mandate.status_changed
                  created_at: '2026-10-25T09:12:40+05:30'
                  data:
                    mandate_id: mdt_PAY7Q2W9X4K1M3
                    status: PAUSED
                    reason: principal_paused
                    pause_reasons:
                    - binding_ineligible
                    - principal_paused
                    registry_version: '2026-10-17'
                    affected_sessions: []
      responses:
        '200':
          description: Acknowledged
  session.updated:
    post:
      summary: Full session snapshot, e.g. step-up required or approved, payment resolved after in-doubt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  payment.receipt:
    post:
      summary: A payment or refund receipt was applied. The body carries a ReceiptRef, never the signed receipt; GET the session, order or return
        for the full receipt and check its hash against receipt_hash.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  data:
                    type: object
                    required:
                    - receipt
                    properties:
                      session_id:
                        type: string
                      order_id:
                        type: string
                      receipt:
                        $ref: '#/components/schemas/ReceiptRef'
            examples:
              paid:
                value:
                  event_id: evt_01HZXP
                  type: payment.receipt
                  created_at: '2026-10-20T19:02:12+05:30'
                  data:
                    session_id: ses_01HZXD
                    receipt:
                      receipt_id: rcpt_PAY0000000001
                      receipt_hash: sha-256:PWyy8xS6oduROAtRGV3LSx8A3hJx9mdOj0XhZDcrUME
                      receipt_type: payment
                      result: success
                      amount:
                        value: 30200
                        currency: INR
                      rail:
                        type: in.upi.reservepay
                        rrn: '629318004417'
                        status: SUCCESS
      responses:
        '200':
          description: Acknowledged
  order.updated:
    post:
      summary: Full order snapshot from unsolicited on_status, on_cancel or on_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  return.updated:
    post:
      summary: Return or refund state change
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  issue.updated:
    post:
      summary: IGM on_issue respondent action (PROCESSING, INFO_REQUESTED, RESOLUTION_PROPOSED, RESOLUTION_CASCADED, RESOLVED)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  pre_debit.notice:
    post:
      summary: Pre-debit notice, at least 24 h before an unattended debit, with opt-out. Issued for UPI AutoPay and other e-mandates (RBI E-mandate
        Framework 2026), for the second and every later debit on a UPI Reserve Pay or OTM binding, and for NACH debits (BACP policy). The agent
        MUST relay it to the user and MUST NOT dismiss it.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
components:
  securitySchemes:
    httpSignature:
      type: apiKey
      in: header
      name: Signature
      description: 'RFC 9421 HTTP Message Signature with RFC 9530 Content-Digest. Covered components MUST include @method, @authority,

        @path, content-digest and bacp-agent (except under tags bacp-ts and bacp-handoff, where the request is signed with a registry key and

        the BACP-Agent header is absent and not covered);

        idempotency-key on every non-GET request; and @query whenever the target URI has a query component. content-type SHOULD be

        covered whenever the request has a body. A signature that lacks a required component is rejected with 401 signature_invalid.

        Parameters MUST include created, expires (expires - created <= 300 s), nonce, keyid and tag (bacp-browse, bacp-pay,

        bacp-post-order, bacp-negotiate, bacp-ts or bacp-handoff). Keys: AgentCredential.cnf.jwk (agents) or the registry record

        (MM, PSP, BAP, support operator). Algorithms: every verifier MUST support both ES256 and EdDSA (Ed25519); every signer

        MUST use one of the two, and any other algorithm is rejected with 401 signature_invalid (settled in Q-42).

        '
    agentCredential:
      type: apiKey
      in: header
      name: BACP-Agent
      description: SD-JWT VC (vct in.bacp.agent.1) with only the disclosures the gateway needs. Checked against the registry status list. Covered
        by the request signature. The legacy header name BACP-Agent-Credential was accepted only before the first dated release (`2026-10-17`);
        a gateway MUST NOT accept it.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 128-bit or more random value (UUIDv4 or ULID). Required on every POST and PUT.
      schema:
        type: string
        minLength: 22
        maxLength: 64
      example: 01HZX8W3T6Q9M2R7C4B1N8K5D0
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      schema:
        type: string
      example: sig1=("@method" "@authority" "@path" "content-digest" "content-type" "idempotency-key" "bacp-agent");created=1792501322;expires=1792501622;nonce="q8Fz1V2w";keyid="sakhi-2026-10";alg="ecdsa-p256-sha256";tag="bacp-pay"
    Signature:
      name: Signature
      in: header
      required: true
      schema:
        type: string
      example: 'sig1=:MEUCIQDexampleSignatureBase64Value=:'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^ses_[A-Za-z0-9]{8,40}$
    MandateId:
      name: mandate_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^mdt_[A-Za-z0-9]{12,40}$
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    NegotiationId:
      name: negotiation_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^neg_[A-Za-z0-9]{8,40}$
    RfqId:
      name: rfq_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^rfq_[A-Za-z0-9]{8,40}$
    AuctionId:
      name: auction_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^auc_[A-Za-z0-9]{8,40}$
  responses:
    BadRequest:
      description: Invalid request (invalid_request, mandate_schema_invalid, receipt_invalid, NEG_SCHEMA_INVALID, …) or a missing or malformed
        Idempotency-Key (idempotency_key_required).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingKey:
              value:
                type: invalid_request
                code: idempotency_key_required
                message: Idempotency-Key header is required
                param: $.headers.Idempotency-Key
    Unauthorized:
      description: Signature, credential or replay failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            replay:
              value:
                type: authentication_error
                code: replay_detected
                message: Signature nonce already seen within window
                resolution: unrecoverable
                param: $.headers.Signature-Input
            unregistered:
              value:
                type: authentication_error
                code: agent_unregistered
                message: Signing key or AgentCredential not found in the registry
                resolution: unrecoverable
            revoked:
              value:
                type: authentication_error
                code: agent_credential_revoked
                message: AgentCredential is revoked on its status list
                resolution: unrecoverable
    Forbidden:
      description: Caller is not allowed to use this endpoint or resource (trusted_surface_only, evidence_forbidden), or a Trusted Surface
        event does not match what the gateway asked the Trusted Surface to show (ts_render_mismatch, presence_not_proven).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            agentOnTsEndpoint:
              value:
                type: authorization_error
                code: trusted_surface_only
                message: Only a registered Mandate Manager or payer PSP may call this endpoint
            evidence:
              value:
                type: authorization_error
                code: evidence_forbidden
                message: Not a party of record for this transaction
                resolution: unrecoverable
            renderMismatch:
              value:
                type: authorization_error
                code: ts_render_mismatch
                message: presentation.content_hash is not the hash of the ts_render of stp_01HZXA
                param: $.presentation.content_hash
                resolution: unrecoverable
    MandateRejected:
      description: Deterministic mandate verification, the post-order gate or a guard refused the request (fail closed). Carries a 403 code from
        the error registry, for example a mandate_error code, cancel_not_allowed, return_not_allowed or a NEG_* guard code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            revoked:
              value:
                type: mandate_error
                code: mandate_revoked
                message: Mandate mdt_PAY7Q2W9X4K1M3 is REVOKED
                param: $.mandate_ref
                resolution: requires_buyer_input
            outOfScope:
              value:
                type: mandate_error
                code: mandate_scope_mismatch
                message: Category ONDC:RET12 not in categories_allow
                param: $.items[0]
                resolution: requires_buyer_review
            presenceNotProven:
              value:
                type: mandate_error
                code: presence_not_proven
                message: presence HP without hp_proof of a Trusted Surface confirmation of this write
                param: $.hp_proof
                resolution: requires_buyer_review
                step_up:
                  step_up_id: stp_01HZPO7K2M
                  kind: post_order
                  reason: presence_proof
                  trusted_surface_url: https://psp.example.in/approve/stp_01HZPO7K2M
                  ts_render: eyJhbGciOiJFUzI1NiJ9.eyJzdGVwX3VwX2lkIjoic3RwXzAxSFpQTzdLMk0ifQ.c2ln
                  delivery: app_push
                  expires_at: '2026-10-23T09:15:00+05:30'
            railCap:
              value:
                type: mandate_error
                code: rail_limit_exceeded
                message: Amount exceeds Reserve Pay block remaining balance
                param: $.totals
                resolution: requires_buyer_review
                reasons:
                - rail:block_remaining_exceeded
                step_up_kind: rail_auth
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                type: invalid_request
                code: not_found
                message: Resource not found or not visible to the caller
                resolution: unrecoverable
    InFlight:
      description: Same Idempotency-Key is still being processed (idempotency_in_flight, with Retry-After), or the operation is not allowed in
        the resource's current state (session_state_conflict).
      headers:
        Retry-After:
          schema:
            type: integer
          example: 2
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            inFlight:
              value:
                type: invalid_request
                code: idempotency_in_flight
                message: Request with this key is in progress
            stateConflict:
              value:
                type: invalid_request
                code: session_state_conflict
                message: session is incomplete; PUT the session first
                param: $.status
                resolution: recoverable
    IdempotencyConflict:
      description: 'Same Idempotency-Key with a different body (idempotency_conflict). The same status carries other 422 codes from the error
        registry: evidence_unverifiable, NEG_ACCEPT_NONCONFORMING, NEG_CLOCK_SKEW.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                type: invalid_request
                code: idempotency_conflict
                message: Idempotency-Key reused with a different request body
    BppTimeout:
      description: No on_* callback within the facade wait window. Session remains retrievable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            timeout:
              value:
                type: upstream_error
                code: bpp_timeout
                message: on_select not received within 5000 ms
    StaleOffer:
      description: The message cites an offer that is not LIVE (NEG_STALE_OFFER; GET the negotiation and respond to the live offer). The same
        status carries idempotency_in_flight (with Retry-After), bid_not_improving and auction_not_open.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stale:
              value:
                type: invalid_request
                code: NEG_STALE_OFFER
                message: in_reply_to is not the live offer
                param: $.in_reply_to
            notImproving:
              value:
                type: invalid_request
                code: bid_not_improving
                message: Bid does not improve on your previous bid by the increment
                param: $.amount
                resolution: recoverable
    BppNack:
      description: The seller NACKed the Beckn request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            nack:
              value:
                type: upstream_error
                code: bpp_nack
                message: Seller NACKed the Beckn request
                resolution: recoverable
    RequestTooLarge:
      description: Request body above the gateway limit; refused before signature verification (request_too_large).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooLarge:
              value:
                type: invalid_request
                code: request_too_large
                message: Request body exceeds 262144 bytes
                resolution: unrecoverable
    QuotaExceeded:
      description: Per-agent idempotency-key quota exhausted, or a rate limit exceeded (render fetches per caller key, post_order step-up creation per agent) (quota_exceeded).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            quota:
              value:
                type: invalid_request
                code: quota_exceeded
                message: Too many live idempotency keys for this agent
                resolution: recoverable
      headers:
        Retry-After:
          schema:
            type: integer
          example: 5
    ServiceUnavailable:
      description: The idempotency store is unavailable; writes fail closed (idempotency_store_unavailable).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            storeDown:
              value:
                type: service_unavailable
                code: idempotency_store_unavailable
                message: Idempotency store unreachable; request not processed
                resolution: recoverable
  schemas:
    Amount:
      type: object
      description: Integer minor units (paise) per ISO 4217, as in UCP, ACP and AP2.
      required:
      - value
      - currency
      properties:
        value:
          type: integer
          minimum: 0
        currency:
          const: INR
      additionalProperties: false
    Hash:
      type: string
      description: Multihash-style 'alg:base64url'. sha-256 is mandatory, blake2b-512 allowed for Beckn digests.
      pattern: ^(sha-256|blake2b-512):[A-Za-z0-9_-]{43,88}$
    Jws:
      type: string
      description: Compact JWS or SD-JWT (with ~ separators). Payload canonicalised with JCS (RFC 8785).
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+(~[A-Za-z0-9_.~-]*)?$
    Jwk:
      type: object
      required:
      - kty
      properties:
        kty:
          enum:
          - EC
          - OKP
        crv:
          enum:
          - P-256
          - Ed25519
        x:
          type: string
        y:
          type: string
        kid:
          type: string
    Signature:
      type: object
      required:
      - kid
      - alg
      - value
      properties:
        role:
          enum:
          - principal
          - mandate_manager
          - psp
          - agent
          - agent_provider
          - bap
          - bpp
          - registry
          - operator
          - support_operator
          - conformance_authority
          description: The registry role of the key that made this signature. conformance_authority signs conformance attestations only, and
            only for a key that appears in the public conformance-authority list.
        kid:
          type: string
          description: Registry-resolvable key id, e.g. 'bap.example.in|ukid-7|ed25519' or a did:web#fragment
        alg:
          enum:
          - ES256
          - EdDSA
          description: "Signature algorithm. Every verifier of a BACP signature MUST support both ES256 (ECDSA P-256 with SHA-256) and EdDSA (Ed25519); every signer MUST use one of the two, and a signature with any other algorithm MUST be rejected (settled in Q-42)."
        value:
          $ref: '#/components/schemas/Jws'
      additionalProperties: false
    Presence:
      enum:
      - HP
      - HNP
      description: Human present / human not present (AP2 section 4.2).
    LangText:
      type: object
      description: 'Multilingual map keyed by BCP 47 tag, e.g. {"hi-IN": "...", "en-IN": "..."}.'
      propertyNames:
        pattern: ^[a-z]{2,3}(-[A-Za-z]{4})?(-[A-Z]{2})?$
      additionalProperties:
        type: string
      minProperties: 1
    RailType:
      type: string
      pattern: ^(upi\.circle\.delegate|upi\.reservepay\.block|upi\.autopay|upi\.uap\.[a-z0-9_.]+)$
    Channel:
      $ref: ../schemas/common.json#/$defs/Channel
    LanguageTag:
      $ref: ../schemas/common.json#/$defs/LanguageTag
    Presentation:
      $ref: ../schemas/common.json#/$defs/Presentation
    Participant:
      $ref: ../schemas/common.json#/$defs/Participant
    ParticipantRole:
      $ref: ../schemas/common.json#/$defs/ParticipantRole
    HandoffRoute:
      $ref: ../schemas/common.json#/$defs/HandoffRoute
    HpProof:
      $ref: ../schemas/common.json#/$defs/HpProof
    StepUpRender:
      type: object
      description: Response of GET /trusted-surface/step-ups/{step_up_id}. The gateway-signed render input of one step-up, served byte-identical
        on every fetch.
      required:
      - step_up_id
      - ts_render
      - expires_at
      properties:
        step_up_id:
          type: string
        ts_render:
          $ref: '#/components/schemas/Jws'
        expires_at:
          type: string
          format: date-time
    Handoff:
      type: object
      description: A handoff of the session to a human. Requested while accepted_by is absent; connected once a registered human support operator
        has accepted it; ended once ended_at is set by a release.
      required:
      - route
      - requested_at
      properties:
        route:
          $ref: '#/components/schemas/HandoffRoute'
        requested_at:
          type: string
          format: date-time
        accepted_by:
          type: string
          description: Registry key id of the human support operator who accepted, verified from a request signed under tag bacp-handoff by a
            key whose registry role is support operator. Never an agent key.
        accepted_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: When the handoff was released (action release) and the session returned to incomplete.
    HandoffRequest:
      type: object
      required:
      - action
      properties:
        action:
          enum:
          - request
          - accept
          - release
          description: request (by the agent, tag bacp-browse), accept (by a human support operator, tag bacp-handoff) or release (by the
            support operator who accepted, tag bacp-handoff, or by the agent, tag bacp-browse, only while the handoff is not yet accepted).
        route:
          $ref: '#/components/schemas/HandoffRoute'
          description: One of the routes in Session.ai_disclosure.handoff_routes. REQUIRED with action request when the session lists
            handoff_routes; otherwise omitted.
    Handler:
      enum:
      - upi.circle.delegate
      - upi.reservepay.block
      - upi.autopay
      - upi.lite
      - upi.123pay
      - rupay.token
      - erupi
      - erupee
      - bbps
      - cod
      description: Legacy BACP payment handler ids. upi.uap.* is reserved and validated by RailType.
    AgentCredential:
      title: AgentCredential
      description: Claims of an SD-JWT VC (vct in.bacp.agent.1) issued by a registry-accredited issuer to an agent operated by a registered legal
        entity and bound to a BAP subscriber.
      type: object
      required:
      - vct
      - iss
      - sub
      - iat
      - exp
      - operator
      - bap
      - agent
      - cnf
      - purposes
      - disclosure
      - status
      properties:
        vct:
          const: in.bacp.agent.1
        iss:
          type: string
          format: uri
          description: 'Issuer: ONDC registry / DeDi record or accredited issuer'
        sub:
          type: string
          description: Agent id, e.g. did:web:agents.example.in:krishi-voice or urn:bacp:agent:...
        iat:
          type: integer
        exp:
          type: integer
          description: <= iat + 180 days (key rotation)
        operator:
          type: object
          required:
          - legal_name
          - entity_id
          - grievance_officer
          properties:
            legal_name:
              type: string
            entity_id:
              type: object
              required:
              - type
              - value
              properties:
                type:
                  enum:
                  - CIN
                  - LLPIN
                  - GSTIN
                  - PAN
                value:
                  type: string
            grievance_officer:
              type: object
              required:
              - name
              - email
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
            incident_contact:
              type: string
              format: email
            ai_inventory_ref:
              type: string
              format: uri
              description: FREE-AI Rec 23 inventory entry
        bap:
          type: object
          required:
          - subscriber_id
          - ukid
          properties:
            subscriber_id:
              type: string
              description: ONDC/Beckn bap_id (FQDN)
            ukid:
              type: string
        agent:
          type: object
          required:
          - class
          - model_family
          - build
          properties:
            class:
              enum:
              - shopping
              - voice_shopping
              - assisted
              - sub_agent
            model_family:
              type: string
            build:
              type: string
              description: Release or build hash of the agent runtime
            channels:
              type: array
              items:
                $ref: '#/components/schemas/Channel'
            languages:
              type: array
              items:
                type: string
            uap_agent_id:
              type:
              - string
              - 'null'
              description: Reserved for an NPCI UAP registry id once published
        cnf:
          type: object
          required:
          - jwk
          properties:
            jwk:
              $ref: '#/components/schemas/Jwk'
          description: RFC 7800 key binding. The same key signs RFC 9421 requests and KB-JWTs that close open mandates.
        purposes:
          type: array
          minItems: 1
          items:
            enum:
            - bacp-browse
            - bacp-pay
            - bacp-post-order
            - bacp-negotiate
          description: RFC 9421 signature tags this key may use (Visa TAP-style browse/pay split).
        disclosure:
          type: object
          required:
          - ai_notice
          - human_handoff_url
          properties:
            ai_notice:
              $ref: '#/components/schemas/LangText'
            human_handoff_url:
              type: string
              format: uri
              description: Web page that leads to a human. Kept for compatibility; typed routes are in handoff_routes.
            handoff_routes:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/HandoffRoute'
              description: Typed routes to a human. MUST contain a tel route (with or without DTMF digits) when agent.channels includes voice, ivr
                or upi123pay. A route stays usable after the principal's mandate is revoked.
            compensation_model:
              enum:
              - none
              - seller_paid
              - principal_paid
              - mixed
              description: How the agent operator is paid, which is not at all, by sellers, by the principal, or by both. OPTIONAL. When present, the operator_compensation
                of every mandate request signed with this credential MUST be consistent with it.
        data_residency:
          type: object
          description: "Optional data-residency statement (fail-safe default until Q-15 is settled). A gateway MUST NOT treat a missing or incomplete data_residency statement as permission to send payment data outside India; a gateway, Mandate Manager or PSP adapter stores and processes payment data only in India."
          properties:
            payment_data:
              const: IN
              description: "Where payment data is stored and processed. Always IN (RBI Storage of Payment System Data, RBI/2017-18/153, 06-04-2018)."
            llm_region:
              type: string
              description: "Region in which the agent operator's language model processes data it receives, e.g. IN."
            log_region:
              type: string
              description: "Region in which the agent operator's logs are stored, e.g. IN."
            transfer_basis:
              type: string
              description: "Legal basis for any cross-border transfer of other personal data (DPDP Act s.16 and Rule 15, from 13-05-2027). Never a basis for sending payment data abroad."
        conformance:
          type: object
          description: The conformance levels the agent's stack has passed, with the signed attestation.
          required:
          - levels
          - attestation
          properties:
            levels:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: ../schemas/common.json#/$defs/ConformanceLevel
            attestation:
              $ref: '#/components/schemas/Jws'
          additionalProperties: false
        status:
          type: object
          required:
          - status_list
          properties:
            status_list:
              type: object
              required:
              - uri
              - idx
              properties:
                uri:
                  type: string
                  format: uri
                idx:
                  type: integer
                  minimum: 0
      allOf:
      - description: When agent.channels includes voice, ivr or upi123pay, disclosure.handoff_routes MUST contain a tel URI route (with or
          without DTMF digits).
        if:
          properties:
            agent:
              properties:
                channels:
                  contains:
                    enum:
                    - voice
                    - ivr
                    - upi123pay
              required:
              - channels
          required:
          - agent
        then:
          properties:
            disclosure:
              required:
              - handoff_routes
              properties:
                handoff_routes:
                  contains:
                    properties:
                      uri:
                        pattern: '^tel:'
                    required:
                    - uri
    Mandate:
      title: Mandate
      description: AP2 v0.2-compatible Checkout or Payment mandate, open or closed, with AA consent-artefact semantics. Everything except status,
        usage and signatures is signed and immutable.
      type: object
      required:
      - vct
      - mandate_id
      - kind
      - form
      - iss
      - iat
      - valid_from
      - valid_until
      - principal
      - agent
      - purpose
      - action_scope
      - presence_allowed
      - constraints
      - revocation
      - signatures
      properties:
        vct:
          enum:
          - in.bacp.mandate.checkout.open.1
          - in.bacp.mandate.checkout.1
          - in.bacp.mandate.payment.open.1
          - in.bacp.mandate.payment.1
        ap2_vct:
          enum:
          - mandate.checkout.open.1
          - mandate.checkout.1
          - mandate.payment.open.1
          - mandate.payment.1
          description: AP2 v0.2 type this mandate is wire-compatible with
        mandate_id:
          type: string
          pattern: ^mdt_[A-Za-z0-9]{12,40}$
        parent_mandate_id:
          type:
          - string
          - 'null'
          description: Open mandate this one narrows (closed mandate or sub-agent delegation). Scope and expiry may only narrow.
        checkout_mandate_ref:
          type: string
          description: 'Payment mandates only: the checkout mandate this payment authority is bound to (AP2 payment.reference, REQUIRED)'
        kind:
          enum:
          - checkout
          - payment
        form:
          enum:
          - open
          - closed
        iss:
          type: string
          description: Mandate Manager / Trusted Surface subscriber id
        iat:
          type: integer
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        principal:
          type: object
          required:
          - ref
          properties:
            ref:
              type: string
              description: Pairwise pseudonymous user id at the Mandate Manager. Never an Aadhaar number.
            assurance:
              enum:
              - vpa_pin
              - aadhaar_vc
              - digilocker
              - passkey
        agent:
          type: object
          required:
          - id
          - credential_hash
          properties:
            id:
              type: string
            credential_hash:
              $ref: '#/components/schemas/Hash'
        purpose:
          type: object
          required:
          - code
          - text
          properties:
            code:
              type: string
              pattern: ^P-[A-Z]{3}-[0-9]{2}$
              description: "Code from the BACP purpose-code registry (Sahamati Fair Use analogue), e.g. P-GRO-01 household grocery replenishment. The purpose fixes the categories, maximum validity, monetary bounds and data scopes the mandate may request. The registry is governed by the BACP working group: a new code or a changed bound ships only in a dated release. A purpose_code that is not in the registry MUST be refused with 403 mandate_scope_mismatch (settled in Q-47)."
            text:
              $ref: '#/components/schemas/LangText'
        action_scope:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - DISCOVER
            - QUOTE
            - ORDER
            - PAY
            - CANCEL
            - RETURN
            - RAISE_ISSUE
            - SHARE_DATA
        data_scopes:
          type: array
          uniqueItems: true
          items:
            enum:
            - NAME
            - PHONE
            - DELIVERY_ADDRESS
            - EMAIL
            - AGE_OVER_18
            - GSTIN
            - ACTING_FOR
        presence_allowed:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Presence'
        constraints:
          type: object
          description: 'Evaluated fail-closed by deterministic code: unknown keys fail (AP2 agent_authorization).'
          properties:
            amount_per_txn:
              $ref: '#/components/schemas/Amount'
            budgets:
              type: array
              items:
                type: object
                required:
                - period
                - max
                properties:
                  period:
                    enum:
                    - P1D
                    - P7D
                    - P1M
                    - FIRST_24H
                    - LIFETIME
                  max:
                    $ref: '#/components/schemas/Amount'
                additionalProperties: false
            max_executions:
              type: integer
              minimum: 1
            categories_allow:
              type: array
              items:
                type: string
              description: ONDC domain or category codes, e.g. ONDC:RET10, RET10-Staples
            categories_deny:
              type: array
              items:
                type: string
            merchants_allow:
              type: array
              items:
                type: object
                required:
                - bpp_id
                properties:
                  bpp_id:
                    type: string
                  provider_id:
                    type: string
            delivery_pincodes:
              type: array
              items:
                type: string
                pattern: ^[1-9][0-9]{5}$
            line_items:
              type: array
              items:
                type: object
                required:
                - item_id
                - qty_max
                properties:
                  item_id:
                    type: string
                  qty_max:
                    type: integer
                    minimum: 1
            step_up:
              type: object
              properties:
                above_amount:
                  $ref: '#/components/schemas/Amount'
                new_merchant:
                  type: boolean
                outside_categories:
                  type: boolean
                first_order:
                  type: boolean
            reject_preticked_addons:
              const: true
            cod_allowed:
              type: boolean
            cod_max_open_orders:
              type: integer
              minimum: 0
              description: Open COD orders an agent may hold HNP.
            credit_funding_allowed:
              type: boolean
              description: Credit-funded handlers allowed.
            convenience_fees:
              type: object
              description: Whether the agent may pay a convenience fee on its own, in a human-not-present checkout. When the field is absent, or a convenience
                fee is not covered by it, a convenience fee line raises a confirm step-up (reason constraint_unresolved) before any money moves. A fee is
                covered when allowed is true and the fee, in total for the order, is at or below max_per_order (or max_per_order is absent).
              required:
              - allowed
              properties:
                allowed:
                  type: boolean
                max_per_order:
                  $ref: ../schemas/common.json#/$defs/Amount
                  description: The largest total of convenience fee lines of one order that the agent may pay without asking. Meaningful only when allowed is true.
              if:
                properties:
                  allowed:
                    const: false
                required:
                - allowed
              then:
                not:
                  required:
                  - max_per_order
              additionalProperties: false
          additionalProperties: false
        checkout_hash:
          $ref: '#/components/schemas/Hash'
          description: 'Closed mandates only: hash of the BPP-signed quote / checkout (AP2 checkout_hash)'
        amount:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
          description: 'Closed mandates only: exact payable amount, greater than zero'
        payee:
          type: object
          description: The party a payment under this mandate is paid to. An open Payment Mandate whose rail_binding.primitive is sbmd_block (a
            UPI Reserve Pay block) MUST name the block's payee seller (vpa, equal to the VPA in that seller's BPP-signed payment terms, and bpp_id).
            The Mandate Manager refuses a Reserve Pay mandate request without it (403 mandate_scope_mismatch at $.payee).
          properties:
            vpa:
              type: string
              description: The payee's UPI virtual payment address.
            bap_id:
              type: string
              description: The buyer app, where the buyer app collects (collected_by BAP). Never the payee of a Reserve Pay block used human-not-present.
            bpp_id:
              type: string
              description: The seller app (BPP subscriber id) of the payee seller, for a payee-bound primitive such as a Reserve Pay block.
        rail_binding:
          type: object
          required:
          - type
          - primitive
          - rail_ref
          - psp_id
          - attestation
          - registry_version
          properties:
            type:
              anyOf:
              - $ref: '#/components/schemas/RailType'
              - $ref: ../schemas/common.json#/$defs/RailTypeV1
              description: 'Any class-O handler (binding rule B-1; RailTypeV1) or a legacy RailType alias. Class C/A/D/N ids never validate here.
                Schema validity is not eligibility: the resolved descriptor''s open_eligible, open_primitives and status decide.'
            primitive:
              $ref: ../schemas/common.json#/$defs/MandatePrimitiveType
              description: 'The mandate primitive that carries this standing authority: one of the bound handler''s mandate_primitives[].type, for
                example sbmd_block or ppi_emandate. Covered by the PSP attestation. It MUST be listed in the handler descriptor''s binding.open_primitives;
                otherwise the Mandate Manager refuses issuance and the gateway refuses the binding with rail_binding_not_open_eligible.'
            rail_ref:
              type: string
              description: UMN / SBMD block id / Circle delegation id as issued by the payer PSP
            psp_id:
              type: string
            attestation:
              $ref: '#/components/schemas/Jws'
              description: 'PSP-signed statement {rail_ref, type, primitive, limits, expiry, payee, funding} hashed into this mandate. funding is
                deposit or credit: the source of funds behind the primitive (for a Reserve Pay block, a savings, current or overdraft account is
                deposit; a RuPay credit card or a pre-sanctioned credit line is credit).'
            registry_version:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: 'The handler-registry version against which the Mandate Manager checked this binding''s eligibility at issuance: the
                identifier of the dated BACP release (YYYY-MM-DD, for example 2026-10-17), never a copy served by a gateway. A version format for
                registry-signed snapshots is not yet defined, so only a release date is valid. A record of the issuance check only; the gateway
                re-checks eligibility against the current registry at every complete.'
            conformance:
              type: object
              required:
              - iss
              - sub
              - jti
              properties:
                iss:
                  type: string
                  minLength: 1
                  description: The ca_id of the conformance authority that signed the gateway's attestation.
                sub:
                  type: string
                  minLength: 1
                  description: The gateway that the attestation is about. At complete, the gateway refuses the mandate when this is not itself.
                jti:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{8,64}$
                  description: The jti of the attestation. The gateway re-checks its status at every complete, and a pause for a lapsed attestation
                    logs it.
              additionalProperties: false
              description: 'The conformance attestation that admitted the bound handler as a pilot, as the Mandate Manager verified it at issuance:
                {iss, sub, jti}. A conformance rule REQUIRES it on every open payment mandate bound to a pilot handler; the schema leaves it optional
                because a live handler needs none. It is part of the signed, immutable mandate.'
            rail_limits:
              type: object
              properties:
                per_txn:
                  $ref: '#/components/schemas/Amount'
                per_month:
                  $ref: '#/components/schemas/Amount'
                first_24h:
                  $ref: '#/components/schemas/Amount'
                block_amount:
                  $ref: '#/components/schemas/Amount'
                  description: The amount of a Reserve Pay block as the payer PSP attests it. It is at most the block_amount the mandate request
                    asked for; under a root open Checkout Mandate it counts as reserved spend at its full amount until its revocation at the rail is
                    confirmed or it expires.
                expires_at:
                  type: string
                  format: date-time
                  description: When the rail authority expires. For a Reserve Pay block bound under a root open Checkout Mandate it is no later than
                    the root's valid_until.
            pre_debit_notice:
              enum:
              - required_24h
              - not_applicable
              - unknown
              - bacp_policy_24h
              - post_debit_notice
          description: 'OPEN payment mandates only: binding to a live standing-authority primitive whose limits the rail or the issuer enforces
            (listed in the descriptor''s binding.open_primitives). upi.uap.* reserved.'
        auth_binding:
          type: object
          required:
          - type
          description: 'CLOSED payment mandates only: how this single payment is authorised. Either it executes under the parent open mandate''s
            rail_binding (HNP), or it carries a per-transaction user 2FA reference (HP) or another closed-class instrument.'
          properties:
            type:
              enum:
              - parent_rail_binding
              - upi.pin
              - upi.biometric
              - card.3ds
              - instrument
            handler:
              $ref: ../schemas/common.json#/$defs/HandlerRef
              description: 'The handler that executes the payment: for HNP the parent''s rail_binding.type, for HP the closed-class handler (for
                example in.upi.intent). Any canonical id or legacy alias; compared after alias resolution.'
            ref:
              type: string
              description: 2FA/authentication reference from the PSP or issuer, or the parent rail_ref
            psp_id:
              type: string
        dpdp:
          type: object
          properties:
            consent_receipts:
              type: array
              items:
                type: string
            data_retention:
              type: string
              description: ISO 8601 duration imposed on recipients, e.g. P1Y
        revocation:
          type: object
          required:
          - status_uri
          properties:
            status_uri:
              type: string
              format: uri
            status_list:
              type: object
              properties:
                uri:
                  type: string
                  format: uri
                idx:
                  type: integer
            notify_sla_seconds:
              type: integer
              maximum: 60
        audit_uri:
          type: string
          format: uri
        cnf:
          type: object
          required:
          - jwk
          properties:
            jwk:
              $ref: '#/components/schemas/Jwk'
          description: Agent key allowed to close this open mandate (AP2 section 4.1)
        signatures:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Signature'
        status:
          readOnly: true
          enum:
          - PENDING
          - ACTIVE
          - PAUSED
          - REVOKED
          - EXPIRED
          - EXHAUSTED
          - REJECTED
        usage:
          readOnly: true
          type: object
          properties:
            count:
              type: integer
            spent:
              type: array
              items:
                type: object
                properties:
                  period:
                    type: string
                  amount:
                    $ref: '#/components/schemas/Amount'
                  window_start:
                    type: string
                    format: date-time
            last_used_at:
              type: string
              format: date-time
      allOf:
      - if:
          properties:
            form:
              const: open
        then:
          required:
          - cnf
      - if:
          properties:
            form:
              const: closed
        then:
          required:
          - checkout_hash
          - amount
          - parent_mandate_id
      - if:
          properties:
            kind:
              const: payment
          required:
          - kind
        then:
          required:
          - checkout_mandate_ref
      - if:
          properties:
            kind:
              const: payment
            form:
              const: open
          required:
          - kind
          - form
        then:
          required:
          - rail_binding
      - if:
          properties:
            kind:
              const: payment
            form:
              const: closed
          required:
          - kind
          - form
        then:
          required:
          - auth_binding
          not:
            required:
            - rail_binding
      - description: An open mandate carries data scopes, an audit URI, a retention period and at least one frequency bound.
        if:
          properties:
            form:
              const: open
          required:
          - form
        then:
          required:
          - data_scopes
          - audit_uri
          - dpdp
          properties:
            dpdp:
              required:
              - data_retention
            constraints:
              anyOf:
              - required:
                - budgets
              - required:
                - max_executions
    ConsentReceipt:
      title: ConsentReceipt (DPDP)
      description: One receipt per recipient Data Fiduciary (merchant/BPP) per mandate. Issued by the data-blind Mandate Manager acting as (or
        for) a DPDP Consent Manager.
      type: object
      required:
      - receipt_id
      - iss
      - issued_at
      - principal_ref
      - mandate_ref
      - recipient
      - data_items
      - purpose
      - legal_basis
      - notice
      - captured_via
      - withdrawal
      - grievance
      - retention
      - signature
      properties:
        receipt_id:
          type: string
          pattern: ^cr_[A-Za-z0-9]{12,40}$
        iss:
          type: string
        cm_registration_no:
          type:
          - string
          - 'null'
          description: "DPDP Board registration number of the Consent Manager (DPDP Rules 2025, Rule 4). On receipts issued on or after 13-11-2026 it MUST be the Board registration number when the Mandate Manager acts as a registered Consent Manager, and MUST be null otherwise (fail-safe default until Q-16 is settled)."
        issued_at:
          type: string
          format: date-time
        principal_ref:
          type: string
        mandate_ref:
          type: string
        recipient:
          type: object
          required:
          - fiduciary_name
          - bpp_id
          properties:
            fiduciary_name:
              type: string
            bpp_id:
              type: string
              description: "The recipient seller's bpp_id. \"*\" marks a class receipt, scoped to the mandate's categories, which only pre-authorises: the MM MUST mint a per-seller ConsentReceipt, whose recipient.bpp_id is that seller, at init and before any personal data reaches the seller; no data is ever released on the strength of a class receipt alone (settled in Q-12)."
            provider_id:
              type: string
            dpo_contact:
              type: string
        data_items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - field
            - form
            properties:
              field:
                enum:
                - NAME
                - PHONE
                - DELIVERY_ADDRESS
                - EMAIL
                - AGE_OVER_18
                - GSTIN
              form:
                enum:
                - plain
                - masked
                - selective_disclosure_vc
                - token
        purpose:
          type: object
          required:
          - code
          - text
          properties:
            code:
              type: string
            text:
              $ref: '#/components/schemas/LangText'
            goods_or_services:
              type: string
        legal_basis:
          enum:
          - consent_s6
          - legitimate_use_s7a
        notice:
          type: object
          required:
          - language
          - hash
          - operator_compensation
          properties:
            language:
              type: string
              description: English or an Eighth Schedule language (BCP 47)
            hash:
              $ref: '#/components/schemas/Hash'
            uri:
              type: string
              format: uri
            translation_model:
              type: string
            operator_compensation:
              $ref: ../schemas/common.json#/$defs/OperatorCompensation
              description: 'The operator compensation the principal saw in the notice. REQUIRED: a Mandate Manager MUST NOT activate a mandate whose notice did not state it.'
        captured_via:
          type: object
          required:
          - surface
          - user_action
          - device_signature
          properties:
            surface:
              type: string
              description: Trusted Surface id (PSP app or Mandate Manager app), never the agent
            user_action:
              enum:
              - tap_confirm
              - upi_pin
              - biometric
              - passkey
              - voice_confirm_plus_device
            device_signature:
              $ref: '#/components/schemas/Jws'
            voice_evidence:
              type: object
              properties:
                audio_hash:
                  $ref: '#/components/schemas/Hash'
                transcript_hash:
                  $ref: '#/components/schemas/Hash'
                translation_model:
                  type: string
            presentation:
              $ref: '#/components/schemas/Presentation'
              description: What the Trusted Surface presented and how. OPTIONAL. When present, its user_action equals captured_via.user_action and
                its language equals notice.language.
        withdrawal:
          type: object
          required:
          - uri
          properties:
            uri:
              type: string
              format: uri
            erasure_signal:
              const: true
        grievance:
          type: object
          required:
          - contact
          properties:
            contact:
              type: string
            board_complaint_uri:
              type: string
              format: uri
        retention:
          type: object
          required:
          - recipient_max
          properties:
            recipient_max:
              type: string
              description: ISO 8601 duration
            legal_minimum:
              type: string
              default: P1Y
              description: DPDP Rule 8(3)
        status:
          readOnly: true
          enum:
          - ACTIVE
          - WITHDRAWN
          - EXPIRED
        signature:
          $ref: '#/components/schemas/Signature'
    Receipt:
      title: Receipt (rail-anchored)
      description: Signed by the verifier that acted (AP2 Mandate/Checkout/Payment Receipt). A successful payment or refund receipt on a UPI-family
        handler MUST carry the 12-digit RRN, and carries the UTR only when the handler descriptor's settlement.evidence_refs lists utr. Any other
        successful payment or refund receipt MUST carry at least one of rrn, utr or rail.evidence.
      type: object
      required:
      - receipt_id
      - receipt_type
      - iss
      - issued_at
      - result
      - reference
      - mandate_ref
      - transaction_id
      - signature
      properties:
        receipt_id:
          type: string
          pattern: ^rcpt_[A-Za-z0-9]{12,40}$
        receipt_type:
          enum:
          - mandate
          - checkout
          - payment
          - refund
        iss:
          type: string
          description: 'Verifier: Mandate Manager, BPP, payer PSP'
        issued_at:
          type: string
          format: date-time
        result:
          enum:
          - success
          - failure
          - in_doubt
        error:
          type: string
        reference:
          $ref: '#/components/schemas/Hash'
          description: Hash of the presented (closed) mandate, AP2 Receipt.reference
        mandate_ref:
          type: string
        open_mandate_ref:
          type: string
        primitive:
          $ref: ../schemas/common.json#/$defs/MandatePrimitiveType
          description: The mandate primitive that the payment or refund was made under. A payer-PSP-signed receipt SHOULD echo it together with
            rail.rail_ref, so that the gateway can reconcile the receipt against the mandate's rail_binding; a mismatch with the mandate's primitive
            is an unmatched rail debit.
        transaction_id:
          type: string
          description: Beckn context.transaction_id, end to end
        order_id:
          type: string
        checkout_hash:
          $ref: '#/components/schemas/Hash'
        amount:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
        payee:
          type: object
          properties:
            vpa:
              type: string
            name:
              type: string
        rail:
          type: object
          required:
          - type
          - rail_ref
          - status
          properties:
            type:
              anyOf:
              - $ref: '#/components/schemas/RailType'
              - $ref: ../schemas/common.json#/$defs/HandlerRef
            rail_ref:
              type: string
            rrn:
              type: string
              pattern: ^[0-9]{12}$
            utr:
              type: string
            npci_txn_id:
              type: string
            psp_confirmation_id:
              type: string
            status:
              enum:
              - SUCCESS
              - FAILURE
              - PENDING
              - DEEMED
              - REVERSED
            original_rrn:
              type: string
              description: 'Refund receipts: RRN of the debit being refunded'
            evidence:
              type: object
              additionalProperties:
                type: string
              description: Settlement evidence for non-UPI handlers
          allOf:
          - description: 'UPI-family handlers: RRN is always required. UTR is required only when the handler descriptor''s settlement.evidence_refs
              lists utr; the RRN-only pattern below is generated from handlers/registry.json (upi.uap.pin resolves to in.upi.intent and needs
              a UTR). Other handlers: at least one of rrn, utr or evidence.'
            if:
              properties:
                type:
                  pattern: ^(upi\.|in\.upi\.|in\.cod\.upi$|in\.pos\.(tap|dynamic_qr)$)
              required:
              - type
            then:
              required:
              - rrn
              if:
                properties:
                  type:
                    pattern: ^(in\.upi\.intl|in\.upi\.lite|in\.upi\.uap|in\.upi\.uap\..+|upi\.lite|upi\.uap\.(?!pin$).+)$
                required:
                - type
              else:
                required:
                - utr
            else:
              anyOf:
              - required:
                - rrn
              - required:
                - utr
              - required:
                - evidence
        signature:
          $ref: '#/components/schemas/Signature'
        refund_state:
          enum:
          - pending_cardholder_consent
          - reversed_to_bank_account
          - released_block
          - credit_note_issued
          - refunded_to_source
          - adjusted_against_dues
          description: Refund lifecycle state, including credit-card refund consent and adjustment against B2B dues.
        fx:
          $ref: ../schemas/fx.json
      allOf:
      - if:
          properties:
            receipt_type:
              enum:
              - payment
              - refund
            result:
              const: success
          required:
          - receipt_type
          - result
        then:
          required:
          - rail
          - amount
          - checkout_hash
      - description: budget_after MUST NOT appear in a PSP-signed receipt; the gateway returns it unsigned in session.payment.budget_after.
        not:
          required:
          - budget_after
    InstructionLogEntry:
      title: InstructionLogEntry
      description: Append-only, hash-chained evidence of prompt -> intent -> cart -> mandate -> payment. entry_hash = sha-256(JCS(entry minus
        entry_hash and signature)). Raw content is stored by the operator; only hashes leave it unless an evidence bundle is requested.
      type: object
      required:
      - seq
      - session_id
      - transaction_id
      - stage
      - actor
      - at
      - content_hash
      - prev_hash
      - entry_hash
      - signature
      properties:
        seq:
          type: integer
          minimum: 0
        session_id:
          type: string
        transaction_id:
          type: string
        stage:
          enum:
          - ai_disclosure
          - prompt
          - intent
          - discover
          - cart
          - disclosure
          - mandate
          - step_up
          - payment
          - order
          - post_order
          - grievance
          - negotiation
          - guard
          - ledger
          - handoff
          description: ai_disclosure is the agent presenting the AI disclosure and the human-handoff routes; it is the first entry whose actor is
            agent, before intent. handoff is a handoff to a human being requested, accepted or ended. disclosure is the seller's signed quote and
            disclosures arriving, not the AI disclosure.
        actor:
          enum:
          - user
          - agent
          - gateway
          - trusted_surface
          - bpp
          - psp
          - assisted_operator
          - seller_operator
          - sub_agent
          description: Who performed the step. assisted_operator, seller_operator and sub_agent name a session participant through actor_ref.
        actor_ref:
          type: string
          description: participant_id of the acting participant in the session's participants[] (REQUIRED when actor is assisted_operator,
            seller_operator or sub_agent), or, on a handoff entry, the registry key id of the support operator who accepted it.
        at:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/Channel'
        language:
          type: string
        content_hash:
          $ref: '#/components/schemas/Hash'
        content_ref:
          type: string
          format: uri
          description: Operator-held encrypted blob (transcript, audio, structured intent)
        summary:
          $ref: '#/components/schemas/LangText'
        model:
          type: object
          properties:
            id:
              type: string
            version:
              type: string
            translation_model:
              type: string
        refs:
          type: object
          properties:
            mandate_ref:
              type: string
            checkout_hash:
              $ref: '#/components/schemas/Hash'
            message_id:
              type: string
            order_id:
              type: string
            rrn:
              type: string
            receipt_id:
              type: string
            issue_id:
              type: string
            idempotency_key:
              type: string
              minLength: 22
              maxLength: 64
              description: At stage discover, the Idempotency-Key of the POST /discover. The Beckn message_id of the search derives from it.
            source_digests:
              type: array
              minItems: 1
              description: At stage discover, the source_digest of every discovery source the agent checked.
              items:
                $ref: '#/components/schemas/SourceDigest'
            source_checks:
              type: array
              minItems: 1
              description: At stage discover, the outcome of the agent's check of each discovery source.
              items:
                type: object
                required:
                - source_digest
                - outcome
                properties:
                  source_digest:
                    $ref: '#/components/schemas/SourceDigest'
                  outcome:
                    enum:
                    - verified
                    - mismatch
                    - unverified
                  reason:
                    enum:
                    - discovery_source_unverified
                    - discovery_source_mismatch
                    description: REQUIRED when outcome is not verified, and absent otherwise.
                allOf:
                - if:
                    properties:
                      outcome:
                        const: verified
                    required:
                    - outcome
                  then:
                    not:
                      required:
                      - reason
                  else:
                    required:
                    - reason
            registry_lookup:
              type: string
              description: At stage discover, the host of the registry lookup the agent used to resolve the sellers' keys.
            discount_codes:
              type: array
              minItems: 1
              description: 'At stage cart, each discount code the agent submitted. The code itself is never recorded: code_mac is an HMAC-SHA-256 of
                the code under a per-session key that the operator holds, never a bare hash, because a bare hash of a short code can be guessed and
                a single-use code can be personal.'
              items:
                type: object
                required:
                - code_mac
                - source
                additionalProperties: false
                properties:
                  code_mac:
                    type: string
                    pattern: ^hmac-sha-256:[A-Za-z0-9_-]{43}$
                  source:
                    enum:
                    - principal
                    - agent
                    description: 'Who supplied the code: the principal, or the agent itself (for example an affiliate code of its operator).'
        prev_hash:
          $ref: '#/components/schemas/Hash'
          description: entry_hash of seq-1; genesis uses sha-256 of session_id
        entry_hash:
          $ref: '#/components/schemas/Hash'
        signature:
          $ref: '#/components/schemas/Signature'
      allOf:
      - if:
          properties:
            actor:
              enum:
              - assisted_operator
              - seller_operator
              - sub_agent
          required:
          - actor
        then:
          required:
          - actor_ref
    BecknContextBacp:
      title: 'Beckn context extension: context.bacp'
      description: Added to Beckn/ONDC context on every BACP-originated message. Non-BACP NPs ignore it. Mirrored in message.order.tags[descriptor.code=bacp]
        where a network validator rejects unknown context keys (assumption).
      type: object
      required:
      - agent
      - presence
      - idempotency_key
      - ai_disclosure
      properties:
        agent:
          type: object
          required:
          - id
          - credential_hash
          - operator
          properties:
            id:
              type: string
            credential_hash:
              $ref: '#/components/schemas/Hash'
            operator:
              type: string
              description: Operator legal entity id (CIN/GSTIN)
            class:
              type: string
            uap_agent_id:
              type:
              - string
              - 'null'
        presence:
          $ref: '#/components/schemas/Presence'
        mandate_ref:
          type: object
          required:
          - id
          - hash
          properties:
            id:
              type: string
            hash:
              $ref: '#/components/schemas/Hash'
            kb_jwt:
              $ref: '#/components/schemas/Jws'
              description: Agent key-binding JWT (aud = bpp_id, nonce = message_id) closing the open mandate
          description: REQUIRED on init, confirm, update, cancel and IGM issue. Optional on search/select.
        idempotency_key:
          type: string
          minLength: 22
          maxLength: 64
        channel:
          $ref: '#/components/schemas/Channel'
        language:
          type: string
        ai_disclosure:
          const: true
          description: Always true. REQUIRED, and mirrored in the bacp tag group where context.bacp may be stripped.
        profile:
          $ref: ../schemas/beckn-context-bacp.json#/properties/profile
        acting_for:
          type: object
          description: Whom the agent acts for, as told to the seller. OPTIONAL. gstin and display_name are sent only when the mandate's data_scopes
            include ACTING_FOR; otherwise they are omitted. A sole proprietor's GSTIN or name is personal data.
          required:
          - kind
          properties:
            kind:
              enum:
              - individual
              - business
            gstin:
              type: string
              pattern: ^[0-9]{2}[A-Z0-9]{10}[0-9A-Z]{3}$
            display_name:
              type: string
              minLength: 1
          additionalProperties: false
        operator_name:
          type: string
          minLength: 1
          description: Legal name of the agent operator, as in its AgentCredential.
        operator_grievance_contact:
          type: string
          minLength: 1
          description: Contact of the agent operator's grievance officer (email address, tel URI or https URL).
        log_head:
          $ref: '#/components/schemas/Hash'
          description: Current InstructionLog head at send time
        version:
          type: string
          pattern: ^(\d{4}-\d{2}-\d{2}|draft)$
      additionalProperties: false
    Error:
      type: object
      description: ACP flat error model, with param as an RFC 9535 JSONPath
      required:
      - type
      - code
      - message
      properties:
        type:
          enum:
          - invalid_request
          - authentication_error
          - authorization_error
          - mandate_error
          - payment_error
          - upstream_error
          - service_unavailable
        code:
          type: string
          examples:
          - idempotency_key_required
          - idempotency_conflict
          - idempotency_in_flight
          - signature_invalid
          - replay_detected
          - agent_unregistered
          - agent_credential_revoked
          - mandate_required
          - mandate_invalid_signature
          - mandate_expired
          - mandate_revoked
          - mandate_paused
          - mandate_exhausted
          - mandate_scope_mismatch
          - presence_not_allowed
          - rail_limit_exceeded
          - bpp_timeout
          - bpp_nack
          - trusted_surface_only
          - ts_render_mismatch
          - presence_not_proven
          - evidence_unverifiable
          - session_state_conflict
        message:
          type: string
        param:
          type: string
        resolution:
          enum:
          - recoverable
          - requires_buyer_input
          - requires_buyer_review
          - unrecoverable
          description: What the agent may do next; the value registered for this code in the error registry.
        reasons:
          type: array
          items:
            type: string
          description: 'Every local and rail reason that applied. REQUIRED on rail-cap and step-up errors (rail_limit_exceeded). On
            rail_binding_not_open_eligible the reasons include binding_ineligible, reissue_required, registry_copy_stale, attestation_status_stale
            (a conformance-attestation status that is revoked, more than 24 hours old or unreachable; recoverable, no pause) and
            attester_not_accepted (the attestation''s signer is in the Mandate Manager''s published exclusion list).
        step_up_kind:
          enum:
          - confirm
          - rail_auth
          description: REQUIRED on rail-cap and step-up errors; rail_auth for rail_limit_exceeded.
        step_up:
          $ref: '#/components/schemas/StepUp'
          description: On 403 presence_not_proven for a post-order write with presence HP and no valid hp_proof, a step-up of kind post_order
            (reason presence_proof) whose ts_render names this write. The principal confirms it on the Trusted Surface, and the agent retries with
            hp_proof naming its step_up_id and the hash of the signed step_up.approved event.
    Message:
      type: object
      description: ACP messages[] entry. resolution tells the agent whether it may self-fix, must ask the user, or must get user review.
      required:
      - type
      - code
      - content
      - resolution
      properties:
        type:
          enum:
          - error
          - warning
          - info
          - disclosure
        code:
          type: string
          examples:
          - step_up_required
          - preticked_addon_removed
          - drip_pricing_detected
          - quote_mismatch
          - disclosures_missing
          - quote_expired
          - payment_in_doubt
          - debited_not_confirmed
          - pre_debit_notice
          - pre_debit_opt_out
          - cod_open_orders_cap
          - ai_disclosure
          - untrusted_counterparty_text
          - discovery_price_changed
          - prior_price_contradicted
          - prior_price_invalid
          - sponsored_listing
          - sponsorship_undeclared
          - prior_price_claim
          - discount_code_expired
          - discount_code_invalid
          - discount_code_already_applied
          - discount_code_combination_disallowed
          - discount_code_user_ineligible
          - discount_code_unsupported
          - payment_mode_fee_inconsistent
          - refund_short_of_terms
          - charge_recipient_unmapped
        origin:
          enum:
          - gateway
          - counterparty
          default: gateway
          description: Who wrote content. A gateway-written message never contains counterparty text; counterparty text travels only in args[]
            with origin counterparty, or as a whole message with code untrusted_counterparty_text and origin counterparty.
        content:
          $ref: '#/components/schemas/LangText'
        args:
          type: array
          description: Values inserted into content at {name} placeholders. A value taken from the seller or another counterparty (an item name,
            a fee label) MUST be here with origin counterparty and never in the text of content.
          items:
            type: object
            required:
            - name
            - origin
            - text
            properties:
              name:
                type: string
              origin:
                enum:
                - gateway
                - counterparty
              text:
                type: string
        param:
          type: string
        resolution:
          enum:
          - recoverable
          - requires_buyer_input
          - requires_buyer_review
          - unrecoverable
    Profile:
      type: object
      required:
      - bacp
      - bap_id
      - transports
      - capabilities
      - payment_handlers
      - keys
      - message_id_namespace
      properties:
        bacp:
          type: object
          properties:
            version:
              type: string
              pattern: ^(\d{4}-\d{2}-\d{2}|draft)$
              description: 'Protocol version this profile speaks: a dated release identifier (YYYY-MM-DD), or "draft" for the unreleased working version.'
            supported_versions:
              type: array
              items:
                type: string
                pattern: ^(\d{4}-\d{2}-\d{2}|draft)$
        bap_id:
          type: string
        transports:
          type: array
          items:
            enum:
            - rest
            - mcp
            - a2a
        capabilities:
          type: array
          items:
            type: string
        payment_handlers:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/Handler'
            - $ref: ../schemas/common.json#/$defs/HandlerRef
        reserved_handlers:
          type: array
          items:
            type: string
        keys:
          type: object
          properties:
            keys:
              type: array
              items:
                $ref: '#/components/schemas/Jwk'
        conformance:
          type: object
          properties:
            levels:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: ../schemas/common.json#/$defs/ConformanceLevel
              description: The conformance levels that the participant claims.
            attestation:
              $ref: '#/components/schemas/Jws'
              description: The participant's signed conformance attestation (JOSE header typ bacp-conformance+jwt), listing the same levels.
            excluded_attesters:
              type: array
              uniqueItems: true
              items:
                type: string
              description: On a Mandate Manager's profile, the ca_ids from the public conformance-authority list that this Mandate Manager does not
                accept. A Mandate Manager may only narrow the public list, never add to it.
          description: The conformance levels the participant claims, its attestation and, for a Mandate Manager, its exclusion list.
        negotiation:
          $ref: ../schemas/negotiation-session.json#/$defs/Capability
        payment_handlers_registry:
          type: string
          description: URI of GET /payment-handlers
        profiles:
          type: array
          items:
            type: string
          description: Trade-model profiles
        message_id_namespace:
          type: string
          format: uuid
          description: UUIDv5 namespace from which the gateway derives each Beckn message_id as UUIDv5(ns, agent_id | idempotency_key | action),
            so that a BACP-aware BPP can check a key-binding JWT nonce.
    DiscoverRequest:
      type: object
      required:
      - query
      properties:
        query:
          $ref: '#/components/schemas/LangText'
        category:
          type: string
        delivery:
          type: object
          properties:
            pincode:
              type: string
            gps:
              type: string
        mandate_ref:
          type: string
          description: Optional. When present, results are flagged within_mandate.
        max_wait_ms:
          type: integer
          maximum: 10000
          default: 4000
    DiscoverResponse:
      type: object
      description: The aggregated results of one network search. Every item carries its own sponsorship status, and ranking.sponsored is true if
        and only if some item is sponsored.
      required:
      - transaction_id
      - results
      - complete
      properties:
        transaction_id:
          type: string
        results:
          type: array
          items:
            type: object
            required:
            - source_digest
            properties:
              bpp_id:
                type: string
              provider:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  rating:
                    type: number
              items:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
              within_mandate:
                type: boolean
              needs_principal_factor:
                type: boolean
                description: true when the seller accepts no handler that a human-not-present payment can use (it has no rung for a payment without
                  the principal's own factor). The seller stays in the results and keeps its rank; the flag only tells the agent that the principal
                  must pay it herself.
              requires_principal_confirmation:
                $ref: '#/components/schemas/PrincipalConfirmation'
              source_digest:
                $ref: '#/components/schemas/SourceDigest'
              offers:
                type: array
                description: The seller's published offers, from the same signed callback as the items.
                items:
                  $ref: '#/components/schemas/CatalogOffer'
        ranking:
          type: object
          description: How the results were ordered. The gateway states the parameters it used, in descending order of importance, and whether any
            item is sponsored.
          properties:
            main_parameters:
              type: array
              description: The parameters that decided the order of the results, in descending order of importance. The first entry matters most.
              items:
                type: string
            sponsored:
              type: boolean
              description: true if and only if at least one item in results has sponsorship.status sponsored. It is a summary of the per-item
                statuses, never a substitute for them.
            description_url:
              type: string
              format: uri
              description: Optional. A public page that describes the ranking parameters and their relative importance.
        complete:
          type: boolean
          description: false if some BPPs had not answered within max_wait_ms
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
      allOf:
      - if:
          required:
          - ranking
          properties:
            ranking:
              required:
              - sponsored
              properties:
                sponsored:
                  const: true
        then:
          required:
          - results
          properties:
            results:
              contains:
                required:
                - items
                properties:
                  items:
                    contains:
                      required:
                      - sponsorship
                      properties:
                        sponsorship:
                          required:
                          - status
                          properties:
                            status:
                              const: sponsored
      - if:
          required:
          - results
          properties:
            results:
              contains:
                required:
                - items
                properties:
                  items:
                    contains:
                      required:
                      - sponsorship
                      properties:
                        sponsorship:
                          required:
                          - status
                          properties:
                            status:
                              const: sponsored
        then:
          required:
          - ranking
          properties:
            ranking:
              required:
              - sponsored
              properties:
                sponsored:
                  const: true
    DiscountCodes:
      type: object
      description: The discount codes or published offer ids the agent asks the seller to apply. The list replaces the earlier one, and an empty
        array clears it. It is a request only, so it carries no applied discounts.
      required:
      - codes
      additionalProperties: false
      properties:
        codes:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Discount codes or published offer ids to apply. Replaces earlier codes; an empty array clears them. At most 10 codes of 1 to 64
            printable ASCII characters each, as BACP design values against code enumeration, not regulatory limits.
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[\x21-\x7E]+$'
    Discounts:
      type: object
      description: The discounts of a session as the seller's signed quote applied them. The gateway derives applied[] only from offer lines in the
        BPP-signed quote and never adds a discount the seller did not sign.
      additionalProperties: false
      properties:
        codes:
          $ref: '#/components/schemas/DiscountCodes/properties/codes'
        applied:
          type: array
          items:
            $ref: '#/components/schemas/AppliedDiscount'
    AppliedDiscount:
      type: object
      description: A discount in the seller-signed quote, as a positive amount. Provisional and eligibility-dependent discounts are not carried on a
        plain session. title is seller text, shown only as labelled counterparty text, and no figure in it is voiced.
      required:
      - title
      - amount
      - automatic
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[\x21-\x7E]+$'
          description: The code that was applied. Absent for an automatic discount. An agent never fills the code into a fixed sentence from this
            field; it uses the code it submitted.
        offer_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[\x21-\x7E]+$'
          description: The seller's offer id from the BPP-signed quote line.
        title:
          type: string
          description: Seller text. Shown only as labelled counterparty text; no figure in it is voiced.
        amount:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
        automatic:
          type: boolean
          description: true for a discount that applies without a code. The agent cannot remove it.
        method:
          enum:
          - each
          - across
        priority:
          type: integer
          minimum: 1
        allocations:
          type: array
          minItems: 1
          description: Where the discount landed. REQUIRED when method is across, and whenever the session has more than one line item. The sum of
            the allocations equals amount.
          items:
            $ref: '#/components/schemas/DiscountAllocation'
      allOf:
      - if:
          properties:
            automatic:
              const: true
          required:
          - automatic
        then:
          not:
            required:
            - code
        else:
          required:
          - code
      - if:
          properties:
            method:
              const: across
          required:
          - method
        then:
          required:
          - allocations
      unevaluatedProperties: false
    DiscountAllocation:
      type: object
      required:
      - path
      - amount
      additionalProperties: false
      properties:
        path:
          type: string
          pattern: ^\$
          description: RFC 9535 JSONPath into the session, for example $.line_items[0].
        amount:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
    CatalogOffer:
      type: object
      description: A seller's published offer in a discover result. Its figures are rendered only for kind discount or slab, after the source has
        been verified, and only as cart-level terms. An unknown kind is rendered as a generic offer.
      required:
      - id
      - kind
      - auto
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          pattern: ^[a-z][A-Za-z0-9_]{0,31}$
          examples:
          - discount
          - buyXgetY
          - freebie
          - slab
          - combo
          - delivery
          - exchange
          - financing
        auto:
          type: boolean
        additive:
          type: boolean
        item_ids:
          type: array
          minItems: 1
          items:
            type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        min_order_value:
          $ref: '#/components/schemas/Amount'
        benefit:
          $ref: '#/components/schemas/OfferBenefit'
        title:
          type: string
          description: Seller text; never voiced for figures.
      unevaluatedProperties: false
    OfferBenefit:
      type: object
      required:
      - value_type
      additionalProperties: false
      properties:
        value_type:
          enum:
          - amount
          - percent
        amount:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
        percent_bps:
          type: integer
          minimum: 1
          maximum: 10000
        cap:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
      allOf:
      - if:
          properties:
            value_type:
              const: amount
        then:
          required:
          - amount
          not:
            required:
            - percent_bps
      - if:
          properties:
            value_type:
              const: percent
        then:
          required:
          - percent_bps
          not:
            required:
            - amount
    SourceDigest:
      type: string
      pattern: ^sha-256:[A-Za-z0-9_-]{43}$
      description: sha-256 of the raw BPP-signed on_search body that every item of the result entry came from, written sha-256:<base64url>. It is
        computed over the exact bytes of the body as UTF-8 text. Only sha-256 is allowed here, so that an agent computes one algorithm.
    Sponsorship:
      type: object
      description: 'Whether the position or selection of this item was affected by payment, and who sold the placement. "Sponsored" is BACP policy, not a
        statutory definition: it covers a position or selection that payment affected, including through a ranking parameter that a party can buy.
        not_sponsored is a claim by the party that ranked the item. undeclared means that nobody in the chain said, and it MUST NOT be rendered as
        not_sponsored. A reader that gets an item with no sponsorship (from an older or non-conforming gateway) treats it as undeclared. A reader
        renders an unknown by value as "sponsored, party unknown".'
      required:
      - status
      properties:
        status:
          enum:
          - sponsored
          - not_sponsored
          - undeclared
        by:
          type: array
          minItems: 1
          uniqueItems: true
          description: The parties that sold the placement and assert it. bpp is the seller app, gateway is the buyer app's gateway, agent is the
            agent operator, for example when it is paid for an item's prominence or selection. Several values arise when the sponsorship of
            several parties is combined.
          items:
            enum:
            - bpp
            - gateway
            - agent
      allOf:
      - if:
          properties:
            status:
              const: sponsored
        then:
          required:
          - by
        else:
          not:
            required:
            - by
      unevaluatedProperties: false
    PriorPrice:
      type: object
      description: BPP-asserted. The lowest price of the item in the 30 days before announced_on, on the same tax basis as unit_price. Its presence is
        the claim that the seller announced a price reduction on that date. The gateway never creates it.
      required:
      - amount
      - basis
      - announced_on
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        basis:
          enum:
          - lowest_30d
          description: The only value is lowest_30d, the lowest price in the thirty days before the announcement of the price reduction. A
            maximum retail price is never a prior price.
        announced_on:
          type: string
          format: date
          description: The date on which the seller announced the price reduction, as an ISO date.
      unevaluatedProperties: false
    CatalogItem:
      type: object
      description: One item of a discovery result. The object stays open, so a reader ignores fields it does not know.
      required:
      - id
      - name
      - unit_price
      - sponsorship
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/LangText'
        unit_price:
          $ref: '#/components/schemas/Amount'
          description: The price of one unit as the seller quoted it. Its tax basis is stated by tax_inclusive.
        hsn:
          type: string
        gst_rate_bps:
          type: integer
        available_on_cod:
          type: boolean
        returnable:
          type: boolean
        return_window:
          type: string
        category:
          type: string
        sponsorship:
          $ref: '#/components/schemas/Sponsorship'
        mrp:
          $ref: '#/components/schemas/Amount'
          description: Legal Metrology retail sale price, inclusive of all taxes; maps from Beckn price.maximum_value. It is never shown as a "was" price.
        tax_inclusive:
          type: boolean
          description: Whether unit_price and prior_price include all taxes. REQUIRED whenever mrp or prior_price is present. A comparison with mrp
            runs only when it is true.
        prior_price:
          $ref: '#/components/schemas/PriorPrice'
      dependentRequired:
        mrp:
        - tax_inclusive
        prior_price:
        - tax_inclusive
    ItemRef:
      type: object
      required:
      - id
      - quantity
      properties:
        id:
          type: string
        quantity:
          type: integer
          minimum: 1
    SessionCreate:
      type: object
      required:
      - transaction_id
      - bpp_id
      - provider_id
      - items
      - presence
      properties:
        transaction_id:
          type: string
        bpp_id:
          type: string
        provider_id:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemRef'
        presence:
          $ref: '#/components/schemas/Presence'
        mandate_ref:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        language:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
          description: Humans and sub-agents taking part besides the agent. With channel assisted it MUST contain an assisted_operator entry
            (BACP policy); otherwise the gateway returns 400 invalid_request at $.participants.
        webhook_url:
          type: string
          format: uri
        basket_id:
          $ref: '#/components/schemas/BasketId'
        discounts:
          $ref: '#/components/schemas/DiscountCodes'
      allOf:
      - if:
          properties:
            channel:
              const: assisted
          required:
          - channel
        then:
          required:
          - participants
          properties:
            participants:
              contains:
                properties:
                  role:
                    const: assisted_operator
                required:
                - role
    SessionUpdate:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemRef'
        fulfilment:
          type: object
          properties:
            type:
              enum:
              - Delivery
              - Self-Pickup
            address_ref:
              type: string
            pincode:
              type: string
        billing:
          type: object
          properties:
            gstin:
              type: string
            name:
              type: string
        discounts:
          $ref: '#/components/schemas/DiscountCodes'
        data_share:
          type: object
          required:
          - consent_receipt_ref
          - fields
          properties:
            consent_receipt_ref:
              type: string
              description: "receipt_id of a class or per-seller ConsentReceipt. A class receipt (recipient.bpp_id \"*\") only pre-authorises: the gateway MUST hold a per-seller ConsentReceipt, whose recipient.bpp_id is that seller, at init and before any personal data reaches the seller; no data is ever released on the strength of a class receipt alone (settled in Q-12)."
            fields:
              type: array
              items:
                type: string
        payment:
          type: object
          properties:
            handler:
              anyOf:
              - $ref: '#/components/schemas/Handler'
              - $ref: '#/components/schemas/RailType'
              - $ref: ../schemas/common.json#/$defs/HandlerRef
              description: 'Any handler reference: a canonical id (for example in.upi.reservepay) or a legacy alias. Compared with the mandate''s
                rail binding after alias resolution.'
    LineItem:
      type: object
      required:
      - id
      - quantity
      - unit_price
      - total
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/LangText'
        quantity:
          type: integer
        unit_price:
          $ref: '#/components/schemas/Amount'
        total:
          $ref: '#/components/schemas/Amount'
          description: unit_price times quantity, before discounts. Discounts appear in discounts.applied[].allocations.
        hsn:
          type: string
        tax_lines:
          type: array
          items:
            $ref: '#/components/schemas/TaxLine'
        preticked_addon:
          type: boolean
          description: Set by BPP. The gateway strips such items.
    TaxLine:
      type: object
      required:
      - type
      - amount
      properties:
        type:
          enum:
          - CGST
          - SGST
          - IGST
          - CESS
          - TCS
        rate_bps:
          type: integer
        amount:
          $ref: '#/components/schemas/Amount'
    Total:
      type: object
      required:
      - type
      - amount
      properties:
        type:
          description: discount is the total of the discounts as a positive amount, subtracted from the subtotal.
          enum:
          - subtotal
          - delivery
          - packing
          - convenience_fee
          - tax
          - discount
          - cod_fee
          - other_charge
          - total
        amount:
          $ref: '#/components/schemas/Amount'
        applies_to_handlers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: ../schemas/common.json#/$defs/HandlerRef
          description: The payment handlers this line applies to. Allowed only when type is convenience_fee or cod_fee. A line without it applies to
            every handler. A fee that applies to several handlers but not all is written as one line carrying them all.
        recipient:
          $ref: ../schemas/common.json#/$defs/ChargeRecipient
          description: Who receives the line from the payer's money, as the seller's side signed it. REQUIRED when type is delivery, packing, convenience_fee,
            cod_fee or other_charge. The gateway fills it from the BPP's signed value and never infers it from the type.
        refund_rule:
          enum:
          - always
          - before_dispatch
          - never
          description: Whether the line is refunded on a cancellation or return, as disclosed before commitment.
      allOf:
      - if:
          required:
          - applies_to_handlers
        then:
          properties:
            type:
              enum:
              - convenience_fee
              - cod_fee
      - if:
          properties:
            type:
              enum:
              - delivery
              - packing
              - convenience_fee
              - cod_fee
              - other_charge
          required:
          - type
        then:
          required:
          - recipient
    OperatorCharge:
      type: object
      description: A per-order fee the principal pays to the agent operator, an assisted operator or the buyer app. The gateway asserts it, outside the
        BPP quote and outside all_in_total. It discloses a fee; it is not a licence to charge one.
      required:
      - code
      - amount
      - recipient
      properties:
        code:
          enum:
          - agent_fee
          - service
        amount:
          $ref: '#/components/schemas/Amount'
        recipient:
          enum:
          - agent_operator
          - assisted_operator
          - buyer_app
      additionalProperties: false
    IntermediaryCompensation:
      type: object
      description: What a seller or the principal pays an intermediary for this order, copied by the gateway from the ONDC buyer finder fee, from np_fees
        or from the operator's own declaration. It is a log and on-request value. It is never read out per order on the Trusted Surface and never added
        to a total.
      required:
      - payee_role
      - source
      - basis
      - value
      - origin
      properties:
        payee_role:
          enum:
          - bap
          - agent_operator
        source:
          enum:
          - seller
          - principal
        basis:
          enum:
          - pct
          - flat
        value:
          type: integer
          minimum: 0
          description: In basis points when basis is pct, and in integer paise when basis is flat.
        amount:
          $ref: '#/components/schemas/Amount'
          description: The amount for this order, where it is known.
        origin:
          enum:
          - ondc_bff
          - np_fees
          - operator_declared
      additionalProperties: false
    ChargeLine:
      type: object
      description: One line of the fee read-out of a ts_render. The lines of charge_lines[] add up to the ts_render total.
      required:
      - code
      - amount
      properties:
        code:
          enum:
          - convenience
          - platform
          - payment_handling
          - handling
          - cod_fee
          - agent_fee
          - service
          - remainder
          description: Every fee line the Trusted Surface reads one at a time, whoever receives it, and remainder for everything else (goods, delivery,
            packing and tax) as one figure.
        amount:
          $ref: '#/components/schemas/Amount'
        recipient:
          $ref: ../schemas/common.json#/$defs/ChargeRecipient
          description: Who receives the line, where the quote or the gateway states it.
      additionalProperties: false
    RefundCharge:
      type: object
      description: A charge line of an order that a refund returned or kept.
      required:
      - code
      - amount
      properties:
        code:
          enum:
          - delivery
          - packing
          - convenience
          - platform
          - handling
          - cod_fee
          - payment_handling
          - insurance
          - installation
          - loading
          - market_fee
          - commission
          - rto_fee
          - restocking_fee
          - return_shipping
          - agent_fee
          - service
          - other
        amount:
          $ref: '#/components/schemas/Amount'
        refund_rule:
          enum:
          - always
          - before_dispatch
          - never
          description: The rule disclosed for the line before the principal committed. REQUIRED on a line in charges_retained.
      additionalProperties: false
    PrincipalConfirmation:
      type: object
      description: A seller's declaration that it wants the principal to confirm certain orders herself. It MUST NOT change a price or a handler. The
        gateway raises a confirm step-up (reason constraint_unresolved) for an order it covers, and logs how often each seller does so.
      required:
      - reason
      properties:
        reason:
          enum:
          - made_to_order
          - age_restricted
          - high_value_cod
        above_amount:
          $ref: '#/components/schemas/Amount'
          description: For high_value_cod, the order amount above which the seller wants the confirmation. REQUIRED for high_value_cod and absent
            for the other reasons.
      allOf:
      - if:
          properties:
            reason:
              const: high_value_cod
          required:
          - reason
        then:
          required:
          - above_amount
        else:
          not:
            required:
            - above_amount
      additionalProperties: false
    Disclosures:
      type: object
      description: Mandatory pre-commit disclosures as given by the BPP, hashed into accepted_disclosures_hash
      required:
      - seller_name
      - total_price
      - return_terms
      - cancellation_terms
      - country_of_origin
      - expected_delivery
      - price_breakup
      properties:
        seller_name:
          type: string
        seller_address:
          type: string
        grievance_officer:
          type: string
        country_of_origin:
          type: object
          additionalProperties:
            type: string
        total_price:
          $ref: '#/components/schemas/Amount'
        return_terms:
          type: string
        cancellation_terms:
          type: string
        expected_delivery:
          type: string
        hash:
          $ref: '#/components/schemas/Hash'
        price_breakup:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - type
            - amount
            properties:
              type:
                type: string
              amount:
                $ref: '#/components/schemas/Amount'
        fx:
          $ref: ../schemas/fx.json
        catalogue:
          type: array
          description: One entry for each line item whose item the agent found through POST /discover, copied by the gateway from the discover
            response and hashed with the rest of the disclosures. It records what the buyer was told at discovery.
          items:
            type: object
            required:
            - item_id
            - sponsorship
            - discovered_unit_price
            - source_digest
            properties:
              item_id:
                type: string
              sponsorship:
                $ref: '#/components/schemas/Sponsorship'
              discovered_unit_price:
                $ref: '#/components/schemas/Amount'
                description: The unit price the discover response showed for this item.
              source_digest:
                $ref: '#/components/schemas/SourceDigest'
              mrp:
                $ref: '#/components/schemas/Amount'
              tax_inclusive:
                type: boolean
              prior_price:
                $ref: '#/components/schemas/PriorPrice'
            dependentRequired:
              mrp:
              - tax_inclusive
              prior_price:
              - tax_inclusive
    BasketId:
      type: string
      pattern: ^bkt_[A-Za-z0-9]{8,40}$
      description: Groups the checkout sessions of one multi-seller basket at this gateway. It is gateway-local and never appears in context.bacp, in
        Beckn tags or on the payment leg. Every session with one basket_id has the same principal, presence and root open Checkout Mandate;
        otherwise POST /sessions returns 400 invalid_request at $.basket_id.
    Payee:
      type: object
      required:
      - vpa
      - bpp_id
      properties:
        vpa:
          type: string
          description: The payee's UPI virtual payment address, as in the seller's BPP-signed payment terms.
        bpp_id:
          type: string
          description: The seller app (BPP subscriber id) of the payee seller.
    CoverEntry:
      type: object
      description: One leg covered by a summary step-up approval.
      required:
      - session_id
      - checkout_hash
      - payee
      - amount
      properties:
        session_id:
          type: string
        checkout_hash:
          $ref: '#/components/schemas/Hash'
        payee:
          $ref: '#/components/schemas/Payee'
        amount:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
    TsRenderDigest:
      type: object
      description: A summary step-up's ts_render as a seller or payer PSP receives it in an evidence bundle, so that the other sellers of the
        basket stay out of the bundle. The approving event's presentation.content_hash equals render_hash.
      required:
      - step_up_id
      - render_hash
      - cover
      properties:
        step_up_id:
          type: string
        render_hash:
          $ref: '#/components/schemas/Hash'
          description: sha-256 of the compact JWS ts_render.
        cover:
          $ref: '#/components/schemas/CoverEntry'
          description: The covers[] entry of the bundle's own leg.
    BecknSignedMessage:
      type: object
      description: A Beckn message as the gateway received it, kept so that a verifier can check the sender's network signature without a
        per-object JWS. body is the raw request body; authorization is its Beckn Authorization header (on Beckn 1.x and ONDC, Ed25519 over
        created, expires and a BLAKE2b-512 digest of the body), which verifies against the registry key of the participant that the body's
        context names, as of the signature's created time. Also used for an on_search callback behind a discovery result, which an agent
        verifies against a registry key valid both at created and at the time of verification.
      required:
      - body
      - authorization
      properties:
        body:
          type: string
          minLength: 1
          description: The raw request body exactly as received, as UTF-8 text.
        authorization:
          type: string
          minLength: 1
          description: The Beckn Authorization header value exactly as received.
    BasketLine:
      type: object
      description: One seller of a multi-seller basket as the Trusted Surface shows it (ts_render.basket[]).
      required:
      - bpp_id
      - payee_name
      - amount
      - handler
      - needs_pin
      - funding
      properties:
        bpp_id:
          type: string
        payee_name:
          type: string
          description: The payee name the payer's bank returns for the payee VPA, not a name the seller or the agent supplies.
        amount:
          $ref: ../schemas/common.json#/$defs/PositiveAmount
        handler:
          $ref: ../schemas/common.json#/$defs/HandlerRef
        needs_pin:
          type: boolean
          description: Whether paying this seller needs the principal's UPI PIN or another per-payment factor.
        funds_locked:
          $ref: ../schemas/common.json#/$defs/Amount
          description: For a block, the amount it reserves in the principal's account or credit limit.
        expires_at:
          type: string
          format: date-time
          description: For a block, when it expires and the reserved amount is released.
        funding:
          enum:
          - deposit
          - credit
          description: deposit when the principal's own money pays (a bank account or a prepaid balance); credit when a credit card or credit
            line pays. This is the two-way split the principal is shown and the payer PSP attests, not the handler descriptor's funding
            vocabulary (debit, prepaid and others), which describes a handler rather than one block or balance.
    TsCatalogueDisclosure:
      type: object
      description: One item whose discovery disclosure the Trusted Surface repeats before the total. The gateway copies sponsorship, prior_price and
        unit_price unaltered from the Disclosures.catalogue[] entry that index names. An entry for an item that is not_sponsored and has no prior_price
        is invalid, so the Trusted Surface never reads out an empty claim.
      required:
      - index
      - sponsorship
      - name_ref
      properties:
        index:
          type: integer
          minimum: 0
          description: The position of the entry in Disclosures.catalogue[] of the session that the entry is about.
        cover:
          type: integer
          minimum: 0
          description: On a summary step-up only, the position in covers[] of the leg whose session holds that Disclosures.catalogue[]. Absent otherwise.
        sponsorship:
          $ref: '#/components/schemas/Sponsorship'
        prior_price:
          $ref: '#/components/schemas/PriorPrice'
        unit_price:
          $ref: '#/components/schemas/Amount'
          description: The discovered unit price that was shown with the prior price (discovered_unit_price). REQUIRED when prior_price is present.
        name_ref:
          type: integer
          minimum: 0
          description: The position of the item's name in counterparty_text[]. The name is seller text and appears only there.
      dependentRequired:
        prior_price:
        - unit_price
      allOf:
      - if:
          required:
          - sponsorship
          properties:
            sponsorship:
              required:
              - status
              properties:
                status:
                  const: not_sponsored
        then:
          required:
          - prior_price
      unevaluatedProperties: false
    TsRender:
      type: object
      description: The payload of a ts_render, the compact JWS that the gateway signs once per step-up over the JCS form of this object and
        serves to the step-up's Mandate Manager or payer PSP. The fields are defined on the Human participants page.
      required:
      - step_up_id
      - kind
      - reason
      - language
      - revoke_route
      - grievance_contact
      - expires_at
      properties:
        step_up_id:
          type: string
        session_id:
          type: string
        kind:
          $ref: '#/components/schemas/StepUp/properties/kind'
        reason:
          $ref: '#/components/schemas/StepUp/properties/reason'
        action:
          enum:
          - CANCEL
          - RETURN
          - RAISE_ISSUE
          - INFO_PROVIDED
          - RESOLUTION_ACCEPTED
          - RESOLUTION_REJECTED
          - ESCALATED
          - CLOSED
          - GRN
          - CRAC
          - MSMED_OBJECTION
          - LEDGER_ACK
          description: For kind post_order only, the write the principal confirms. No other value is valid.
        order_id:
          type: string
        issue_id:
          type: string
        subject_hash:
          $ref: '#/components/schemas/Hash'
        language:
          $ref: '#/components/schemas/LanguageTag'
        checkout_hash:
          $ref: '#/components/schemas/Hash'
        total:
          $ref: '#/components/schemas/Amount'
          description: The total the principal pays, as one figure. It is the quote total plus the sum of the session's operator_charges. On a summary
            step-up, the sum of basket[].amount.
        charge_lines:
          type: array
          minItems: 1
          description: The fee read-out of a step-up that pays for an order, before the factor. One entry for each fee line (convenience, platform, payment_handling,
            handling, cod_fee, and every operator charge), then one remainder entry for everything else. The amounts add up to total. The Trusted
            Surface reads each line from its own templates, never from seller text. An order with no fee line has no charge_lines.
          items:
            $ref: '#/components/schemas/ChargeLine'
        price_breakup_hash:
          $ref: '#/components/schemas/Hash'
        seller_name:
          type: string
          description: The payee seller, from the BPP-signed quote. Absent on a summary step-up, whose sellers are in basket[].
        assisted_operators:
          type: array
          items:
            type: object
            properties:
              participant_id:
                type: string
              ref:
                type: string
        summary:
          $ref: '#/components/schemas/LangText'
        counterparty_text:
          type: array
          items:
            type: object
            required:
            - label
            - text
            properties:
              label:
                type: string
              text:
                type: string
        revoke_route:
          type: string
          format: uri
        grievance_contact:
          type: string
        basket:
          type: array
          minItems: 2
          description: On a summary step-up over a multi-seller basket, one line per seller, in the order the Trusted Surface states them. The
            Trusted Surface states the number of sellers first.
          items:
            $ref: '#/components/schemas/BasketLine'
        covers:
          type: array
          minItems: 1
          description: On a summary step-up only, the legs the approval covers. Only the shared root's Mandate Manager fetches a render that
            carries covers[] and posts its result.
          items:
            $ref: '#/components/schemas/CoverEntry'
        catalogue_disclosure:
          type: array
          minItems: 1
          description: One entry for each line item of the step-up's session or sessions whose Disclosures.catalogue[] entry is sponsored or undeclared,
            or carries a prior_price, so that the Trusted Surface repeats what discovery showed before the total. Only on a session step-up of kind confirm
            or rail_auth, never on a post_order step-up or a negotiation confirm. It is hashed into Presentation.content_hash with the rest of the render.
          items:
            $ref: '#/components/schemas/TsCatalogueDisclosure'
        offer_hash:
          $ref: '#/components/schemas/Hash'
          description: On a negotiation confirm step-up, the offer_hash of the offer the principal is asked to approve.
        acceptance_revocation:
          enum:
          - waived
          - allowed_until_receipt
          description: On a negotiation confirm step-up about a firm offer, the offer's acceptance_revocation value, copied unchanged. The Trusted
            Surface never shows the token; it shows the fixed consequence sentence for the value, followed by the offer's cancellation terms.
            In this version only waived occurs. Present only together with offer_hash.
        expires_at:
          type: string
          format: date-time
      dependentRequired:
        acceptance_revocation:
        - offer_hash
      not:
        required:
        - checkout_hash
        - offer_hash
      allOf:
      - if:
          required:
          - catalogue_disclosure
        then:
          required:
          - checkout_hash
          properties:
            kind:
              enum:
              - confirm
              - rail_auth
      - if:
          required:
          - catalogue_disclosure
          - covers
        then:
          properties:
            catalogue_disclosure:
              items:
                required:
                - cover
        else:
          properties:
            catalogue_disclosure:
              items:
                not:
                  required:
                  - cover
    StepUp:
      type: object
      required:
      - step_up_id
      - kind
      - reason
      - trusted_surface_url
      - expires_at
      properties:
        step_up_id:
          type: string
        kind:
          enum:
          - confirm
          - rail_auth
          - post_order
          description: confirm = the principal confirms this checkout or, in a negotiation, this offer on the Trusted Surface. rail_auth = a fresh per-transaction factor (for
            example the UPI PIN) because an AFA threshold applies. post_order = the principal confirms one post-order write or trade act, named
            in the ts_render, to obtain hp_proof (carried in Error.step_up of 403 presence_not_proven). At most one post_order step-up is pending
            per (order_id, action, issue_id), and a repeat of the refused write returns the same step_up_id; their creation is rate-limited per
            agent (429). Other rail caps never escalate; they return 403 rail_limit_exceeded.
        reason:
          enum:
          - above_step_up_threshold
          - above_afa_limit
          - new_merchant
          - outside_categories
          - first_order
          - constraint_unresolved
          - negotiation_out_of_mandate
          - negotiation_between_reservation_and_max
          - afa_threshold_card_emandate
          - credit_acceptance
          - split_tender_afa_on_total
          - afa_crossborder_cnp
          - presence_proof
          - rail_fallback
          description: presence_proof is the reason of a post_order step-up. rail_fallback is a confirm step-up raised when a leg of a
            multi-seller basket has no human-not-present handler, or when the planned payment of a leg changes its funding, fee-bearer, payee or
            collector; a rail-only change is logged in comparison[] and raises no step-up.
        summary:
          $ref: '#/components/schemas/LangText'
        trusted_surface_url:
          type: string
          description: Opaque link or reference for the principal's Trusted Surface. It carries the step_up_id, never the content to show; the agent
            delivers it to the principal and never fetches it.
        ts_render:
          $ref: '#/components/schemas/Jws'
          description: Gateway-signed render input for the Trusted Surface (compact JWS over the JCS form of the payload defined on the Human
            participants page). Signed once when the step-up is created and never changed for its step_up_id. The Trusted Surface fetches it by
            step_up_id with the key of the step-up's Mandate Manager or payer PSP and never takes it from the agent.
        delivery:
          enum:
          - deep_link
          - app_push
          - ivr_callback
          - assisted
          description: How the step-up reaches the principal. ivr_callback is Proposed until it is confirmed that an IVR or UPI 123PAY flow can carry
            the confirmation. For ivr_callback and assisted, expires_at is at least 5 minutes ahead (a BACP design floor, not an external
            requirement).
        expires_at:
          type: string
          format: date-time
          description: At most 15 minutes ahead; at least 5 minutes ahead when delivery is ivr_callback or assisted.
        covers:
          type: array
          minItems: 1
          description: On a summary step-up (reason rail_fallback) over a multi-seller basket, the legs the approval covers. Each entry is consumed
            at most once, inside the atomic section keyed on the shared root open Checkout Mandate, by the complete of the session it names, and
            only while that session's checkout_hash, payee and amount still equal the entry. When the summary is declined or expires, every entry
            is void. Only the shared root's Mandate Manager fetches the summary and posts its result. A summary approves a plan, never a payment;
            each payee still gets its own closed mandate and its own per-payee factor.
          items:
            $ref: '#/components/schemas/CoverEntry'
        a2a_state:
          const: TASK_STATE_AUTH_REQUIRED
        mcp_error:
          const: insufficient_scope
          description: Present when mcp_signal is insufficient_scope.
        mcp_signal:
          enum:
          - url_elicitation
          - insufficient_scope
          description: How the MCP binding surfaced the step-up. url_elicitation when the MCP client declared URL-mode elicitation; otherwise
            insufficient_scope.
    PaymentState:
      type: object
      required:
      - handler
      - status
      properties:
        handler:
          anyOf:
          - $ref: '#/components/schemas/Handler'
          - $ref: '#/components/schemas/RailType'
          - $ref: ../schemas/common.json#/$defs/HandlerRef
        collected_by:
          enum:
          - BAP
          - BPP
        type:
          enum:
          - ON-ORDER
          - ON-FULFILLMENT
        status:
          enum:
          - not_started
          - initiated
          - debited
          - confirmed
          - in_doubt
          - reversal_pending
          - reversed
          - failed
        receipt:
          anyOf:
          - $ref: '#/components/schemas/Receipt'
          - $ref: '#/components/schemas/ReceiptRef'
        reversal_deadline:
          type: string
          format: date-time
          description: T+5 for UPI P2M debited-not-confirmed
        budget_after:
          type: array
          description: Unsigned, computed by the gateway from its mandate ledger after applying the PSP-signed receipt. Never part of the receipt.
          items:
            type: object
            required:
            - period
            - remaining
            properties:
              period:
                type: string
              remaining:
                $ref: '#/components/schemas/Amount'
    Session:
      type: object
      required:
      - id
      - transaction_id
      - status
      - presence
      - line_items
      - totals
      - ai_disclosure
      - messages
      properties:
        id:
          type: string
        transaction_id:
          type: string
        status:
          description: Session status. Values follow the UCP checkout statuses, except that UCP `canceled` maps to BACP `cancelled`. human_handoff
            is a BACP status, entered from an open status by POST /sessions/{session_id}/handoff and left by a release (to incomplete) or by
            cancel, TTL or a stopped mandate (to cancelled).
          enum:
          - incomplete
          - requires_escalation
          - ready_for_complete
          - complete_in_progress
          - completed
          - cancelled
          - human_handoff
        presence:
          $ref: '#/components/schemas/Presence'
        bpp_id:
          type: string
        provider_id:
          type: string
        mandate_ref:
          type: string
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/Total'
        operator_charges:
          type: array
          description: Per-order fees the principal pays to the agent operator, an assisted operator or the buyer app. The gateway asserts them; they
            are never inside the BPP quote, and all_in_total and the quote total stay equal to the Beckn quote.price. The amount the principal pays,
            the ts_render total and the amount checked against the mandate are the quote total plus the sum of these lines.
          items:
            $ref: '#/components/schemas/OperatorCharge'
        intermediary_compensation:
          type: array
          description: What a seller or the principal pays an intermediary for this order, copied unchanged from the ONDC buyer finder fee and np_fees,
            or from the operator's declaration. It is logged at the disclosure stage and given to the principal on request.
          items:
            $ref: '#/components/schemas/IntermediaryCompensation'
        quote:
          type: object
          properties:
            id:
              type: string
            ttl:
              type: string
            expires_at:
              type: string
              format: date-time
            checkout_hash:
              $ref: '#/components/schemas/Hash'
            bpp_signature:
              $ref: '#/components/schemas/Jws'
        disclosures:
          $ref: '#/components/schemas/Disclosures'
        fulfilment:
          type: object
          additionalProperties: true
        payment:
          $ref: '#/components/schemas/PaymentState'
        step_up:
          $ref: '#/components/schemas/StepUp'
        order_id:
          type: string
        receipts:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/Receipt'
            - $ref: '#/components/schemas/ReceiptRef'
        beckn:
          type: object
          description: Diagnostic correlation
          properties:
            last_action:
              type: string
            last_message_id:
              type: string
        expires_at:
          type: string
          format: date-time
        ai_disclosure:
          type: object
          description: The AI disclosure the first message presents, with typed routes to a human (from the AgentCredential's disclosure). Always
            present. handoff_routes is absent when the AgentCredential lists none.
          required:
          - notice
          properties:
            notice:
              $ref: '#/components/schemas/LangText'
            handoff_routes:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/HandoffRoute'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        handoff:
          $ref: '#/components/schemas/Handoff'
        basket_id:
          $ref: '#/components/schemas/BasketId'
        discounts:
          $ref: '#/components/schemas/Discounts'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    CompleteRequest:
      type: object
      required:
      - presence
      - checkout_mandate
      - payment_mandate
      - checkout_hash
      properties:
        presence:
          $ref: '#/components/schemas/Presence'
        checkout_mandate:
          $ref: '#/components/schemas/Jws'
        payment_mandate:
          $ref: '#/components/schemas/Jws'
        checkout_hash:
          $ref: '#/components/schemas/Hash'
        accepted_disclosures_hash:
          $ref: '#/components/schemas/Hash'
        step_up_id:
          type: string
          description: Present when completing after an approved step-up
        kb_jwt:
          $ref: '#/components/schemas/Jws'
          description: Key-binding JWT for closing the open mandate, with aud = the bpp_id and nonce = the Beckn confirm message_id (derived with
            the profile's message_id_namespace).
        payment_plan:
          not: {}
          description: "Reserved. Payment plans have no wire binding in this version (Q-44). Until Q-44 is settled, a gateway MUST reject a complete that carries payment_plan with 400 invalid_request at $.payment_plan, and MUST NOT ignore it and charge a single tender instead."
    MandateRequest:
      type: object
      required:
      - purpose_code
      - rail
      - presence_allowed
      - proposed_constraints
      - validity
      - operator_compensation
      properties:
        operator_compensation:
          $ref: ../schemas/common.json#/$defs/OperatorCompensation
          description: What the agent operator, an assisted operator or the buyer app is paid for acting for the principal. REQUIRED. The Mandate Manager
            shows it in the notice, hashes it into the ConsentReceipt notice and refuses to activate the mandate without it (400 invalid_request at
            $.operator_compensation). When the signing AgentCredential has disclosure.compensation_model, the value MUST be consistent with it, or the
            request is refused with 400 invalid_request at $.operator_compensation.
        purpose_code:
          type: string
          description: "Code from the BACP purpose-code registry (Sahamati Fair Use analogue), e.g. P-GRO-01 household grocery replenishment. The purpose fixes the categories, maximum validity, monetary bounds and data scopes the mandate may request. The registry is governed by the BACP working group: a new code or a changed bound ships only in a dated release. A purpose_code that is not in the registry MUST be refused with 403 mandate_scope_mismatch (settled in Q-47)."
        rail:
          anyOf:
          - $ref: '#/components/schemas/RailType'
          - $ref: ../schemas/common.json#/$defs/RailTypeV1
          description: The handler that will back the open payment mandate. Any class-O handler id (for example in.upi.reservepay, in.upi.circle,
            in.card.mandate, in.nach.debit) or a legacy RailType alias. Class C, A, D and N ids never validate here.
        presence_allowed:
          type: array
          items:
            $ref: '#/components/schemas/Presence'
        proposed_constraints:
          $ref: '#/components/schemas/Mandate/properties/constraints'
        data_scopes:
          type: array
          items:
            type: string
        action_scope:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - DISCOVER
            - QUOTE
            - ORDER
            - PAY
            - CANCEL
            - RETURN
            - RAISE_ISSUE
            - SHARE_DATA
          description: 'Actions the mandate will authorise. Proposed: when omitted, all eight actions are requested; the principal sees the full
            scope on the Trusted Surface.'
        validity:
          type: string
          description: ISO 8601 duration
        language:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
          description: Channel on which the principal will approve, so that the Trusted Surface link can be delivered in a form the principal can
            use (for example an IVR callback for upi123pay).
        parent_mandate_id:
          type: string
          description: For sub-agent delegation. May only narrow.
        checkout_mandate_ref:
          type: string
          pattern: ^mdt_[A-Za-z0-9]{12,40}$
          description: Requests a sibling open Payment Mandate under an existing root open Checkout Mandate, for example a Reserve Pay block for
            one more seller. It MUST name an ACTIVE root open Checkout Mandate of the same principal. The Mandate Manager then builds only an open
            Payment Mandate whose constraints narrow the root's, never a new Checkout Mandate or budget. The block amounts of all Reserve Pay
            mandates under the root, the requested one included, MUST NOT exceed the smallest budgets[].max of the root (403
            mandate_scope_mismatch), and the requested block at its full amount MUST fit the root's headroom (budget max less exposure) in every
            window (403 mandate_exhausted). The attested block expiry MUST NOT be later than the root's valid_until.
        payee:
          $ref: '#/components/schemas/Payee'
          description: The payee of a payee-bound primitive. REQUIRED when the requested rail is UPI Reserve Pay (primitive sbmd_block); without
            it the request is refused with 403 mandate_scope_mismatch at $.payee. The gateway MUST hold the BPP-signed payment terms of the
            seller bpp_id (obtaining them first by a Beckn init that it never follows with confirm) or refuse with 400
            rail_binding_not_open_eligible, and payee.vpa MUST equal the VPA in those terms. A block whose payee is the buyer app (collected_by
            BAP) is refused for human-not-present use with 400 rail_binding_not_open_eligible.
        rail_limits:
          type: object
          description: The rail limits the request asks the payer PSP to set up. REQUIRED with block_amount when the requested rail is UPI
            Reserve Pay; without it the request is refused with 403 mandate_scope_mismatch at $.rail_limits.block_amount.
          properties:
            block_amount:
              $ref: ../schemas/common.json#/$defs/PositiveAmount
              description: The Reserve Pay block the principal is asked to set up. It is checked against the handler's per-block limit
                and the root's sum-of-blocks rule and headroom (the proposed budgets when the request has no checkout_mandate_ref) before
                anything reaches the rail and shown in the notice; the payer PSP creates no larger block, and the Mandate
                Manager refuses issuance, and revokes the block, if the attested block_amount is larger.
        webhook_url:
          type: string
          format: uri
          description: Where the gateway sends mandate.status_changed (and later events for this mandate), which can occur before any session
            exists.
        gateway_attestation:
          $ref: '#/components/schemas/Jws'
          description: 'The gateway''s conformance attestation (a compact JWS with the JOSE header typ bacp-conformance+jwt), forwarded to the Mandate
            Manager. REQUIRED when the requested rail resolves to a pilot handler, and then the Mandate Manager verifies it before issuing: the
            signing key is in an entry of the public conformance-authority list, the attestation lists the handler in pilots[], and its sub is the
            subscriber that the request''s signing key resolves to. A request without it, or with one that does not verify, is refused with 400
            rail_binding_not_open_eligible.'
    MandateHandle:
      type: object
      required:
      - request_id
      - status
      - trusted_surface_url
      properties:
        request_id:
          type: string
        status:
          enum:
          - PENDING
          - ACTIVE
          - REJECTED
        trusted_surface_url:
          type: string
        mandate_ids:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    TrustedSurfaceEvent:
      type: object
      required:
      - event
      - at
      - signature
      properties:
        event:
          enum:
          - mandate.activated
          - mandate.rejected
          - mandate.paused
          - mandate.resumed
          - mandate.revoked
          - mandate.expired
          - step_up.approved
          - step_up.declined
          - rail.safety_switch
          - rail.pre_debit_notice
          - rail.debit_opt_out
          - consent.withdrawn
          - negotiation_mandate.activated
          - negotiation_mandate.revoked
          - negotiation.step_up.approved
          - negotiation.step_up.declined
          - negotiation.request_extension
          - instruments.reported
          - loan.accepted
          - payment.afa_completed
        mandate_id:
          type: string
        related_mandates:
          type: array
          items:
            type: string
        step_up_id:
          type: string
        session_id:
          type: string
        closed_checkout_mandate:
          $ref: '#/components/schemas/Jws'
        auth_binding:
          $ref: '#/components/schemas/Mandate/properties/auth_binding'
        presentation:
          $ref: '#/components/schemas/Presentation'
          description: What the Trusted Surface presented and what the principal did. REQUIRED on step_up.approved, negotiation.step_up.approved,
            mandate.activated, loan.accepted and payment.afa_completed. On step_up.approved it MUST carry checkout_hash; on negotiation.step_up.approved
            it MUST carry offer_hash; never both. On either approval its user_action is never decline.
        source:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time
        signature:
          $ref: '#/components/schemas/Signature'
        negotiation_id:
          type: string
        offer_hash:
          $ref: '#/components/schemas/Hash'
          description: On negotiation.step_up.approved, the offer_hash of the offer the step-up names. Equals presentation.offer_hash; a mismatch
            is refused with 403 ts_render_mismatch.
        diff_ack:
          type: string
        attestation:
          type: object
        cascade_of:
          type: string
          description: On mandate.revoked of a sibling open Payment Mandate, the mandate_id of the root open Checkout Mandate whose revocation
            caused it. The Mandate Manager sends one mandate.revoked per sibling Payment Mandate.
        rail_revocation:
          $ref: '#/components/schemas/RailRevocation'
          description: On mandate.revoked of a sibling open Payment Mandate, and on mandate.rejected or mandate.revoked after a refusal that came
            after the rail primitive was created, whether that primitive is revoked at the rail.
      allOf:
      - if:
          properties:
            event:
              enum:
              - step_up.approved
              - negotiation.step_up.approved
              - mandate.activated
              - loan.accepted
              - payment.afa_completed
          required:
          - event
        then:
          required:
          - presentation
      - if:
          properties:
            event:
              const: step_up.approved
          required:
          - event
        then:
          properties:
            presentation:
              required:
              - checkout_hash
              properties:
                user_action:
                  not:
                    const: decline
      - if:
          properties:
            event:
              const: negotiation.step_up.approved
          required:
          - event
        then:
          properties:
            presentation:
              required:
              - offer_hash
              properties:
                user_action:
                  not:
                    const: decline
    RailRevocation:
      type: object
      description: Whether the rail primitive behind a revoked open Payment Mandate (for example a Reserve Pay block) is revoked at the rail.
        Reported per block. Until status is confirmed, or the primitive has expired, the block stays exposure in the mandate ledger.
      required:
      - status
      properties:
        status:
          enum:
          - confirmed
          - unconfirmed
        rail_ref:
          type: string
    Order:
      type: object
      required:
      - id
      - transaction_id
      - bpp_id
      - state
      - line_items
      - totals
      properties:
        id:
          type: string
        transaction_id:
          type: string
        bpp_id:
          type: string
        provider_id:
          type: string
        state:
          enum:
          - Created
          - Accepted
          - In-progress
          - Completed
          - Cancelled
        fulfilment_state:
          type: string
          description: ONDC fulfilment state code, e.g. Order-delivered
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/Total'
        invoice:
          type: object
          properties:
            irn:
              type: string
            qr:
              type: string
            ewb:
              type: string
            seller_gstin:
              type: string
            buyer_gstin:
              type: string
            doc_date:
              type: string
              format: date
        adjustments:
          type: array
          description: Append-only read model (UCP/ACP adjustments)
          items:
            type: object
            required:
            - type
            - status
            - at
            properties:
              type:
                enum:
                - cancellation
                - return
                - refund
                - replacement
                - dispute
              status:
                type: string
              amount:
                $ref: '#/components/schemas/Amount'
              charges_refunded:
                type: array
                items:
                  $ref: '#/components/schemas/RefundCharge'
              charges_retained:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/RefundCharge'
                  - required:
                    - refund_rule
                description: On a cancellation or refund adjustment, the charge lines kept, each disclosed before commitment and carrying its refund_rule.
              receipt_id:
                type: string
              at:
                type: string
                format: date-time
        return_window_ends:
          type: string
          format: date-time
        payment:
          $ref: '#/components/schemas/PaymentState'
        mandate_ref:
          type: string
    CancelRequest:
      type: object
      required:
      - reason_code
      - mandate_ref
      - presence
      properties:
        reason_code:
          type: string
          description: From Beckn get_cancellation_reasons
        mandate_ref:
          type: string
        presence:
          $ref: '#/components/schemas/Presence'
        hp_proof:
          $ref: '#/components/schemas/HpProof'
        note:
          $ref: '#/components/schemas/LangText'
        bpp_id:
          type: string
          description: Seller subscriber id. Required only when the agent holds the same order id from two BPPs (otherwise 400 invalid_request
            at $.bpp_id).
    ReturnRequest:
      type: object
      required:
      - items
      - reason_code
      - mandate_ref
      - presence
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemRef'
        reason_code:
          type: string
          description: From Beckn get_return_reasons
        mandate_ref:
          type: string
        presence:
          $ref: '#/components/schemas/Presence'
        hp_proof:
          $ref: '#/components/schemas/HpProof'
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                enum:
                - image
                - video
                - text
              hash:
                $ref: '#/components/schemas/Hash'
              uri:
                type: string
                format: uri
        refund_to:
          enum:
          - original_method
          default: original_method
        bpp_id:
          type: string
          description: Seller subscriber id. Required only when the agent holds the same order id from two BPPs (otherwise 400 invalid_request
            at $.bpp_id).
    ReturnRecord:
      type: object
      required:
      - return_id
      - order_id
      - status
      - items
      properties:
        return_id:
          type: string
        order_id:
          type: string
        status:
          enum:
          - RETURN_INITIATED
          - RETURN_APPROVED
          - RETURN_PICKED
          - RETURN_DELIVERED
          - RETURN_REJECTED
          - LIQUIDATED
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRef'
        refund:
          type: object
          properties:
            status:
              enum:
              - PENDING
              - INITIATED
              - SUCCESS
              - FAILED
            amount:
              $ref: '#/components/schemas/Amount'
            charges_refunded:
              type: array
              items:
                $ref: '#/components/schemas/RefundCharge'
              description: The charge lines the refund returns.
            charges_retained:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RefundCharge'
                - required:
                  - refund_rule
              description: The charge lines the refund keeps. Each was disclosed before commitment and carries its refund_rule. A refund below the amount
                paid that does not match these lines gets the refund_short_of_terms message.
            to:
              const: original_method
            receipt:
              anyOf:
              - $ref: '#/components/schemas/Receipt'
              - $ref: '#/components/schemas/ReceiptRef'
    IssueCreate:
      type: object
      required:
      - order_id
      - category
      - sub_category
      - description
      - mandate_ref
      properties:
        order_id:
          type: string
        category:
          enum:
          - ORDER
          - ITEM
          - FULFILLMENT
          - AGENT
          - PAYMENT
          - TRANSACTION
        sub_category:
          type: string
        description:
          $ref: '#/components/schemas/LangText'
        mandate_ref:
          type: string
        rrn:
          type: string
        utr:
          type: string
        evidence_bundle_ref:
          type: string
          format: uri
        bpp_id:
          type: string
          description: Seller subscriber id. Required only when the agent holds the same order id from two BPPs (otherwise 400 invalid_request
            at $.bpp_id).
        presence:
          $ref: '#/components/schemas/Presence'
          description: Presence of this write. Defaults to HNP. HP is required on an order whose mandate is not ACTIVE (REVOKED, PAUSED, EXPIRED or EXHAUSTED).
        hp_proof:
          $ref: '#/components/schemas/HpProof'
    Issue:
      type: object
      required:
      - id
      - order_id
      - level
      - status
      - complainant
      - actions
      properties:
        id:
          type: string
        order_id:
          type: string
        level:
          enum:
          - ISSUE
          - GRIEVANCE
        status:
          enum:
          - OPEN
          - PROCESSING
          - RESOLVED
          - CLOSED
        category:
          type: string
        sub_category:
          type: string
        complainant:
          type: object
          required:
          - actor_type
          - on_behalf_of
          properties:
            actor_type:
              const: AI_AGENT
            agent_id:
              type: string
            operator:
              type: string
            on_behalf_of:
              type: string
              description: principal_ref
            mandate_ref:
              type: string
        payment_refs:
          type: object
          properties:
            rrn:
              type: string
            utr:
              type: string
        evidence_bundle:
          $ref: '#/components/schemas/EvidenceBundle'
        actions:
          type: array
          items:
            type: object
            required:
            - action
            - actor_type
            - at
            properties:
              action:
                enum:
                - OPEN
                - INFO_REQUESTED
                - INFO_PROVIDED
                - INFO_NOT_AVAILABLE
                - PROCESSING
                - RESOLUTION_PROPOSED
                - RESOLUTION_ACCEPTED
                - RESOLUTION_REJECTED
                - RESOLUTION_CASCADED
                - ESCALATED
                - RESOLVED
                - CLOSED
              actor_type:
                enum:
                - AI_AGENT
                - CONSUMER
                - INTERFACING_NP
                - COUNTERPARTY_NP
                - CASCADED_NP
                - INTERFACING_NP_GRO
                - COUNTERPARTY_NP_GRO
                - CASCADED_NP_GRO
              note:
                $ref: '#/components/schemas/LangText'
              at:
                type: string
                format: date-time
        resolution:
          type: object
          description: The remedy the respondent currently proposes. A presence-proof step-up for RESOLUTION_ACCEPTED or RESOLUTION_REJECTED binds it by subject_hash (sha-256
            over its JCS form as shown to the principal); if it changes before the action is submitted, the proof is refused with 403
            presence_not_proven.
          properties:
            action_triggered:
              enum:
              - REFUND
              - REPLACEMENT
              - RETURN
              - CANCEL
              - NO-ACTION
            refund_amount:
              $ref: '#/components/schemas/Amount'
        expected_response_by:
          type: string
          format: date-time
        expected_resolution_by:
          type: string
          format: date-time
        odr_reference:
          type: string
          description: Out-of-protocol ODR escalation reference (IGM 2.0 has no DISPUTE level)
    EvidenceBundle:
      type: object
      required:
      - transaction_id
      - mandates
      - receipts
      - instruction_log
      properties:
        transaction_id:
          type: string
        agent_credential_hash:
          $ref: '#/components/schemas/Hash'
        mandates:
          type: array
          items:
            $ref: '#/components/schemas/Jws'
          description: Open and closed mandates (selectively disclosed)
        checkout:
          type: object
          properties:
            bpp_signed_quote:
              $ref: '#/components/schemas/Jws'
            checkout_hash:
              $ref: '#/components/schemas/Hash'
            disclosures_hash:
              $ref: '#/components/schemas/Hash'
            disclosures:
              $ref: '#/components/schemas/Disclosures'
              description: The disclosures whose hash is disclosures_hash, including catalogue[] for a session whose items came from POST /discover.
            bpp_signed_payment_terms:
              $ref: '#/components/schemas/BecknSignedMessage'
              description: The seller's payment terms from on_init (Beckn payments[], including collected_by and the payee VPA in
                params.virtual_payment_address), as the gateway received them (the raw on_init body and its Beckn Authorization header). REQUIRED for every Reserve Pay leg. Verification
                step 6 checks the signature and compares the payee of the PSP payment receipt, and for Reserve Pay the open Payment Mandate's payee,
                with it.
        discovery_sources:
          type: array
          description: For a session whose items came from POST /discover, the BPP-signed on_search callback behind every source_digest in
            checkout.disclosures.catalogue[], exactly as the gateway received it. A verifier checks that the sha-256 of each body equals the
            source_digest and that the authorization verifies against the BPP's registry key.
          items:
            $ref: '#/components/schemas/BecknSignedMessage'
        receipts:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/Receipt'
            - $ref: '#/components/schemas/ReceiptRef'
        consent_receipts:
          type: array
          items:
            type: string
        instruction_log:
          type: array
          items:
            $ref: '#/components/schemas/InstructionLogEntry'
        trusted_surface_events:
          type: array
          description: Every signed Trusted Surface event of the transaction, verbatim as received at /trusted-surface/events (step-up results,
            mandate activation, credit acceptance, AFA completion), with their Presentation.
          items:
            $ref: '#/components/schemas/TrustedSurfaceEvent'
        ts_renders:
          type: array
          description: The gateway-signed ts_render (compact JWS) of every step-up that a step_up.approved or step_up.declined event in
            trusted_surface_events names, byte-identical to what the Trusted Surface fetched. Verification step 6 checks each against its event's
            content_hash and against the seller-signed quote.
          items:
            $ref: '#/components/schemas/Jws'
        ts_render_digests:
          type: array
          description: Only in a bundle released to a seller or a payer PSP. For each summary step-up over a multi-seller basket, the sha-256 of
            its ts_render and the covers[] entry of this leg, in place of the full render, which lists every seller of the basket and goes only to
            the principal, the grievance officer, the ODR body and a regulator.
          items:
            $ref: '#/components/schemas/TsRenderDigest'
        verification:
          type: object
          description: Result of the dispute verification run by the gateway (the AP2 five steps plus step 6, Trusted Surface events)
          properties:
            steps_passed:
              type: integer
              maximum: 6
            chain_valid:
              type: boolean
        bundle_signature:
          $ref: '#/components/schemas/Signature'
    WebhookEvent:
      type: object
      description: Delivered with Standard Webhooks headers (webhook-id, webhook-timestamp) plus a mandatory RFC 9421 signature by the gateway
        (UCP rule). Retries with backoff. Payloads are full-state snapshots, except that a webhook never embeds a signed receipt; each one is
        replaced by a ReceiptRef, and the full receipt is fetched by GET on its owning resource. A webhook carries no personal data outside the
        receiving agent's mandate data_scopes and no negotiation bound.
      required:
      - event_id
      - type
      - created_at
      - data
      properties:
        event_id:
          type: string
        type:
          enum:
          - mandate.status_changed
          - session.updated
          - payment.receipt
          - order.updated
          - return.updated
          - issue.updated
          - pre_debit.notice
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    MandateStatusChangedData:
      type: object
      description: Payload of the mandate.status_changed webhook. Additional properties are allowed.
      required:
      - mandate_id
      - status
      properties:
        mandate_id:
          type: string
        status:
          enum:
          - ACTIVE
          - PAUSED
          - REVOKED
          - EXPIRED
          - EXHAUSTED
        reason:
          type: string
          description: The reason for this event, for example user_revoked_on_trusted_surface, principal_paused, binding_ineligible or
            reissue_required. For a PAUSED mandate it names the reason added or removed by this event; the full set is in pause_reasons.
        pause_reasons:
          type: array
          uniqueItems: true
          description: Every reason for which the mandate is paused. The mandate stays PAUSED while this set is not empty. Only the principal,
            on the Trusted Surface, removes principal_paused; the gateway removes only binding_ineligible, and only on a strictly newer registry
            version (or conformance attestation) in which the binding is eligible; reissue_required is never removed, and the mandate is
            re-issued instead. unmatched_rail_debit (a debit on a Reserve Pay block that matches no BACP payment, reported by a payer PSP that
            attests a block-debit feed) is removed only by the principal on the Trusted Surface. Empty or absent when the status is not PAUSED.
          items:
            enum:
            - principal_paused
            - binding_ineligible
            - reissue_required
            - unmatched_rail_debit
        cascade_of:
          type: string
          description: For a REVOKED sibling open Payment Mandate, the root open Checkout Mandate whose revocation caused it.
        rail_revocation:
          $ref: '#/components/schemas/RailRevocation'
        registry_version:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: For a pause or lift of binding_ineligible, the handler-registry release (YYYY-MM-DD) that made the binding ineligible
            or eligible again.
        affected_sessions:
          type: array
          items:
            type: string
    NegotiationCreate:
      type: object
      required:
      - bpp_id
      - mode
      - negotiation_mandate_ref
      - presence
      - items
      properties:
        bpp_id:
          type: string
        provider_id:
          type: string
        mode:
          $ref: ../schemas/negotiation-session.json#/$defs/Mode
        profile:
          type: string
          description: Trade-model profile id, e.g. b2c.ecom, b2b.procurement
        negotiation_mandate_ref:
          type: string
          pattern: ^mdt_[A-Za-z0-9]{12,40}$
        presence:
          enum:
          - HP
          - HNP
        rfq_parent_id:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - item_id
            - quantity
            properties:
              item_id:
                type: string
              quantity:
                type: number
                exclusiveMinimum: 0
        initial_term_sheet:
          $ref: ../schemas/termsheet.json
        max_wait_ms:
          type: integer
          maximum: 10000
          default: 4000
    NegotiationMessageDraft:
      type: object
      description: 'Agent-submitted draft. The gateway fills envelope fields (msg_id, round, dispatched_at, from, signatures), applies

        the patch to the live term sheet, computes all_in_total and expires_at, then guards, validates and signs.

        '
      required:
      - type
      properties:
        type:
          enum:
          - offer
          - counter_offer
          - bid
          - reject
          - withdraw
          - terminate
          - request_extension
          - accept_revoke
          - bid_commit
          - bid_reveal
          - bid_retract
        in_reply_to:
          type: string
        offer_hash:
          type: string
        firm:
          type: boolean
        subject_to_principal_approval:
          type: boolean
        expires_in:
          type: string
          description: ISO 8601 duration, at least min_offer_validity
        term_sheet:
          $ref: ../schemas/termsheet.json
        term_sheet_patch:
          type: array
          description: RFC 6902 JSON Patch against the live term sheet. Only negotiable issues may change.
          items:
            type: object
            required:
            - op
            - path
            properties:
              op:
                enum:
                - add
                - remove
                - replace
              path:
                type: string
              value: {}
        reason:
          type: string
        reason_code:
          type: string
        final:
          type: boolean
        auction_id:
          type: string
        bid_deposit_ref:
          type: string
        salt:
          type: string
        advisory_text:
          type: string
          description: Logged with binding false and returned to the counterparty only as untrusted text
        acceptance_revocation:
          enum:
          - waived
          - allowed_until_receipt
          description: REQUIRED on a firm offer, counter_offer or bid draft. The gateway copies it into the signed message unchanged and never
            inserts or normalises a value; a firm draft without it is refused with 400 NEG_SCHEMA_INVALID. waived is permitted only with
            waiver_basis and only outside consumer trade profiles. A draft with allowed_until_receipt is refused with 403 capabilities_incompatible
            and nothing is sent.
        waiver_basis:
          description: REQUIRED when acceptance_revocation is waived. The signed contract or the buyer's own RFQ under which the offer excludes
            revocation of acceptance; hash is REQUIRED.
          allOf:
          - $ref: ../schemas/common.json#/$defs/DocumentRef
          - properties:
              doc_type:
                enum:
                - contract
                - rfq
            required:
            - hash
        accept_msg_hash:
          $ref: ../schemas/common.json#/$defs/Hash
          description: For accept_revoke, REQUIRED with offer_hash. The msg_hash of the accept to revoke; offer_hash is the offer that accept
            names.
      allOf:
      - if:
          properties:
            subject_to_principal_approval:
              const: true
          required:
          - subject_to_principal_approval
        then:
          properties:
            firm:
              const: false
      - if:
          properties:
            type:
              enum:
              - offer
              - counter_offer
              - bid
            firm:
              const: true
          required:
          - type
          - firm
        then:
          required:
          - acceptance_revocation
      - if:
          properties:
            acceptance_revocation:
              const: waived
          required:
          - acceptance_revocation
        then:
          required:
          - waiver_basis
      - if:
          properties:
            type:
              const: accept_revoke
          required:
          - type
        then:
          required:
          - accept_msg_hash
          - offer_hash
    AcceptRequest:
      type: object
      required:
      - offer_hash
      properties:
        offer_hash:
          type: string
        step_up_id:
          type: string
          description: Present after the principal approved an out-of-mandate deal
      not:
        anyOf:
        - required:
          - term_sheet
        - required:
          - term_sheet_patch
    ReceiptRef:
      type: object
      required:
      - receipt_id
      - receipt_hash
      - result
      description: Webhook-scoped receipt reference. GET the resource for the full signed receipt.
      properties:
        receipt_id:
          type: string
        receipt_hash:
          $ref: '#/components/schemas/Hash'
        receipt_type:
          enum:
          - mandate
          - checkout
          - payment
          - refund
        result:
          enum:
          - success
          - failure
          - in_doubt
        amount:
          $ref: '#/components/schemas/Amount'
        refund_state:
          type: string
        rail:
          type: object
          properties:
            type:
              type: string
            rrn:
              type: string
            status:
              type: string
            original_rrn:
              type: string
      additionalProperties: false
