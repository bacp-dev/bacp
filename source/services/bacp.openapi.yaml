      description: 'Requires negotiation_id: the inputs come from the negotiated TermSheet. A request with only session_id, or with

        neither, gets 400. Session-scoped intersection is not defined in this version (Q-45).


        Intersection of registry, BAP profile, BPP accepted handlers, the TermSheet payment option and tranche, mandates,

