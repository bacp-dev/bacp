  /trusted-surface/events:
    post:
      tags:
      - trusted-surface
      operationId: trustedSurfaceEvent
      summary: Signed event from a Mandate Manager or payer PSP (mandate activated, paused, resumed, revoked, step-up result, rail event)
      description: 'Authenticated by the MM/PSP registry key (RFC 9421, tag `bacp-ts`). Agents calling this endpoint get 403.

        An event about a session or step-up is accepted only from the step-up''s Mandate Manager or payer PSP. For a session step-up these are
        the issuer of the session''s mandate and the PSP named in `rail_binding.psp_id` of the leg''s planned open Payment Mandate under the
        session''s root. For a summary step-up over a multi-seller basket (one that carries `covers[]`) it is only the issuer of the shared root;
        no payer PSP. For a `post_order` step-up (no session) they are the issuer of the mandate the order was placed under and the
        PSP named in `auth_binding.psp_id` of the order''s closed Payment Mandate (any of them under split tender). Any other registry key gets
        404 not_found, never 403, and nothing changes. A request under tag `bacp-ts` carries no BACP-Agent header.

        step_up.approved, mandate.activated, loan.accepted and payment.afa_completed MUST carry `presentation`; without it the event is refused
        with 400 invalid_request and nothing changes. On step_up.approved, `presentation.checkout_hash` is REQUIRED (the session''s quote, or for
        a `post_order` step-up the order''s) and `presentation.user_action` is never decline (a decline is posted as step_up.declined); otherwise
        the event is refused with 400 invalid_request and nothing changes. On step_up.approved the gateway refuses the event with 403 ts_render_mismatch, and changes
        nothing, when `presentation.content_hash` is not the sha-256 of the step-up''s `ts_render`; with 403 presence_not_proven when the session
        is assisted (channel assisted, or an AgentCredential of class assisted) and `presentation.user_action` is not the principal''s own factor
        or `presentation.assisted_by` is not an assisted operator of the session; and treats it as expired when `presentation.acted_at` is after
        the step-up''s `expires_at`. While the session is in human_handoff the approval is held, not applied, until the handoff is released.

        When a root open Checkout Mandate ends (revoked by the principal, a rail safety switch or relinquishment, or expired), the Mandate
        Manager sends one mandate.revoked per sibling open Payment Mandate, each with `cascade_of` (the root) and `rail_revocation.status` for
        its rail primitive; a block whose revocation is unconfirmed stays exposure in the ledger, also against any new root of the same
        principal. The gateway applies the mandate.activated of a sibling Reserve Pay block inside the atomic section keyed on the root and
        refuses it with 403 mandate_exhausted when the block at its full amount no longer fits the root''s headroom; the Mandate Manager then
        revokes the mandate and the block and reports `rail_revocation`. A mandate.rejected sent after the rail primitive was created carries
        `rail_revocation` for it. A block reported with `rail_revocation.status` unconfirmed, including one refused at issuance or
        activation that never became ACTIVE, is exposure at its attested block_amount until the revocation is confirmed or the block expires.

        On mandate.revoked or rail.safety_switch the gateway MUST stop all in-flight sessions under the mandate and notify

        the agent (webhook mandate.status_changed) within 60 s.

        '
      security:
      - httpSignature: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedSurfaceEvent'
            examples:
              revoked:
                value:
                  event: mandate.revoked
                  mandate_id: mdt_PAY7Q2W9X4K1M3
                  related_mandates:
                  - mdt_CHK7Q2W9X4K1M3
                  at: '2026-10-25T08:00:00+05:30'
                  source:
                    iss: mm.psp.example.in
                    rail_event: SBMD_REVOKED
                    rail_ref: SBMD-HDFX-000123456
                  signature:
                    role: mandate_manager
                    kid: mm.psp.example.in|ukid-2|es256
                    alg: ES256
                    value: eyJhbGciOiJFUzI1NiJ9.eyJyIjoxfQ.c2ln
              stepUpApproved:
                value:
                  event: step_up.approved
                  step_up_id: stp_01HZXA
                  session_id: ses_01HZXB
                  closed_checkout_mandate: eyJhbGciOiJFUzI1NiJ9.eyJ1c2VyIjoxfQ.c2ln
                  auth_binding:
                    type: upi.pin
                    ref: PSPAUTH-55120
                    psp_id: psp.example.in
                  presentation:
                    surface: psp.example.in
                    channel: app
                    language: hi-IN
                    modality: visual
                    content_hash: sha-256:t1dVn6mjcxJp1xBJ6Q1uN3lvlK1D5oQh0pX8wv5cY4E
                    content_ref: https://gw.bap.example.in/bacp/trusted-surface/step-ups/stp_01HZXA
                    template_id: psp.example.in/app/step-up-confirm/3
                    checkout_hash: sha-256:vRBpqmLq4AipYw1ZNnIL3trdLVrcHQAQ0g5RurJB4CQ
                    user_action: upi_pin
                    shown_at: '2026-10-22T18:31:02+05:30'
                    acted_at: '2026-10-22T18:31:38+05:30'
                    device_signature: eyJhbGciOiJFUzI1NiJ9.eyJkIjoxfQ.c2ln
                  at: '2026-10-22T18:31:40+05:30'
                  signature:
                    role: psp
                    kid: psp.example.in|ukid-1|es256
                    alg: ES256
                    value: eyJhbGciOiJFUzI1NiJ9.eyJzIjoxfQ.c2ln
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
