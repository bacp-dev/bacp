openapi: 3.1.0
info:
  title: Bharat Agentic Commerce Protocol (BACP) — Gateway REST binding
  version: draft
  summary: REST binding that a BACP gateway exposes to AI agents.
  description: "Synchronous, UCP-compatible session API that a BACP gateway (co-located with a Buyer App / BAP) exposes to AI agents.\nThe gateway\
    \ translates each call into signed Beckn/ONDC actions (search, select, init, confirm, status, cancel, update,\nIGM issue/issue_status), waits\
    \ for the on_* callbacks, and returns authoritative full state (ACP pattern).\nThe same operations are bound to MCP tools (structuredContent)\
    \ and an A2A extension. See https://bacp.dev/latest/specification/transports/rest/.\n\nNormative rules carried by this spec:\n- Every request is signed with RFC 9421\
    \ HTTP Message Signatures (Signature-Input, Signature, Content-Digest per RFC 9530)\n  using the agent key in AgentCredential.cnf. Tag `bacp-browse`\
    \ for read and discovery calls, `bacp-pay` for\n  /complete, `bacp-post-order` for cancel, return and issue writes. Signature window at most\
    \ 300 s, with a nonce\n  and a receiver replay cache (see the Identity and request signing section).\n- `Idempotency-Key` is REQUIRED on every POST and PUT (ACP\
    \ semantics). Missing key returns 400\n  idempotency_key_required. Same key with a different body returns 422 idempotency_conflict. Same key\
    \ while the first\n  request is in flight returns 409 idempotency_in_flight with Retry-After. A replay returns the stored response with\n\
    \  `Idempotent-Replayed: true`. Keys are kept at least 24 h (48 h recommended). 5xx responses are never stored.\n- Amounts are integer paise\
    \ (INR minor units).\n- Business outcomes return 200/201 with full state plus `messages[]`. Transport and protocol failures return 4xx/5xx\n\
    \  with the flat Error object (ACP model).\n- Unknown fields MUST be ignored by readers. Unknown mandate constraints MUST fail closed.\n"
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://gw.bap.example.in/bacp
  description: Example BAP-hosted BACP gateway
security:
- httpSignature: []
  agentCredential: []
tags:
- name: profile
- name: discovery
- name: session
  description: Checkout session (UCP checkout verbs) over Beckn select, init and confirm
- name: mandate
- name: order
  description: Post-order reads and mandate-scoped writes (cancel, return)
- name: issue
  description: IGM 2.0-compatible grievance with AI_AGENT actor and evidence bundle
- name: evidence
- name: trusted-surface
  description: Callbacks from Mandate Manager / payer PSP (Trusted Surface). Never callable by agents.
- name: negotiation
  description: Bilateral negotiation sessions
- name: rfq
  description: Structured RFQ with sealed commit-reveal quotations
- name: auction
  description: Forward, reverse (L1) and Dutch auctions run by a neutral auctioneer
- name: payment-handlers
  description: Registry of Indian payment handlers and UCP-style intersection (section 13)
paths:
  /.well-known/bacp:
    get:
      tags:
      - profile
      operationId: getProfile
      summary: Gateway profile (UCP /.well-known pattern)
      security: []
      responses:
        '200':
          description: Profile with versions, capabilities, handlers, transports and JWK Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                default:
                  value:
                    bacp:
                      version: '0.1'
                      supported_versions:
                      - '0.1'
                    bap_id: bap.vaani.example.in
                    transports:
                    - rest
                    - mcp
                    - a2a
                    capabilities:
                    - in.bacp.discover
                    - in.bacp.checkout
                    - in.bacp.mandate
                    - in.bacp.order
                    - in.bacp.issue
                    payment_handlers:
                    - upi.circle.delegate
                    - upi.reservepay.block
                    - upi.autopay
                    - upi.lite
                    - upi.123pay
                    - rupay.token
                    - cod
                    reserved_handlers:
                    - upi.uap.*
                    keys:
                      keys:
                      - kty: OKP
                        crv: Ed25519
                        x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                        kid: ukid-7
  /discover:
    post:
      tags:
      - discovery
      operationId: discover
      summary: Network discovery (Beckn search / 2.0 discover via gateway and registry)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
            examples:
              hindiVoice:
                value:
                  query:
                    hi-IN: do kilo aashirvaad atta, ek litre doodh, aadha kilo toor dal
                  category: ONDC:RET10
                  delivery:
                    pincode: '560034'
                    gps: 12.9352,77.6245
                  mandate_ref: mdt_CHK7Q2W9X4K1M3
                  max_wait_ms: 4000
      responses:
        '200':
          description: Aggregated on_search results within max_wait_ms, with ranking explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResponse'
              examples:
                default:
                  value:
                    transaction_id: 6f1c2a8e-0c7b-4f7e-9d0e-1b2c3d4e5f60
                    results:
                    - bpp_id: bpp.kirana.example.in
                      provider:
                        id: P-112
                        name: Shree Ganesh Kirana
                        rating: 4.5
                      items:
                      - id: I-ATTA-2KG
                        name:
                          en-IN: Aashirvaad Atta 2 kg
                          hi-IN: आशीर्वाद आटा 2 किलो
                        unit_price:
                          value: 11000
                          currency: INR
                        hsn: '1101'
                        gst_rate_bps: 0
                        available_on_cod: true
                        returnable: true
                        return_window: P2D
                      within_mandate: true
                    ranking:
                      main_parameters:
                      - distance
                      - price
                      - seller_rating
                      sponsored: false
                    complete: true
                    messages: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
  /sessions:
    post:
      tags:
      - session
      operationId: createSession
      summary: Create checkout session (UCP create_checkout, Beckn select)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            examples:
              grocery:
                value:
                  transaction_id: 6f1c2a8e-0c7b-4f7e-9d0e-1b2c3d4e5f60
                  bpp_id: bpp.kirana.example.in
                  provider_id: P-112
                  items:
                  - id: I-ATTA-2KG
                    quantity: 1
                  - id: I-MILK-1L
                    quantity: 1
                  - id: I-TOOR-500G
                    quantity: 1
                  presence: HNP
                  mandate_ref: mdt_CHK7Q2W9X4K1M3
                  channel: voice
                  language: hi-IN
                  webhook_url: https://agents.vaani.example.in/bacp/hooks
      responses:
        '201':
          description: Session with authoritative quote (from on_select)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                quoted:
                  $ref: '#/components/examples/SessionQuoted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '409':
          $ref: '#/components/responses/InFlight'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '504':
          $ref: '#/components/responses/BppTimeout'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/BppNack'
  /sessions/{session_id}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      tags:
      - session
      operationId: getSession
      summary: Get session (UCP get_checkout). Use for lost-response recovery before any retry.
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Authoritative full state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                ready:
                  $ref: '#/components/examples/SessionReady'
                stepUp:
                  $ref: '#/components/examples/SessionStepUp'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - session
      operationId: updateSession
      summary: Update session, full replace (UCP update_checkout). Items trigger select, fulfilment/billing triggers init.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
            examples:
              addFulfilment:
                value:
                  items:
                  - id: I-ATTA-2KG
                    quantity: 1
                  - id: I-MILK-1L
                    quantity: 1
                  - id: I-TOOR-500G
                    quantity: 1
                  fulfilment:
                    type: Delivery
                    address_ref: addr_home
                    pincode: '560034'
                  data_share:
                    consent_receipt_ref: cr_A1B2C3D4E5F6G7
                    fields:
                    - NAME
                    - PHONE
                    - DELIVERY_ADDRESS
                  payment:
                    handler: upi.reservepay.block
      responses:
        '200':
          description: Updated full state (ready_for_complete after on_init, or requires_escalation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                ready:
                  $ref: '#/components/examples/SessionReady'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '409':
          $ref: '#/components/responses/InFlight'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '504':
          $ref: '#/components/responses/BppTimeout'
  /sessions/{session_id}/complete:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - session
      operationId: completeSession
      summary: Complete (UCP complete_checkout). Verifies closed mandates, debits the rail, sends Beckn confirm.
      description: 'HNP: body carries the agent-closed Checkout and Payment Mandates (KB-JWT under the open mandates'' cnf key).

        HP: body carries closed mandates signed on the Trusted Surface plus a per-transaction 2FA reference (auth_binding).

        Returns `completed` with order and payment receipt, `complete_in_progress` (payment in doubt or awaiting on_confirm),

        or `requires_escalation` with a step_up object. Retry ONLY with the same Idempotency-Key after GET /sessions/{id}.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
            examples:
              hnpReservePay:
                value:
                  presence: HNP
                  checkout_mandate: eyJhbGciOiJFUzI1NiJ9.eyJ2Y3QiOiJpbi5iYWNwLm1hbmRhdGUuY2hlY2tvdXQuMSJ9.c2ln~WyJzYWx0IiwiY2hlY2tvdXRfaGFzaCJd~eyJhbGciOiJFUzI1NiJ9.eyJub25jZSI6Im4ifQ.c2ln
                  payment_mandate: eyJhbGciOiJFUzI1NiJ9.eyJ2Y3QiOiJpbi5iYWNwLm1hbmRhdGUucGF5bWVudC4xIn0.c2ln~eyJhbGciOiJFUzI1NiJ9.eyJub25jZSI6Im4ifQ.c2ln
                  checkout_hash: sha-256:Y2hlY2tvdXQtaGFzaC1rYWlyYW5hLTg4MjMxLXF1b3Rl
                  accepted_disclosures_hash: sha-256:ZGlzY2xvc3VyZXMtaGFzaC1rYWlyYW5hLTg4MjMxLXg
      responses:
        '200':
          description: Completed, in progress, or requires escalation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                completed:
                  $ref: '#/components/examples/SessionCompleted'
                stepUp:
                  $ref: '#/components/examples/SessionStepUp'
                inDoubt:
                  $ref: '#/components/examples/SessionInDoubt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '409':
          $ref: '#/components/responses/InFlight'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /sessions/{session_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - session
      operationId: cancelSession
      summary: Cancel a session before an order exists (UCP cancel_checkout). No Beckn call is needed.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Canceled session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /mandates:
    post:
      tags:
      - mandate
      operationId: requestMandate
      summary: Request a mandate. Returns PENDING plus a Trusted Surface link. The agent never signs or activates it.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateRequest'
            examples:
              groceryReservePay:
                value:
                  purpose_code: P-GRO-01
                  rail: upi.reservepay.block
                  presence_allowed:
                  - HNP
                  - HP
                  proposed_constraints:
                    amount_per_txn:
                      value: 150000
                      currency: INR
                    budgets:
                    - period: P1M
                      max:
                        value: 300000
                        currency: INR
                    categories_allow:
                    - ONDC:RET10
                    delivery_pincodes:
                    - '560034'
                    step_up:
                      above_amount:
                        value: 120000
                        currency: INR
                      outside_categories: true
                    reject_preticked_addons: true
                  data_scopes:
                  - NAME
                  - PHONE
                  - DELIVERY_ADDRESS
                  validity: P30D
                  language: hi-IN
      responses:
        '202':
          description: Mandate request created in PENDING. User must approve on the Trusted Surface.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateHandle'
              examples:
                pending:
                  value:
                    request_id: mrq_01HZX7
                    status: PENDING
                    trusted_surface_url: upi://mandate?pa=vaani.collect@examplebank&mn=BACP&am=3000.00&mode=SBMD&ref=mrq_01HZX7
                    expires_at: '2026-10-12T10:15:00+05:30'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /mandates/{mandate_id}:
    parameters:
    - $ref: '#/components/parameters/MandateId'
    get:
      tags:
      - mandate
      operationId: getMandate
      summary: Get mandate with live status and usage (AA ConsentUse analogue)
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Mandate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              examples:
                openPayment:
                  $ref: '#/components/examples/OpenPaymentMandate'
        '404':
          $ref: '#/components/responses/NotFound'
  /mandates/{mandate_id}/relinquish:
    parameters:
    - $ref: '#/components/parameters/MandateId'
    post:
      tags:
      - mandate
      operationId: relinquishMandate
      summary: Agent gives up its authority (agent-side revoke). Users revoke or pause on the Trusted Surface only.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Mandate now REVOKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /trusted-surface/events:
    post:
      tags:
      - trusted-surface
      operationId: trustedSurfaceEvent
      summary: Signed event from a Mandate Manager or payer PSP (mandate activated, paused, resumed, revoked, step-up result, rail event)
      description: 'Authenticated by the MM/PSP registry key (RFC 9421, tag `bacp-ts`). Agents calling this endpoint get 403.

        On mandate.revoked or rail.safety_switch the gateway MUST stop all in-flight sessions under the mandate and notify

        the agent (webhook mandate.status_changed) within 60 s.

        '
      security:
      - httpSignature: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedSurfaceEvent'
            examples:
              revoked:
                value:
                  event: mandate.revoked
                  mandate_id: mdt_PAY7Q2W9X4K1M3
                  related_mandates:
                  - mdt_CHK7Q2W9X4K1M3
                  at: '2026-10-25T08:00:00+05:30'
                  source:
                    iss: mm.psp.example.in
                    rail_event: SBMD_REVOKED
                    rail_ref: SBMD-HDFX-000123456
                  signature:
                    role: mandate_manager
                    kid: mm.psp.example.in|ukid-2|es256
                    alg: ES256
                    value: eyJhbGciOiJFUzI1NiJ9.eyJyIjoxfQ.c2ln
              stepUpApproved:
                value:
                  event: step_up.approved
                  step_up_id: stp_01HZXA
                  session_id: ses_01HZXB
                  closed_checkout_mandate: eyJhbGciOiJFUzI1NiJ9.eyJ1c2VyIjoxfQ.c2ln
                  auth_binding:
                    type: upi.pin
                    ref: PSPAUTH-55120
                    psp_id: psp.example.in
                  at: '2026-10-22T18:31:40+05:30'
                  signature:
                    role: psp
                    kid: psp.example.in|ukid-1|es256
                    alg: ES256
                    value: eyJhbGciOiJFUzI1NiJ9.eyJzIjoxfQ.c2ln
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /orders/{order_id}:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      tags:
      - order
      operationId: getOrder
      summary: Get order (Beckn status, UCP get_order). Adjustments are the append-only read model.
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      - name: bpp_id
        in: query
        required: false
        schema:
          type: string
        description: Seller subscriber id; needed only when the order id is ambiguous across BPPs.
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                delivered:
                  $ref: '#/components/examples/OrderDelivered'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{order_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - order
      operationId: cancelOrder
      summary: Mandate-scoped cancel (Beckn cancel). Requires CANCEL in action_scope.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            examples:
              changedMind:
                value:
                  reason_code: '001'
                  mandate_ref: mdt_CHK7Q2W9X4K1M3
                  presence: HP
                  note:
                    hi-IN: Galti se order ho gaya
      responses:
        '200':
          description: Order with cancellation state from on_cancel, refund adjustment pending or done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '409':
          $ref: '#/components/responses/InFlight'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /orders/{order_id}/returns:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - order
      operationId: requestReturn
      summary: Mandate-scoped return (Beckn update with update_target=item). Requires RETURN in action_scope.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
            examples:
              damagedMilk:
                value:
                  items:
                  - id: I-MILK-1L
                    quantity: 1
                  reason_code: '002'
                  mandate_ref: mdt_CHK7Q2W9X4K1M3
                  presence: HP
                  evidence:
                  - type: image
                    hash: sha-256:aW1hZ2UtZGFtYWdlZC1taWxrLXBhY2tldC0wMDAwMDE
                    uri: https://agents.vaani.example.in/e/1.jpg
                  refund_to: original_method
      responses:
        '202':
          description: Return accepted for processing. Track via GET or webhook return.updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRecord'
              examples:
                initiated:
                  value:
                    return_id: ret_01HZXC
                    order_id: ORD-KIR-88231
                    status: RETURN_INITIATED
                    items:
                    - id: I-MILK-1L
                      quantity: 1
                    refund:
                      status: PENDING
                      amount:
                        value: 6800
                        currency: INR
                      to: original_method
        '403':
          $ref: '#/components/responses/MandateRejected'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
