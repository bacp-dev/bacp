    post:
      tags:
      - negotiation
      operationId: sendNegotiationMessage
      summary: Send offer, counter_offer, reject, withdraw, terminate, request_extension or accept_revoke
      description: "The agent submits an unsigned draft in a request signed with its own key (RFC 9421, tag bacp-negotiate for firm messages,\
        \ withdraw and accept_revoke, bacp-browse for other non-firm ones). The gateway verifies that signature before parsing and records it as the agent's act in the transcript,\
        \ runs guard N-1..N-11 and validators V-01..V-14, signs the message with the BAP registry key only, and sends Beckn select (buyer) carrying\
        \ a bacp.neg TagGroup. The gateway never holds or uses an agent key.\n- A firm counter outside the negotiation mandate is never sent.\
        \ The response is 200 with `requires_escalation`, or the agent may resend with subject_to_principal_approval true (forces firm false).\n\
        - A counter that cites a non-live offer returns 409 NEG_STALE_OFFER. A counter on an expired offer returns 200\n  message NEG_OFFER_EXPIRED\
        \ (a fresh `offer` is allowed while rounds and deadline remain).\n- A withdraw is effective on receipt. The crossing rule (earlier CounterSignature\
        \ timestamp wins) is applied by\n  the gateway and reflected in offers[].state.\n- A firm offer, counter_offer or bid draft without\
        \ acceptance_revocation returns 400 NEG_SCHEMA_INVALID; the gateway never inserts a value. waived needs waiver_basis (a contract\
        \ or the buyer's own RFQ, with hash). A draft with acceptance_revocation allowed_until_receipt is refused with 403 capabilities_incompatible\
        \ and nothing is sent.\n- An accept_revoke draft carries accept_msg_hash and offer_hash. In this version no offer sets allowed_until_receipt,\
        \ so the outcome is accept_revoke_not_allowed (countersigned, logged, refused).\n"
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiationMessageDraft'
            examples:
              counter:
                value:
                  type: counter_offer
