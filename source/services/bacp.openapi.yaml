openapi: 3.1.0
info:
  title: Bharat Agentic Commerce Protocol (BACP) — Gateway REST binding
  version: "2026-10-17"
  summary: REST binding that a BACP gateway exposes to AI agents.
  description: "Synchronous, UCP-compatible session API that a BACP gateway (co-located with a Buyer App / BAP) exposes to AI agents.\nThe gateway\
    \ translates each call into signed Beckn/ONDC actions (search, select, init, confirm, status, cancel, update,\nIGM 2.0 issue/on_issue), waits\
    \ for the on_* callbacks, and returns authoritative full state (ACP pattern).\nThe same operations are bound to MCP tools (structuredContent)\
    \ and an A2A extension. See https://bacp.dev/latest/specification/transports/rest/.\n\nNormative rules carried by this spec:\n- Every request\
    \ is signed with RFC 9421 HTTP Message Signatures (Signature-Input, Signature, Content-Digest per RFC 9530)\n  using the agent key in AgentCredential.cnf.\
    \ Tag `bacp-browse` for read and discovery calls, `bacp-pay` for\n  /complete, `bacp-post-order` for cancel, return and issue writes, `bacp-negotiate`\
    \ for binding negotiation acts (firm offers,\n  accept, award, bids). Signature window at most 300 s, with a nonce\n  and a receiver replay\
    \ cache (see the Identity and request signing section).\n- `Idempotency-Key` is REQUIRED on every POST and PUT (ACP semantics). Missing key\
    \ returns 400\n  idempotency_key_required. Same key with a different body returns 422 idempotency_conflict. Same key while the first\n  request\
    \ is in flight returns 409 idempotency_in_flight with Retry-After. A replay returns the stored response with\n  `Idempotent-Replayed: true`.\
    \ Keys are kept at least 24 h (48 h recommended). 5xx responses are never stored.\n- Amounts are integer paise (INR minor units).\n- Business\
    \ outcomes return 200/201 with full state plus `messages[]`. Transport and protocol failures return 4xx/5xx\n  with the flat Error object\
    \ (ACP model).\n- Unknown fields MUST be ignored by readers. Unknown mandate constraints MUST fail closed.\n"
  contact:
    name: BACP maintainers
    url: https://github.com/bacp-dev/bacp
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://gw.bap.example.in/bacp
  description: Example BAP-hosted BACP gateway
security:
- httpSignature: []
  agentCredential: []
tags:
- name: profile
- name: discovery
- name: session
  description: Checkout session (UCP checkout verbs) over Beckn select, init and confirm
- name: mandate
- name: order
  description: Post-order reads and mandate-scoped writes (cancel, return)
- name: issue
  description: IGM 2.0-compatible grievance with AI_AGENT actor and evidence bundle
- name: evidence
- name: trusted-surface
  description: Callbacks from Mandate Manager / payer PSP (Trusted Surface). Never callable by agents.
- name: negotiation
  description: Bilateral negotiation sessions
- name: rfq
  description: Structured RFQ with sealed commit-reveal quotations
- name: auction
  description: Forward, reverse (L1) and Dutch auctions run by a neutral auctioneer
- name: payment-handlers
  description: Registry of Indian payment handlers and UCP-style intersection
paths:
  /.well-known/bacp:
    get:
      tags:
      - profile
      operationId: getProfile
      summary: Gateway profile (UCP /.well-known pattern)
      security: []
      responses:
        '200':
          description: Profile with versions, capabilities, handlers, transports and JWK Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                default:
                  value:
                    bacp:
                      version: '2026-10-17'
                      supported_versions:
                      - '2026-10-17'
                    bap_id: bap.vaani.example.in
                    transports:
                    - rest
                    - mcp
                    - a2a
                    capabilities:
                    - in.bacp.discover
                    - in.bacp.checkout
                    - in.bacp.mandate
                    - in.bacp.order
                    - in.bacp.issue
                    payment_handlers:
                    - in.upi.circle
                    - in.upi.reservepay
                    - in.upi.autopay
                    - in.upi.lite
                    - in.upi.123pay
                    - in.card.token
                    - in.cod
                    reserved_handlers:
                    - in.upi.uap
                    message_id_namespace: 6f1c2a8e-4b1d-5c3e-9a7f-2d4e6f8a0b1c
                    keys:
                      keys:
                      - kty: OKP
                        crv: Ed25519
                        x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                        kid: ukid-7
  /discover:
    post:
      tags:
      - discovery
      operationId: discover
      summary: Network discovery (Beckn search / 2.0 discover via gateway and registry)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
            examples:
              hindiVoice:
                value:
                  query:
                    hi-Latn-IN: do kilo chakki atta, ek litre doodh, aadha kilo toor dal
                  category: ONDC:RET10
                  delivery:
                    pincode: '560034'
                    gps: 12.9352,77.6245
                  mandate_ref: mdt_CHK7Q2W9X4K1M3
                  max_wait_ms: 4000
      responses:
        '200':
          description: Aggregated on_search results within max_wait_ms, with ranking explanation. Signed by the gateway with RFC 9421, covering
            @status and content-digest, under a key in the gateway profile's keys.
          headers:
            Content-Digest:
              required: true
              description: RFC 9530 digest of the response body, covered by the signature.
              schema:
                type: string
            Signature-Input:
              required: true
              description: RFC 9421 signature parameters, covering @status and content-digest.
              schema:
                type: string
            Signature:
              required: true
              description: RFC 9421 signature by a key in the gateway profile's keys.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResponse'
              examples:
                default:
                  value:
                    transaction_id: 6f1c2a8e-0c7b-4f7e-9d0e-1b2c3d4e5f60
                    results:
                    - bpp_id: bpp.kirana.example.in
                      provider:
                        id: P-112
                        name: Shree Ganesh Kirana
                        rating: 4.5
                      items:
                      - id: I-ATTA-2KG
                        name:
                          en-IN: Chakki Atta 2 kg
                          hi-IN: चक्की आटा 2 किलो
                        unit_price:
                          value: 11000
                          currency: INR
                        mrp:
                          value: 12000
                          currency: INR
                        tax_inclusive: true
                        sponsorship:
                          status: not_sponsored
                        hsn: '1101'
                        gst_rate_bps: 0
                        available_on_cod: true
                        returnable: true
                        return_window: P2D
                      within_mandate: true
                      source_digest: sha-256:lWfwvAF9PMhwrWdb1rhZL_wgvkFtkBv5FIsbptP6r8w
                    ranking:
                      main_parameters:
                      - distance
                      - price
                      - seller_rating
                      sponsored: false
                    complete: true
                    messages: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /discover/{transaction_id}/sources/{source_digest}:
    parameters:
    - name: transaction_id
      in: path
      required: true
      schema:
        type: string
    - name: source_digest
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SourceDigest'
    get:
      tags:
      - discovery
      operationId: getDiscoverSource
      summary: Fetch the BPP-signed on_search callback behind a discovery result
      description: 'Returns the on_search callback that a source_digest of a discover response names, exactly as the gateway received it, with its
        Beckn Authorization header. The agent checks the sha-256 of body against source_digest, the binding of the callback to its search, and
        the Beckn signature against a BPP key that it resolves from the registry itself, never from the gateway. Signed under tag `bacp-browse`;
        no Idempotency-Key. The gateway serves it only to the agent whose POST /discover produced the transaction_id: every other caller, and an
        unknown digest, gets 404 not_found. The gateway counts the rate limit per caller key before it looks up the transaction_id or the
        source_digest, so that a 429 never depends on whether the source exists. The gateway serves a source for as long as it must keep it.

        '
      security:
      - httpSignature: []
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: The callback as received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BecknSignedMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /sessions:
    post:
      tags:
      - session
      operationId: createSession
      summary: Create checkout session (UCP create_checkout, Beckn select)
      description: 'One session per seller. The sessions of a multi-seller basket share a gateway-local `basket_id`; every session with one
        `basket_id` MUST have the same principal, presence and root open Checkout Mandate, otherwise the gateway returns 400 invalid_request at
        `$.basket_id`. The `basket_id` never leaves the gateway: it is not sent in `context.bacp`, in Beckn tags or on the payment leg.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            examples:
              grocery:
                value:
                  transaction_id: 6f1c2a8e-0c7b-4f7e-9d0e-1b2c3d4e5f60
                  bpp_id: bpp.kirana.example.in
                  provider_id: P-112
                  items:
                  - id: I-ATTA-2KG
                    quantity: 1
                  - id: I-MILK-1L
                    quantity: 1
                  - id: I-TOOR-500G
                    quantity: 1
                  presence: HNP
                  mandate_ref: mdt_CHK7Q2W9X4K1M3
                  channel: voice
                  language: hi-IN
                  webhook_url: https://agents.vaani.example.in/bacp/hooks
      responses:
        '201':
          description: Session with authoritative quote (from on_select)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                quoted:
                  $ref: '#/components/examples/SessionQuoted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/BppNack'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/BppTimeout'
  /sessions/{session_id}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    get:
      tags:
      - session
      operationId: getSession
      summary: Get session (UCP get_checkout). Use for lost-response recovery before any retry.
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Authoritative full state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                ready:
                  $ref: '#/components/examples/SessionReady'
                stepUp:
                  $ref: '#/components/examples/SessionStepUp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - session
      operationId: updateSession
      summary: Update session, full replace (UCP update_checkout). Items trigger select, fulfilment/billing triggers init.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
            examples:
              addFulfilment:
                value:
                  items:
                  - id: I-ATTA-2KG
                    quantity: 1
                  - id: I-MILK-1L
                    quantity: 1
                  - id: I-TOOR-500G
                    quantity: 1
                  fulfilment:
                    type: Delivery
                    address_ref: addr_home
                    pincode: '560034'
                  data_share:
                    consent_receipt_ref: cr_A1B2C3D4E5F6G7
                    fields:
                    - NAME
                    - PHONE
                    - DELIVERY_ADDRESS
                  payment:
                    handler: upi.reservepay.block
      responses:
        '200':
          description: Updated full state (ready_for_complete after on_init, or requires_escalation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                ready:
                  $ref: '#/components/examples/SessionReady'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/BppNack'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/BppTimeout'
  /sessions/{session_id}/complete:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - session
      operationId: completeSession
      summary: Complete (UCP complete_checkout). Verifies closed mandates, debits the rail, sends Beckn confirm.
      description: 'HNP: body carries the agent-closed Checkout and Payment Mandates (KB-JWT under the open mandates'' cnf key).

        HP: body carries closed mandates signed on the Trusted Surface plus a per-transaction 2FA reference (auth_binding).

        Returns `completed` with order and payment receipt, `complete_in_progress` (payment in doubt or awaiting on_confirm),

        or `requires_escalation` with a step_up object. Retry ONLY with the same Idempotency-Key after GET /sessions/{id}.

        In a multi-seller basket (`basket_id`) no leg is debited until every leg has a payment planned and every Reserve Pay leg has passed the
        headroom check; a leg with no human-not-present handler raises one `rail_fallback` step-up before any debit. A `complete` after an
        approved summary step-up consumes the session''s `covers[]` entry once, inside the atomic section keyed on the shared root open Checkout
        Mandate; a used, changed or missing entry returns `requires_escalation`. A leg whose payment is `in_doubt` is never re-routed to another
        handler.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
            examples:
              hnpReservePay:
                value:
                  presence: HNP
                  checkout_mandate: eyJhbGciOiJFUzI1NiJ9.eyJ2Y3QiOiJpbi5iYWNwLm1hbmRhdGUuY2hlY2tvdXQuMSJ9.c2ln~WyJzYWx0IiwiY2hlY2tvdXRfaGFzaCJd~eyJhbGciOiJFUzI1NiJ9.eyJub25jZSI6Im4ifQ.c2ln
                  payment_mandate: eyJhbGciOiJFUzI1NiJ9.eyJ2Y3QiOiJpbi5iYWNwLm1hbmRhdGUucGF5bWVudC4xIn0.c2ln~eyJhbGciOiJFUzI1NiJ9.eyJub25jZSI6Im4ifQ.c2ln
                  checkout_hash: sha-256:vRBpqmLq4AipYw1ZNnIL3trdLVrcHQAQ0g5RurJB4CQ
                  accepted_disclosures_hash: sha-256:vq4x2opsK4KIM-scKiTGRWd4Fzxs-GBx7lO8Glgm_U4
      responses:
        '200':
          description: Completed, in progress, or requires escalation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                completed:
                  $ref: '#/components/examples/SessionCompleted'
                stepUp:
                  $ref: '#/components/examples/SessionStepUp'
                inDoubt:
                  $ref: '#/components/examples/SessionInDoubt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sessions/{session_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - session
      operationId: cancelSession
      summary: Cancel a session before an order exists (UCP cancel_checkout). No Beckn call is needed.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Cancelled session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sessions/{session_id}/handoff:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - session
      operationId: humanHandoff
      summary: Hand the session to a human (bacp.human_handoff). Requested by the agent; accepted only by a registered human support operator.
      description: 'The agent requests a handoff (tag `bacp-browse`, `action: request`) with one of the routes in `Session.ai_disclosure.handoff_routes`.
        The gateway MUST accept the request in every session state and whatever the mandate''s status, including after the mandate is revoked.
        An open session moves to status `human_handoff`, and the gateway then refuses `PUT` and `complete` from the agent with
        `409 session_state_conflict` at `$.status`. A session in any other state keeps its status and records `handoff`.

        A human support operator accepts (`action: accept`) with a request signed by a registry key whose role is support operator, under tag
        `bacp-handoff`. Only then does the gateway set `handoff.accepted_by` (that key''s id) and `handoff.accepted_at`. An acceptance signed by
        any other key, or under any other tag, leaves the handoff requested. While the session is in `human_handoff`, a `step_up.approved` event
        is held, not applied.

        `action: release` ends the handoff. The gateway accepts it from the `accepted_by` key under tag `bacp-handoff`, or from the agent under
        tag `bacp-browse` only while `accepted_by` is absent; a release from any other key leaves the session in `human_handoff`. A session in
        `human_handoff` returns to `incomplete`, and `handoff.ended_at` is set. A held approval then applies only if its step-up has not expired
        and its `checkout_hash` still equals the session''s. Every act is written to the InstructionLog at stage `handoff`.

        `accept` and `release` are each one compare-and-set on `handoff.accepted_by` and `handoff.ended_at`. An accept sets `accepted_by` only
        while both are absent; an agent''s release sets `ended_at` only while `accepted_by` is still absent, and otherwise changes nothing. An
        accept after `ended_at` is set gets 409 session_state_conflict at $.status and changes nothing. A race between an agent release and an
        accept therefore ends either released with no `accepted_by`, or connected in human_handoff, never both.

        A request under tag `bacp-handoff` is signed with the support operator''s registry key and carries no `BACP-Agent` header.

        '
      security:
      - httpSignature: []
        agentCredential: []
      - httpSignature: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
            examples:
              ivrRoute:
                value:
                  action: request
                  route:
                    channel: ivr
                    uri: tel:+91-80-00000001
                    dtmf: '0'
                    languages:
                    - hi-IN
                    - en-IN
                    hours: Mo-Su 08:00-20:00
              accept:
                value:
                  action: accept
              release:
                value:
                  action: release
      responses:
        '200':
          description: Handoff accepted by a human support operator, or released (a session in human_handoff returns to incomplete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '201':
          description: Handoff requested; the session is in human_handoff (or keeps its closed status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InFlight'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /mandates:
    post:
      tags:
      - mandate
      operationId: requestMandate
      summary: Request a mandate. Returns PENDING plus a Trusted Surface link. The agent never signs or activates it.
      description: 'With `checkout_mandate_ref` the request asks for a sibling open Payment Mandate under an existing ACTIVE root open Checkout
        Mandate of the same principal (for example a Reserve Pay block for one more seller); the Mandate Manager builds only the Payment Mandate,
        whose constraints narrow the root''s. A Reserve Pay request MUST carry `payee{vpa, bpp_id}` (403 mandate_scope_mismatch at `$.payee`)
        and `rail_limits.block_amount` (403 mandate_scope_mismatch at `$.rail_limits.block_amount`). The gateway MUST hold the seller''s
        BPP-signed payment terms for `payee.bpp_id` (the raw on_init body and its Beckn Authorization header), obtaining them first by a Beckn
        init that it never follows with confirm, or refuse the request with 400 rail_binding_not_open_eligible; `payee.vpa` MUST equal the VPA
        in those terms, and a block payable to the buyer app is refused for human-not-present use (400 rail_binding_not_open_eligible). The
        block amounts under one root, the requested one included, MUST NOT sum to more than the root''s smallest `budgets[].max` (403
        mandate_scope_mismatch at `$.checkout_mandate_ref`), and the requested block at its full amount MUST fit the root''s remaining headroom
        in every budget window (403 mandate_exhausted at `$.checkout_mandate_ref`). Both rules, and the handler''s per-block limit in the
        registry (403 mandate_scope_mismatch at `$.rail_limits.block_amount`), apply to every Reserve Pay request; a request without
        `checkout_mandate_ref` is measured against its own `proposed_constraints.budgets` and the unconfirmed blocks that count against a
        new root of the principal, with both errors at `$.rail_limits.block_amount`. These checks run before anything reaches the rail. A new
        root open Checkout Mandate for a principal who already holds an ACTIVE root at the same Mandate Manager is refused (403
