                      - class
                      - all_in_total
                      properties:
                        handler_id:
                          type: string
                        class:
                          enum:
                          - O
                          - C
                          - A
                          - D
                        all_in_total:
                          $ref: '#/components/schemas/Amount'
                        method_fee:
                          $ref: '#/components/schemas/Amount'
                        afa_expected:
                          type: boolean
                        rank_reason:
                          enum:
                          - user_preference
                          - lowest_total
                          - lowest_friction
                  excluded:
                    type: array
                    items:
                      type: object
                      required:
                      - handler_id
                      - reason
                      properties:
                        handler_id:
                          type: string
                        reason:
                          enum:
                          - not_in_registry
                          - not_offered_by_bap
                          - not_accepted_by_seller
                          - not_in_term_sheet
                          - not_in_mandate
                          - presence_handler_mismatch
                          - above_limit
                          - instrument_unavailable
                          - card_not_enabled_for_cnp
                          - cod_not_allowed
                          - reservepay_block_wrong_payee
                          - pilot_not_attested
                          - cod_open_orders_cap
                          - credit_funding_not_allowed
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  comparison:
                    type: array
                    description: Every option and its all-in total (selection log)
                    items:
                      type: object
                      properties:
                        handler_id:
                          type: string
                        all_in_total:
                          $ref: '#/components/schemas/Amount'
                        option_id:
                          type: string
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
webhooks:
  mandate.status_changed:
    post:
      summary: Mandate status changed (ACTIVE, PAUSED, REVOKED, EXPIRED, EXHAUSTED). Delivered within 60 s of the Trusted Surface event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            examples:
              revoked:
                value:
                  event_id: evt_01HZXR
                  type: mandate.status_changed
                  created_at: '2026-10-25T08:00:03+05:30'
                  data:
                    mandate_id: mdt_PAY7Q2W9X4K1M3
                    status: REVOKED
                    reason: user_revoked_on_trusted_surface
                    affected_sessions:
                    - ses_01HZXD
      responses:
        '200':
          description: Acknowledged
  session.updated:
    post:
      summary: Full session snapshot, e.g. step-up required or approved, payment resolved after in-doubt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  payment.receipt:
    post:
      summary: Rail-anchored payment or refund receipt (RRN/UTR)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            examples:
              paid:
                value:
                  event_id: evt_01HZXP
                  type: payment.receipt
                  created_at: '2026-10-20T19:02:12+05:30'
                  data:
                    receipt:
                      receipt_id: rcpt_PAY0000000001
                      receipt_type: payment
                      result: success
                      rrn: '629318004417'
                      amount:
                        value: 30200
                        currency: INR
      responses:
        '200':
          description: Acknowledged
  order.updated:
    post:
      summary: Full order snapshot from unsolicited on_status, on_cancel or on_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  return.updated:
    post:
      summary: Return or refund state change
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  issue.updated:
    post:
      summary: IGM on_issue respondent action (PROCESSING, INFO_REQUESTED, RESOLUTION_PROPOSED, CASCADED, RESOLVED)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
  pre_debit.notice:
    post:
      summary: Issuer pre-debit notice (upi.autopay, at least 24 h ahead, RBI E-mandate Framework 2026). The agent MUST relay it to the user and
        MUST NOT dismiss it.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Acknowledged
components:
  securitySchemes:
    httpSignature:
      type: apiKey
      in: header
      name: Signature
      description: 'RFC 9421 HTTP Message Signature with RFC 9530 Content-Digest. Covered components MUST include @method, @authority,

        @path, @query (if present), content-digest, content-type, idempotency-key and bacp-agent-credential (when present).

        Parameters MUST include created, expires (expires - created <= 300 s), nonce, keyid and tag

        (bacp-browse, bacp-pay, bacp-post-order or bacp-ts). Keys: AgentCredential.cnf.jwk (agents) or the registry

        record (MM, PSP, BAP). ES256 mandatory, Ed25519 optional.

        '
    agentCredential:
      type: apiKey
      in: header
      name: BACP-Agent-Credential
      description: SD-JWT VC (vct in.bacp.agent.1) with only the disclosures the gateway needs. Checked against the registry status list.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 128-bit or more random value (UUIDv4 or ULID). Required on every POST and PUT.
      schema:
        type: string
        minLength: 22
        maxLength: 64
      example: 01HZX8W3T6Q9M2R7C4B1N8K5D0
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      schema:
        type: string
      example: sig1=("@method" "@authority" "@path" "content-digest" "content-type" "idempotency-key" "bacp-agent-credential");created=1792501322;expires=1792501622;nonce="q8Fz1V2w";keyid="sakhi-2026-10";alg="ecdsa-p256-sha256";tag="bacp-pay"
    Signature:
      name: Signature
      in: header
      required: true
      schema:
        type: string
      example: 'sig1=:MEUCIQDexampleSignatureBase64Value=:'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^ses_[A-Za-z0-9]{8,40}$
    MandateId:
      name: mandate_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^mdt_[A-Za-z0-9]{12,40}$
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    NegotiationId:
      name: negotiation_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^neg_[A-Za-z0-9]{8,40}$
    RfqId:
      name: rfq_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^rfq_[A-Za-z0-9]{8,40}$
    AuctionId:
      name: auction_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^auc_[A-Za-z0-9]{8,40}$
  responses:
    BadRequest:
      description: Invalid request or missing Idempotency-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingKey:
              value:
                type: invalid_request
                code: idempotency_key_required
                message: Idempotency-Key header is required
                param: $.headers.Idempotency-Key
    Unauthorized:
      description: Signature, credential or replay failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            replay:
              value:
                type: authentication_error
                code: replay_detected
                message: Signature nonce already seen within window
            unregistered:
              value:
                type: authentication_error
                code: agent_unregistered
                message: Agent credential not found or revoked in registry
    Forbidden:
      description: Caller is not allowed to use this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            agentOnTsEndpoint:
              value:
                type: authorization_error
                code: trusted_surface_only
                message: Only a registered Mandate Manager or payer PSP may call this endpoint
    MandateRejected:
      description: Deterministic mandate verification failed (fail closed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            revoked:
              value:
                type: mandate_error
                code: mandate_revoked
                message: Mandate mdt_PAY7Q2W9X4K1M3 is REVOKED
                param: $.mandate_ref
            outOfScope:
              value:
                type: mandate_error
                code: mandate_scope_mismatch
                message: Category ONDC:RET12 not in categories_allow
                param: $.items[0]
            railCap:
              value:
                type: mandate_error
                code: rail_limit_exceeded
                message: Amount exceeds Reserve Pay block remaining balance
                param: $.totals
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InFlight:
      description: Same Idempotency-Key is still being processed
      headers:
        Retry-After:
          schema:
            type: integer
          example: 2
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            inFlight:
              value:
                type: invalid_request
                code: idempotency_in_flight
                message: Request with this key is in progress
    IdempotencyConflict:
      description: Same Idempotency-Key with a different body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                type: invalid_request
                code: idempotency_conflict
                message: Idempotency-Key reused with a different request body
    BppTimeout:
      description: No on_* callback within the facade wait window. Session remains retrievable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            timeout:
              value:
                type: upstream_error
                code: bpp_timeout
                message: on_select not received within 5000 ms
    StaleOffer:
      description: The message cites an offer that is not LIVE. GET the negotiation and respond to the live offer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stale:
              value:
                type: invalid_request
                code: NEG_STALE_OFFER
                message: in_reply_to is not the live offer
                param: $.in_reply_to
    BppNack:
      description: The seller NACKed the Beckn request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTooLarge:
      description: Request body above the gateway limit; refused before signature verification (request_too_large).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: Per-agent idempotency-key quota exhausted (quota_exceeded).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Amount:
      type: object
      description: Integer minor units (paise) per ISO 4217, as in UCP, ACP and AP2.
      required:
      - value
      - currency
      properties:
        value:
          type: integer
          minimum: 0
        currency:
          const: INR
      additionalProperties: false
    Hash:
      type: string
      description: Multihash-style 'alg:base64url'. sha-256 is mandatory, blake2b-512 allowed for Beckn digests.
      pattern: ^(sha-256|blake2b-512):[A-Za-z0-9_-]{43,88}$
    Jws:
      type: string
      description: Compact JWS or SD-JWT (with ~ separators). Payload canonicalised with JCS (RFC 8785).
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+(~[A-Za-z0-9_.~-]*)?$
    Jwk:
      type: object
      required:
      - kty
      properties:
        kty:
          enum:
          - EC
          - OKP
        crv:
          enum:
          - P-256
          - Ed25519
        x:
          type: string
        y:
          type: string
        kid:
          type: string
    Signature:
      type: object
      required:
      - kid
      - alg
      - value
      properties:
        role:
          enum:
          - principal
          - mandate_manager
          - psp
          - agent
          - agent_provider
          - bap
          - bpp
          - registry
          - operator
        kid:
          type: string
          description: Registry-resolvable key id, e.g. 'bap.example.in|ukid-7|ed25519' or a did:web#fragment
        alg:
          enum:
          - ES256
          - EdDSA
        value:
          $ref: '#/components/schemas/Jws'
      additionalProperties: false
    Presence:
      enum:
      - HP
      - HNP
      description: Human present / human not present (AP2 section 4.2).
    LangText:
      type: object
      description: 'Multilingual map keyed by BCP 47 tag, e.g. {"hi-IN": "...", "en-IN": "..."}.'
      propertyNames:
        pattern: ^[a-z]{2,3}(-[A-Za-z]{4})?(-[A-Z]{2})?$
      additionalProperties:
        type: string
      minProperties: 1
    RailType:
      type: string
      pattern: ^(upi\.circle\.delegate|upi\.reservepay\.block|upi\.autopay|upi\.uap\.[a-z0-9_.]+)$
    Channel:
      enum:
      - app
      - voice
      - ivr
      - upi123pay
      - whatsapp
      - web
      - assisted
    Handler:
      enum:
      - upi.circle.delegate
      - upi.reservepay.block
      - upi.autopay
      - upi.lite
      - upi.123pay
      - rupay.token
      - erupi
      - erupee
      - bbps
      - cod
      description: Legacy BACP payment handler ids. upi.uap.* is reserved and validated by RailType.
    AgentCredential:
      title: AgentCredential
      description: Claims of an SD-JWT VC (vct in.bacp.agent.1) issued by a registry-accredited issuer to an agent operated by a registered legal
        entity and bound to a BAP subscriber.
      type: object
      required:
      - vct
      - iss
      - sub
      - iat
      - exp
      - operator
      - bap
      - agent
      - cnf
      - purposes
      - disclosure
      - status
      properties:
        vct:
          const: in.bacp.agent.1
        iss:
          type: string
          format: uri
          description: 'Issuer: ONDC registry / DeDi record or accredited issuer'
        sub:
          type: string
          description: Agent id, e.g. did:web:agents.example.in:krishi-voice or urn:bacp:agent:...
        iat:
          type: integer
        exp:
          type: integer
          description: <= iat + 180 days (key rotation)
        operator:
          type: object
          required:
          - legal_name
          - entity_id
          - grievance_officer
          properties:
            legal_name:
              type: string
            entity_id:
              type: object
              required:
              - type
              - value
              properties:
                type:
                  enum:
                  - CIN
                  - LLPIN
                  - GSTIN
                  - PAN
                value:
                  type: string
            grievance_officer:
              type: object
              required:
              - name
              - email
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
            incident_contact:
              type: string
              format: email
            ai_inventory_ref:
              type: string
              format: uri
              description: FREE-AI Rec 23 inventory entry
        bap:
          type: object
          required:
          - subscriber_id
          - ukid
          properties:
            subscriber_id:
              type: string
              description: ONDC/Beckn bap_id (FQDN)
            ukid:
              type: string
        agent:
          type: object
          required:
          - class
          - model_family
          - build
          properties:
            class:
              enum:
              - shopping
              - voice_shopping
              - assisted
              - sub_agent
            model_family:
              type: string
            build:
              type: string
              description: Release or build hash of the agent runtime
            channels:
              type: array
              items:
                $ref: '#/components/schemas/Channel'
            languages:
              type: array
              items:
                type: string
            uap_agent_id:
              type:
              - string
              - 'null'
              description: Reserved for an NPCI UAP registry id once published
        cnf:
          type: object
          required:
          - jwk
          properties:
            jwk:
              $ref: '#/components/schemas/Jwk'
          description: RFC 7800 key binding. The same key signs RFC 9421 requests and KB-JWTs that close open mandates.
        purposes:
          type: array
          minItems: 1
          items:
            enum:
            - bacp-browse
            - bacp-pay
            - bacp-post-order
            - bacp-negotiate
          description: RFC 9421 signature tags this key may use (Visa TAP-style browse/pay split).
        disclosure:
          type: object
          required:
          - ai_notice
          - human_handoff_url
          properties:
            ai_notice:
              $ref: '#/components/schemas/LangText'
            human_handoff_url:
              type: string
              format: uri
        conformance:
          type: object
          properties:
            level:
              enum:
              - v0-core
              - v0-full
            attestation:
              $ref: '#/components/schemas/Jws'
        status:
          type: object
          required:
          - status_list
          properties:
            status_list:
              type: object
              required:
              - uri
              - idx
              properties:
                uri:
                  type: string
                  format: uri
                idx:
                  type: integer
                  minimum: 0
    Mandate:
      title: Mandate
      description: AP2 v0.2-compatible Checkout or Payment mandate, open or closed, with AA consent-artefact semantics. Everything except status,
        usage and signatures is signed and immutable.
      type: object
      required:
      - vct
      - mandate_id
      - kind
      - form
      - iss
      - iat
      - valid_from
      - valid_until
      - principal
      - agent
      - purpose
      - action_scope
      - presence_allowed
      - constraints
      - revocation
      - signatures
      properties:
        vct:
          enum:
          - in.bacp.mandate.checkout.open.1
          - in.bacp.mandate.checkout.1
          - in.bacp.mandate.payment.open.1
          - in.bacp.mandate.payment.1
        ap2_vct:
          enum:
          - mandate.checkout.open.1
          - mandate.checkout.1
          - mandate.payment.open.1
          - mandate.payment.1
          description: AP2 v0.2 type this mandate is wire-compatible with
        mandate_id:
          type: string
          pattern: ^mdt_[A-Za-z0-9]{12,40}$
        parent_mandate_id:
          type:
          - string
          - 'null'
          description: Open mandate this one narrows (closed mandate or sub-agent delegation). Scope and expiry may only narrow.
        checkout_mandate_ref:
          type: string
          description: 'Payment mandates only: the checkout mandate this payment authority is bound to (AP2 payment.reference, REQUIRED)'
        kind:
          enum:
          - checkout
          - payment
        form:
          enum:
          - open
          - closed
        iss:
          type: string
          description: Mandate Manager / Trusted Surface subscriber id
        iat:
          type: integer
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        principal:
          type: object
          required:
          - ref
          properties:
            ref:
              type: string
              description: Pairwise pseudonymous user id at the Mandate Manager. Never an Aadhaar number.
            assurance:
              enum:
              - vpa_pin
              - aadhaar_vc
              - digilocker
              - passkey
        agent:
          type: object
          required:
          - id
          - credential_hash
          properties:
            id:
              type: string
            credential_hash:
              $ref: '#/components/schemas/Hash'
        purpose:
          type: object
          required:
          - code
          - text
          properties:
            code:
              type: string
              pattern: ^P-[A-Z]{3}-[0-9]{2}$
              description: BACP purpose-code registry (Sahamati Fair Use analogue), e.g. P-GRO-01 grocery replenishment
            text:
              $ref: '#/components/schemas/LangText'
        action_scope:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - DISCOVER
            - QUOTE
            - ORDER
            - PAY
            - CANCEL
            - RETURN
            - RAISE_ISSUE
            - SHARE_DATA
        data_scopes:
          type: array
          uniqueItems: true
          items:
            enum:
            - NAME
            - PHONE
            - DELIVERY_ADDRESS
            - EMAIL
            - AGE_OVER_18
            - GSTIN
        presence_allowed:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Presence'
        constraints:
          type: object
          description: 'Evaluated fail-closed by deterministic code: unknown keys fail (AP2 agent_authorization 463-465).'
          properties:
            amount_per_txn:
              $ref: '#/components/schemas/Amount'
            budgets:
              type: array
              items:
                type: object
                required:
                - period
                - max
                properties:
                  period:
                    enum:
                    - P1D
                    - P7D
                    - P1M
                    - FIRST_24H
                    - LIFETIME
                  max:
                    $ref: '#/components/schemas/Amount'
                additionalProperties: false
            max_executions:
              type: integer
              minimum: 1
            categories_allow:
              type: array
              items:
                type: string
              description: ONDC domain or category codes, e.g. ONDC:RET10, RET10-Staples
            categories_deny:
              type: array
              items:
                type: string
            merchants_allow:
              type: array
              items:
                type: object
                required:
                - bpp_id
                properties:
                  bpp_id:
                    type: string
                  provider_id:
                    type: string
            delivery_pincodes:
              type: array
              items:
                type: string
                pattern: ^[1-9][0-9]{5}$
            line_items:
              type: array
              items:
                type: object
                required:
                - item_id
                - qty_max
                properties:
                  item_id:
                    type: string
                  qty_max:
                    type: integer
                    minimum: 1
            step_up:
              type: object
              properties:
                above_amount:
                  $ref: '#/components/schemas/Amount'
                new_merchant:
                  type: boolean
                outside_categories:
                  type: boolean
                first_order:
                  type: boolean
            reject_preticked_addons:
              const: true
            cod_allowed:
              type: boolean
            cod_max_open_orders:
              type: integer
              minimum: 0
              description: Open COD orders an agent may hold HNP.
            credit_funding_allowed:
              type: boolean
              description: Credit-funded handlers allowed.
          additionalProperties: false
        checkout_hash:
          $ref: '#/components/schemas/Hash'
          description: 'Closed mandates only: hash of the BPP-signed quote / checkout (AP2 checkout_hash)'
        amount:
          $ref: '#/components/schemas/Amount'
          description: 'Closed mandates only: exact amount'
        payee:
          type: object
          properties:
            vpa:
              type: string
            bap_id:
              type: string
        rail_binding:
          type: object
          required:
          - type
          - rail_ref
          - psp_id
          - attestation
          properties:
            type:
              anyOf:
              - $ref: '#/components/schemas/RailType'
              - $ref: ../schemas/common.json#/$defs/RailTypeV1
            rail_ref:
              type: string
              description: UMN / SBMD block id / Circle delegation id as issued by the payer PSP
            psp_id:
              type: string
            attestation:
              $ref: '#/components/schemas/Jws'
              description: PSP-signed statement {rail_ref, type, limits, expiry, payee} hashed into this mandate
            rail_limits:
              type: object
              properties:
                per_txn:
                  $ref: '#/components/schemas/Amount'
                per_month:
                  $ref: '#/components/schemas/Amount'
                first_24h:
                  $ref: '#/components/schemas/Amount'
                block_amount:
                  $ref: '#/components/schemas/Amount'
                expires_at:
                  type: string
                  format: date-time
            pre_debit_notice:
              enum:
              - required_24h
              - not_applicable
              - unknown
              - bacp_policy_24h
              - post_debit_notice
          description: 'OPEN payment mandates only: binding to a live standing-authority primitive enforced by the rail. upi.uap.* reserved.'
        auth_binding:
          type: object
          required:
          - type
          description: 'CLOSED payment mandates only: how this single payment is authorised. Either it executes under the parent open mandate''s
            rail_binding (HNP), or it carries a per-transaction user 2FA reference (HP) or another closed-class instrument.'
          properties:
            type:
              enum:
              - parent_rail_binding
              - upi.pin
              - upi.biometric
              - card.3ds
              - instrument
            handler:
              anyOf:
              - $ref: '#/components/schemas/Handler'
              - $ref: '#/components/schemas/RailType'
            ref:
              type: string
              description: 2FA/authentication reference from the PSP or issuer, or the parent rail_ref
            psp_id:
              type: string
        dpdp:
          type: object
          properties:
            consent_receipts:
              type: array
              items:
                type: string
            data_retention:
              type: string
              description: ISO 8601 duration imposed on recipients, e.g. P1Y
        revocation:
          type: object
          required:
          - status_uri
          properties:
            status_uri:
              type: string
              format: uri
            status_list:
              type: object
              properties:
                uri:
                  type: string
                  format: uri
                idx:
                  type: integer
            notify_sla_seconds:
              type: integer
              maximum: 60
        audit_uri:
          type: string
          format: uri
        cnf:
          type: object
          required:
          - jwk
          properties:
            jwk:
              $ref: '#/components/schemas/Jwk'
          description: Agent key allowed to close this open mandate (AP2 section 4.1)
        signatures:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Signature'
        status:
          readOnly: true
          enum:
          - PENDING
          - ACTIVE
          - PAUSED
          - REVOKED
          - EXPIRED
          - EXHAUSTED
          - REJECTED
        usage:
          readOnly: true
          type: object
          properties:
            count:
              type: integer
            spent:
              type: array
              items:
                type: object
                properties:
                  period:
                    type: string
                  amount:
                    $ref: '#/components/schemas/Amount'
                  window_start:
                    type: string
                    format: date-time
            last_used_at:
              type: string
              format: date-time
      allOf:
      - if:
          properties:
            form:
              const: open
        then:
          required:
          - cnf
      - if:
          properties:
            form:
              const: closed
        then:
          required:
          - checkout_hash
          - amount
          - parent_mandate_id
      - if:
          properties:
            kind:
              const: payment
          required:
          - kind
        then:
          required:
          - checkout_mandate_ref
      - if:
          properties:
            kind:
              const: payment
            form:
              const: open
          required:
          - kind
          - form
        then:
          required:
          - rail_binding
      - if:
          properties:
            kind:
              const: payment
            form:
              const: closed
          required:
          - kind
          - form
        then:
          required:
          - auth_binding
          not:
            required:
            - rail_binding
      - description: An open mandate carries data scopes, an audit URI, a retention period and at least one frequency bound.
        if:
          properties:
            form:
              const: open
          required:
          - form
        then:
          required:
          - data_scopes
          - audit_uri
          - dpdp
          properties:
            dpdp:
              required:
              - data_retention
            constraints:
              anyOf:
              - required:
                - budgets
              - required:
                - max_executions
    ConsentReceipt:
      title: ConsentReceipt (DPDP)
      description: One receipt per recipient Data Fiduciary (merchant/BPP) per mandate. Issued by the data-blind Mandate Manager acting as (or
        for) a DPDP Consent Manager.
      type: object
      required:
      - receipt_id
      - iss
      - issued_at
      - principal_ref
      - mandate_ref
      - recipient
      - data_items
      - purpose
      - legal_basis
      - notice
      - captured_via
      - withdrawal
      - grievance
      - retention
      - signature
      properties:
        receipt_id:
          type: string
          pattern: ^cr_[A-Za-z0-9]{12,40}$
        iss:
          type: string
        cm_registration_no:
          type:
          - string
          - 'null'
          description: DPDP Board registration of the Consent Manager (DPDP Rules 2025, Rule 4, from ~13 Nov 2026)
        issued_at:
          type: string
          format: date-time
        principal_ref:
          type: string
        mandate_ref:
          type: string
        recipient:
          type: object
          required:
          - fiduciary_name
          - bpp_id
          properties:
            fiduciary_name:
              type: string
            bpp_id:
              type: string
            provider_id:
              type: string
            dpo_contact:
              type: string
        data_items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - field
            - form
            properties:
              field:
                enum:
                - NAME
                - PHONE
                - DELIVERY_ADDRESS
                - EMAIL
                - AGE_OVER_18
                - GSTIN
              form:
                enum:
                - plain
                - masked
                - selective_disclosure_vc
                - token
        purpose:
          type: object
          required:
          - code
          - text
          properties:
            code:
              type: string
            text:
              $ref: '#/components/schemas/LangText'
            goods_or_services:
              type: string
        legal_basis:
          enum:
          - consent_s6
          - legitimate_use_s7a
        notice:
          type: object
          required:
          - language
          - hash
          properties:
            language:
              type: string
              description: English or an Eighth Schedule language (BCP 47)
            hash:
              $ref: '#/components/schemas/Hash'
            uri:
              type: string
              format: uri
            translation_model:
              type: string
        captured_via:
          type: object
          required:
          - surface
          - user_action
          - device_signature
          properties:
            surface:
              type: string
              description: Trusted Surface id (PSP app or Mandate Manager app), never the agent
            user_action:
              enum:
              - tap_confirm
              - upi_pin
              - biometric
              - passkey
              - voice_confirm_plus_device
            device_signature:
              $ref: '#/components/schemas/Jws'
            voice_evidence:
              type: object
              properties:
                audio_hash:
                  $ref: '#/components/schemas/Hash'
                transcript_hash:
                  $ref: '#/components/schemas/Hash'
                translation_model:
                  type: string
        withdrawal:
          type: object
          required:
          - uri
          properties:
            uri:
              type: string
              format: uri
            erasure_signal:
              const: true
        grievance:
          type: object
          required:
          - contact
          properties:
            contact:
              type: string
            board_complaint_uri:
              type: string
              format: uri
        retention:
          type: object
          required:
          - recipient_max
          properties:
            recipient_max:
              type: string
              description: ISO 8601 duration
            legal_minimum:
              type: string
              default: P1Y
              description: DPDP Rule 8(3)
        status:
          readOnly: true
          enum:
          - ACTIVE
          - WITHDRAWN
          - EXPIRED
        signature:
          $ref: '#/components/schemas/Signature'
    Receipt:
      title: Receipt (rail-anchored)
      description: Signed by the verifier that acted (AP2 Mandate/Checkout/Payment Receipt). Payment and refund receipts MUST carry the UPI RRN
        and UTR.
      type: object
      required:
      - receipt_id
      - receipt_type
      - iss
      - issued_at
      - result
      - reference
      - mandate_ref
      - transaction_id
      - signature
      properties:
        receipt_id:
          type: string
          pattern: ^rcpt_[A-Za-z0-9]{12,40}$
        receipt_type:
          enum:
          - mandate
          - checkout
          - payment
          - refund
        iss:
          type: string
          description: 'Verifier: Mandate Manager, BPP, payer PSP'
        issued_at:
          type: string
          format: date-time
        result:
          enum:
          - success
          - failure
          - in_doubt
        error:
          type: string
        reference:
          $ref: '#/components/schemas/Hash'
          description: Hash of the presented (closed) mandate, AP2 Receipt.reference
        mandate_ref:
          type: string
        open_mandate_ref:
          type: string
        transaction_id:
          type: string
          description: Beckn context.transaction_id, end to end
        order_id:
          type: string
        checkout_hash:
          $ref: '#/components/schemas/Hash'
        amount:
          $ref: '#/components/schemas/Amount'
        payee:
          type: object
          properties:
            vpa:
              type: string
            name:
              type: string
        rail:
          type: object
          required:
          - type
          - rail_ref
          - status
          properties:
            type:
              anyOf:
              - $ref: '#/components/schemas/RailType'
              - $ref: ../schemas/common.json#/$defs/HandlerRef
            rail_ref:
              type: string
            rrn:
              type: string
              pattern: ^[0-9]{12}$
            utr:
              type: string
            npci_txn_id:
              type: string
            psp_confirmation_id:
              type: string
            status:
              enum:
              - SUCCESS
              - FAILURE
              - PENDING
              - DEEMED
              - REVERSED
            original_rrn:
              type: string
              description: 'Refund receipts: RRN of the debit being refunded'
            evidence:
              type: object
              additionalProperties:
                type: string
              description: Settlement evidence for non-UPI handlers
          allOf:
          - description: 'UPI-family rails: RRN is mandatory; UTR is mandatory unless the handler descriptor''s settlement.evidence_refs lists
              RRN only (generated from handlers/registry.json).'
            if:
              properties:
                type:
                  pattern: ^(upi\.|in\.upi\.|in\.cod\.upi$|in\.pos\.(tap|dynamic_qr)$)
              required:
              - type
            then:
              required:
              - rrn
              if:
                properties:
                  type:
                    pattern: ^(in\.upi\.intl|in\.upi\.lite|in\.upi\.uap|in\.upi\.uap\..+|upi\.lite|upi\.uap\.(?!pin$).+)$
                required:
                - type
              else:
                required:
                - utr
            else:
              anyOf:
              - required:
                - rrn
              - required:
                - utr
              - required:
                - evidence
        signature:
          $ref: '#/components/schemas/Signature'
        refund_state:
          enum:
          - pending_cardholder_consent
          - reversed_to_bank_account
          - released_block
          - credit_note_issued
          - refunded_to_source
          - adjusted_against_dues
          description: Refund lifecycle state, including credit-card refund consent and adjustment against B2B dues.
        fx:
          $ref: ../schemas/fx.json
      allOf:
      - if:
          properties:
            receipt_type:
              enum:
              - payment
              - refund
            result:
              const: success
          required:
          - receipt_type
          - result
        then:
          required:
          - rail
          - amount
          - checkout_hash
    InstructionLogEntry:
      title: InstructionLogEntry
      description: Append-only, hash-chained evidence of prompt -> intent -> cart -> mandate -> payment (UAP section 5 item 3). entry_hash = sha-256(JCS(entry
        minus entry_hash and signature)). Raw content is stored by the operator; only hashes leave it unless an evidence bundle is requested.
      type: object
      required:
      - seq
      - session_id
      - transaction_id
      - stage
      - actor
      - at
      - content_hash
      - prev_hash
      - entry_hash
      - signature
      properties:
        seq:
          type: integer
          minimum: 0
        session_id:
          type: string
        transaction_id:
          type: string
        stage:
          enum:
          - prompt
          - intent
          - discover
          - cart
          - disclosure
          - mandate
          - step_up
          - payment
          - order
          - post_order
          - grievance
          - negotiation
          - guard
          - ledger
        actor:
          enum:
          - user
          - agent
          - gateway
          - trusted_surface
          - bpp
          - psp
        at:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/Channel'
        language:
          type: string
        content_hash:
          $ref: '#/components/schemas/Hash'
        content_ref:
          type: string
          format: uri
          description: Operator-held encrypted blob (transcript, audio, structured intent)
        summary:
          $ref: '#/components/schemas/LangText'
        model:
          type: object
          properties:
            id:
              type: string
            version:
              type: string
            translation_model:
              type: string
        refs:
          type: object
          properties:
            mandate_ref:
              type: string
            checkout_hash:
              $ref: '#/components/schemas/Hash'
            message_id:
              type: string
            order_id:
              type: string
            rrn:
              type: string
            receipt_id:
              type: string
            issue_id:
              type: string
        prev_hash:
          $ref: '#/components/schemas/Hash'
          description: entry_hash of seq-1; genesis uses sha-256 of session_id
        entry_hash:
          $ref: '#/components/schemas/Hash'
        signature:
          $ref: '#/components/schemas/Signature'
    BecknContextBacp:
      title: 'Beckn context extension: context.bacp'
      description: Added to Beckn/ONDC context on every BACP-originated message. Non-BACP NPs ignore it. Mirrored in message.order.tags[descriptor.code=bacp]
        where a network validator rejects unknown context keys (assumption).
      type: object
      required:
      - agent
      - presence
      - idempotency_key
      properties:
        agent:
          type: object
          required:
          - id
          - credential_hash
          - operator
          properties:
            id:
              type: string
            credential_hash:
              $ref: '#/components/schemas/Hash'
            operator:
              type: string
              description: Operator legal entity id (CIN/GSTIN)
            class:
              type: string
            uap_agent_id:
              type:
              - string
              - 'null'
        presence:
          $ref: '#/components/schemas/Presence'
        mandate_ref:
          type: object
          required:
          - id
          - hash
          properties:
            id:
              type: string
            hash:
              $ref: '#/components/schemas/Hash'
            kb_jwt:
              $ref: '#/components/schemas/Jws'
              description: Agent key-binding JWT (aud = bpp_id, nonce = message_id) closing the open mandate
          description: REQUIRED on init, confirm, update, cancel and IGM issue. Optional on search/select.
        idempotency_key:
          type: string
          minLength: 22
          maxLength: 64
        channel:
          $ref: '#/components/schemas/Channel'
        language:
          type: string
        ai_disclosure:
          const: true
        log_head:
          $ref: '#/components/schemas/Hash'
          description: Current InstructionLog head at send time
        version:
          const: '0.1'
      additionalProperties: false
    Error:
      type: object
