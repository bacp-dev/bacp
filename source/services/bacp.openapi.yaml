          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - negotiation
      operationId: sendNegotiationMessage
      summary: Send offer, counter_offer, reject, withdraw, terminate, request_extension or accept_revoke
      description: "The agent submits an unsigned draft. The gateway runs guard N-1..N-11 and validators V-01..V-14, signs with the\nBAP registry\
        \ key and the agent key, and sends Beckn select (buyer) carrying a bacp.neg TagGroup.\n- A firm counter outside the negotiation mandate\
        \ is never sent. The response is 200 with `requires_escalation`, or the agent may resend with subject_to_principal_approval true (forces\
        \ firm false).\n- A counter that cites a non-live offer returns 409 NEG_STALE_OFFER. A counter on an expired offer returns 200\n  message\
        \ NEG_OFFER_EXPIRED (a fresh `offer` is allowed while rounds and deadline remain).\n- A withdraw is effective on receipt. The crossing\
        \ rule (earlier CounterSignature timestamp wins) is applied by\n  the gateway and reflected in offers[].state.\n"
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiationMessageDraft'
            examples:
              counter:
                value:
                  type: counter_offer
                  in_reply_to: sha-256:Wc6l4R0gH0b0dXzcrZmLtJ3x3yQ6m5PZb1oS2kA9VQo
                  firm: true
                  expires_in: PT30M
                  term_sheet_patch:
                  - op: replace
                    path: /lines/0/unit_price/value
                    value:
                      value: 180000
                      currency: INR
                  - op: replace
                    path: /lines/0/unit_price/status
                    value: Assert
              withdraw:
                value:
                  type: withdraw
                  offer_hash: sha-256:Wc6l4R0gH0b0dXzcrZmLtJ3x3yQ6m5PZb1oS2kA9VQo
                  reason: offeror_choice
      responses:
        '200':
          description: Message sent, or escalation required, or business message (full state)
          content:
            application/json:
              schema:
                $ref: ../schemas/negotiation-session.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MandateRejected'
        '409':
          $ref: '#/components/responses/StaleOffer'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /negotiations/{negotiation_id}/accept:
    parameters:
    - $ref: '#/components/parameters/NegotiationId'
    post:
      tags:
      - negotiation
      operationId: acceptOffer
      summary: Absolute, unqualified ACCEPT of the live offer (bacp.neg.accept, sent on Beckn init)
      description: 'The gateway obtains a `within_bounds` attestation from the buyer credential provider (which re-verifies the

        closed mandate against the open checkout mandate and the negotiation mandate) and sends Beckn init carrying

        bacp.neg.accept. The seller BPP receives only the attestation. Accept of a firm offer gives

        legal_effect acceptance (state ACCEPT_PENDING then AGREED). Accept of a non-firm offer gives purchase_offer

        (state PURCHASE_OFFERED). on_init with the identical term hash moves to BOUND and opens or updates the

        checkout session, whose checkout_hash is the hash of the BPP-signed quote (not the offer hash).

        Outside the mandate: 200 with requires_escalation, then retry with step_up_id after approval.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
