      - status
      - presence
      - line_items
      - totals
      - messages
      properties:
        id:
          type: string
        transaction_id:
          type: string
        status:
          enum:
          - incomplete
          - requires_escalation
          - ready_for_complete
          - complete_in_progress
          - completed
          - canceled
        presence:
          $ref: '#/components/schemas/Presence'
        bpp_id:
          type: string
        provider_id:
          type: string
        mandate_ref:
          type: string
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/Total'
        quote:
          type: object
          properties:
            id:
              type: string
            ttl:
              type: string
            expires_at:
              type: string
              format: date-time
            checkout_hash:
              $ref: '#/components/schemas/Hash'
            bpp_signature:
              $ref: '#/components/schemas/Jws'
        disclosures:
          $ref: '#/components/schemas/Disclosures'
        fulfilment:
          type: object
          additionalProperties: true
        payment:
          $ref: '#/components/schemas/PaymentState'
        step_up:
          $ref: '#/components/schemas/StepUp'
        order_id:
          type: string
        receipts:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/Receipt'
            - $ref: '#/components/schemas/ReceiptRef'
        beckn:
          type: object
          description: Diagnostic correlation
          properties:
            last_action:
              type: string
            last_message_id:
              type: string
        expires_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    CompleteRequest:
      type: object
      required:
      - presence
      - checkout_mandate
      - payment_mandate
      - checkout_hash
      properties:
        presence:
          $ref: '#/components/schemas/Presence'
        checkout_mandate:
          $ref: '#/components/schemas/Jws'
        payment_mandate:
          $ref: '#/components/schemas/Jws'
        checkout_hash:
          $ref: '#/components/schemas/Hash'
        accepted_disclosures_hash:
          $ref: '#/components/schemas/Hash'
        step_up_id:
          type: string
          description: Present when completing after an approved step-up
    MandateRequest:
      type: object
      required:
      - purpose_code
      - rail
      - presence_allowed
      - proposed_constraints
      - validity
      properties:
        purpose_code:
          type: string
        rail:
          $ref: '#/components/schemas/RailType'
        presence_allowed:
          type: array
          items:
            $ref: '#/components/schemas/Presence'
        proposed_constraints:
          $ref: '#/components/schemas/Mandate/properties/constraints'
        data_scopes:
          type: array
          items:
            type: string
        action_scope:
          type: array
          items:
            type: string
        validity:
          type: string
          description: ISO 8601 duration
        language:
          type: string
        parent_mandate_id:
          type: string
          description: For sub-agent delegation. May only narrow.
    MandateHandle:
      type: object
      required:
      - request_id
      - status
      - trusted_surface_url
      properties:
        request_id:
          type: string
        status:
          enum:
          - PENDING
          - ACTIVE
          - REJECTED
        trusted_surface_url:
          type: string
        mandate_ids:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    TrustedSurfaceEvent:
      type: object
      required:
      - event
      - at
      - signature
      properties:
        event:
          enum:
          - mandate.activated
          - mandate.rejected
          - mandate.paused
          - mandate.resumed
          - mandate.revoked
          - mandate.expired
          - step_up.approved
          - step_up.declined
          - rail.safety_switch
          - rail.pre_debit_notice
          - rail.debit_opt_out
          - consent.withdrawn
          - negotiation_mandate.activated
          - negotiation_mandate.revoked
          - negotiation.step_up.approved
          - negotiation.step_up.declined
          - negotiation.request_extension
          - instruments.reported
          - loan.accepted
          - payment.afa_completed
        mandate_id:
          type: string
        related_mandates:
          type: array
          items:
            type: string
        step_up_id:
          type: string
        session_id:
          type: string
        closed_checkout_mandate:
          $ref: '#/components/schemas/Jws'
        auth_binding:
          $ref: '#/components/schemas/Mandate/properties/auth_binding'
        source:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time
        signature:
          $ref: '#/components/schemas/Signature'
        negotiation_id:
          type: string
        offer_hash:
          type: string
        diff_ack:
          type: string
        attestation:
          type: object
    Order:
      type: object
      required:
      - id
      - transaction_id
      - bpp_id
      - state
      - line_items
      - totals
      properties:
        id:
          type: string
        transaction_id:
          type: string
        bpp_id:
          type: string
        provider_id:
          type: string
        state:
          enum:
          - Created
          - Accepted
          - In-progress
          - Completed
          - Cancelled
        fulfilment_state:
          type: string
          description: ONDC fulfilment state code
          e.g. Order-delivered: null
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/Total'
        invoice:
          type: object
          properties:
            irn:
              type: string
            qr:
              type: string
            ewb:
              type: string
            seller_gstin:
              type: string
            buyer_gstin:
              type: string
            doc_date:
              type: string
              format: date
        adjustments:
          type: array
          description: Append-only read model (UCP/ACP adjustments)
          items:
            type: object
            required:
            - type
            - status
            - at
            properties:
              type:
                enum:
                - cancellation
                - return
                - refund
                - replacement
                - dispute
              status:
                type: string
              amount:
                $ref: '#/components/schemas/Amount'
              receipt_id:
                type: string
              at:
                type: string
                format: date-time
        return_window_ends:
          type: string
          format: date-time
        payment:
          $ref: '#/components/schemas/PaymentState'
        mandate_ref:
          type: string
    CancelRequest:
      type: object
      required:
      - reason_code
      - mandate_ref
      - presence
      properties:
        reason_code:
          type: string
          description: From Beckn get_cancellation_reasons
        mandate_ref:
          type: string
        presence:
          $ref: '#/components/schemas/Presence'
        note:
          $ref: '#/components/schemas/LangText'
        bpp_id:
          type: string
          description: Seller subscriber id. Required only when the agent holds the same order id from two BPPs (otherwise 400 invalid_request
            at $.bpp_id).
    ReturnRequest:
      type: object
      required:
      - items
      - reason_code
      - mandate_ref
      - presence
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemRef'
        reason_code:
          type: string
          description: From Beckn get_return_reasons
        mandate_ref:
          type: string
        presence:
          $ref: '#/components/schemas/Presence'
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                enum:
                - image
                - video
                - text
              hash:
                $ref: '#/components/schemas/Hash'
              uri:
                type: string
                format: uri
        refund_to:
          enum:
          - original_method
          default: original_method
        bpp_id:
          type: string
          description: Seller subscriber id. Required only when the agent holds the same order id from two BPPs (otherwise 400 invalid_request
            at $.bpp_id).
    ReturnRecord:
      type: object
      required:
      - return_id
      - order_id
      - status
      - items
      properties:
        return_id:
          type: string
        order_id:
          type: string
        status:
          enum:
          - RETURN_INITIATED
          - RETURN_APPROVED
          - RETURN_PICKED
          - RETURN_DELIVERED
          - RETURN_REJECTED
          - LIQUIDATED
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRef'
        refund:
          type: object
          properties:
            status:
              enum:
              - PENDING
              - INITIATED
              - SUCCESS
              - FAILED
            amount:
              $ref: '#/components/schemas/Amount'
            to:
              const: original_method
            receipt:
              anyOf:
              - $ref: '#/components/schemas/Receipt'
              - $ref: '#/components/schemas/ReceiptRef'
    IssueCreate:
      type: object
      required:
      - order_id
      - category
      - sub_category
      - description
      - mandate_ref
      properties:
        order_id:
          type: string
        category:
          enum:
          - ORDER
          - ITEM
          - FULFILLMENT
          - AGENT
          - PAYMENT
          - TRANSACTION
        sub_category:
          type: string
        description:
          $ref: '#/components/schemas/LangText'
        mandate_ref:
          type: string
        rrn:
          type: string
        utr:
          type: string
        evidence_bundle_ref:
          type: string
          format: uri
        bpp_id:
          type: string
          description: Seller subscriber id. Required only when the agent holds the same order id from two BPPs (otherwise 400 invalid_request
            at $.bpp_id).
    Issue:
      type: object
      required:
      - id
      - order_id
      - level
      - status
      - complainant
      - actions
      properties:
        id:
          type: string
        order_id:
          type: string
        level:
          enum:
          - ISSUE
          - GRIEVANCE
        status:
          enum:
          - OPEN
          - PROCESSING
          - RESOLVED
          - CLOSED
        category:
          type: string
        sub_category:
          type: string
        complainant:
          type: object
          required:
          - actor_type
          - on_behalf_of
          properties:
            actor_type:
              const: AI_AGENT
            agent_id:
              type: string
            operator:
              type: string
            on_behalf_of:
              type: string
              description: principal_ref
            mandate_ref:
              type: string
        payment_refs:
          type: object
          properties:
            rrn:
              type: string
            utr:
              type: string
        evidence_bundle:
          $ref: '#/components/schemas/EvidenceBundle'
        actions:
          type: array
          items:
            type: object
            required:
            - action
            - actor_type
            - at
            properties:
              action:
                enum:
                - OPEN
                - INFO_REQUESTED
                - INFO_PROVIDED
                - INFO_NOT_AVAILABLE
                - PROCESSING
                - RESOLUTION_PROPOSED
                - RESOLUTION_ACCEPTED
                - RESOLUTION_REJECTED
                - RESOLUTION_CASCADED
                - CASCADED
                - ESCALATED
                - RESOLVED
                - CLOSED
              actor_type:
                enum:
                - AI_AGENT
                - CONSUMER
                - INTERFACING_NP
                - COUNTERPARTY_NP
                - CASCADED_NP
                - INTERFACING_NP_GRO
                - COUNTERPARTY_NP_GRO
                - CASCADED_NP_GRO
              note:
                $ref: '#/components/schemas/LangText'
              at:
                type: string
                format: date-time
        resolution:
          type: object
          properties:
            action_triggered:
              enum:
              - REFUND
              - REPLACEMENT
              - RETURN
              - CANCEL
              - NO-ACTION
            refund_amount:
              $ref: '#/components/schemas/Amount'
        expected_response_by:
          type: string
          format: date-time
        expected_resolution_by:
          type: string
          format: date-time
        odr_reference:
          type: string
          description: Out-of-protocol ODR escalation reference (IGM 2.0 has no DISPUTE level)
    EvidenceBundle:
      type: object
      required:
      - transaction_id
      - mandates
      - receipts
      - instruction_log
      properties:
        transaction_id:
          type: string
        agent_credential_hash:
          $ref: '#/components/schemas/Hash'
        mandates:
          type: array
          items:
            $ref: '#/components/schemas/Jws'
          description: Open and closed mandates (selectively disclosed)
        checkout:
          type: object
          properties:
            bpp_signed_quote:
              $ref: '#/components/schemas/Jws'
            checkout_hash:
              $ref: '#/components/schemas/Hash'
            disclosures_hash:
              $ref: '#/components/schemas/Hash'
        receipts:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/Receipt'
            - $ref: '#/components/schemas/ReceiptRef'
        consent_receipts:
          type: array
          items:
            type: string
        instruction_log:
          type: array
          items:
            $ref: '#/components/schemas/InstructionLogEntry'
        verification:
          type: object
          description: Result of the AP2 5-step dispute verification run by the gateway
          properties:
            steps_passed:
              type: integer
              maximum: 5
            chain_valid:
              type: boolean
        bundle_signature:
          $ref: '#/components/schemas/Signature'
    WebhookEvent:
      type: object
      description: Delivered with Standard Webhooks headers (webhook-id, webhook-timestamp) plus a mandatory RFC 9421 signature by the gateway
        (UCP rule). Retries with backoff. Payloads are full snapshots.
      required:
      - event_id
      - type
      - created_at
      - data
      properties:
        event_id:
          type: string
        type:
          enum:
          - mandate.status_changed
          - session.updated
          - payment.receipt
          - order.updated
          - return.updated
          - issue.updated
          - pre_debit.notice
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    NegotiationCreate:
      type: object
      required:
      - bpp_id
      - mode
      - negotiation_mandate_ref
      - presence
      - items
      properties:
        bpp_id:
          type: string
        provider_id:
          type: string
        mode:
          $ref: ../schemas/negotiation-session.json#/$defs/Mode
        profile:
          type: string
          description: Trade-model profile id, e.g. b2c.ecom, b2b.procurement (section 14)
        negotiation_mandate_ref:
          type: string
          pattern: ^mdt_[A-Za-z0-9]{12,40}$
        presence:
          enum:
          - HP
          - HNP
        rfq_parent_id:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - item_id
            - quantity
            properties:
              item_id:
                type: string
              quantity:
                type: number
                exclusiveMinimum: 0
        initial_term_sheet:
          $ref: ../schemas/termsheet.json
        max_wait_ms:
          type: integer
          maximum: 10000
          default: 4000
    NegotiationMessageDraft:
      type: object
      description: 'Agent-submitted draft. The gateway fills envelope fields (msg_id, round, dispatched_at, from, signatures), applies

        the patch to the live term sheet, computes all_in_total and expires_at, then guards, validates and signs.

        '
      required:
      - type
      properties:
        type:
          enum:
          - offer
          - counter_offer
          - bid
          - reject
          - withdraw
          - terminate
          - request_extension
          - accept_revoke
          - bid_commit
          - bid_reveal
          - bid_retract
        in_reply_to:
          type: string
        offer_hash:
          type: string
        firm:
          type: boolean
        subject_to_principal_approval:
          type: boolean
        expires_in:
          type: string
          description: ISO 8601 duration
          at least min_offer_validity: null
        term_sheet:
          $ref: ../schemas/termsheet.json
        term_sheet_patch:
          type: array
          description: RFC 6902 JSON Patch against the live term sheet. Only negotiable issues may change.
          items:
            type: object
            required:
            - op
            - path
            properties:
              op:
                enum:
                - add
                - remove
                - replace
              path:
                type: string
              value: {}
        reason:
          type: string
        reason_code:
          type: string
        final:
          type: boolean
        auction_id:
          type: string
        bid_deposit_ref:
          type: string
        salt:
          type: string
        advisory_text:
          type: string
          description: Logged with binding false and returned to the counterparty only as untrusted text
      allOf:
      - if:
          properties:
            subject_to_principal_approval:
              const: true
          required:
          - subject_to_principal_approval
        then:
          properties:
            firm:
              const: false
    AcceptRequest:
      type: object
      required:
      - offer_hash
      properties:
        offer_hash:
          type: string
        step_up_id:
          type: string
          description: Present after the principal approved an out-of-mandate deal
      not:
        anyOf:
        - required:
          - term_sheet
        - required:
          - term_sheet_patch
    ReceiptRef:
      type: object
      required:
      - receipt_id
      - receipt_hash
      - result
      description: Webhook-scoped receipt reference. GET the resource for the full signed receipt.
      properties:
        receipt_id:
          type: string
        receipt_hash:
          $ref: '#/components/schemas/Hash'
        receipt_type:
          enum:
          - mandate
          - checkout
          - payment
          - refund
        result:
          enum:
          - success
          - failure
          - in_doubt
        amount:
          $ref: '#/components/schemas/Amount'
        refund_state:
          type: string
        rail:
          type: object
          properties:
            type:
              type: string
            rrn:
              type: string
            status:
              type: string
            original_rrn:
              type: string
      additionalProperties: false
