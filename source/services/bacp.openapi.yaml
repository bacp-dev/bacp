  /trusted-surface/step-ups/{step_up_id}:
    parameters:
    - name: step_up_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - trusted-surface
      operationId: getStepUpRender
      summary: Fetch the gateway-signed ts_render of a step-up. Only the step-up's Mandate Manager or payer PSP may call it.
      description: 'Signed with a Mandate Manager or PSP registry key under tag `bacp-ts`, with no BACP-Agent header. Agents calling this endpoint
        get 403 trusted_surface_only. Only the step-up''s Mandate Manager or payer PSP gets the render: for a session step-up, the issuer of the
        session''s mandate or the PSP named in `rail_binding.psp_id` of the leg''s planned open Payment Mandate under the session''s root; for a
        summary step-up over a multi-seller basket (one whose ts_render carries `covers[]`), only the issuer of the shared root, and no payer
        PSP; for a `post_order` step-up (no session), the issuer of the mandate the order was placed under or the PSP named in
        `auth_binding.psp_id` of the order''s closed Payment Mandate (any of them under split tender). Any other registry key gets 404 not_found,
        never 403, so that the endpoint does not reveal which step-ups exist. The gateway rate-limits the fetch (429), counting the limit per
        caller key before it looks up the step_up_id, so that a 429 never depends on whether the step-up exists.

        The `ts_render` is signed once, when the step-up is created, and served byte-identical on every fetch; it never changes for a `step_up_id`.
        The Trusted Surface renders a step-up only from the `ts_render` it fetches here by `step_up_id`, never from content that reaches it through
        the agent, and records `Presentation.content_hash` as the sha-256 of the compact JWS.

        '
      security:
      - httpSignature: []
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: The step-up's signed render input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpRender'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
