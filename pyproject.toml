[project]
name = "bacp"
version = "0.0.0"
description = "Bharat Agentic Commerce Protocol (BACP) specification and documentation site"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mike==2.1.3",
    "mkdocs-material>=9.5.0",
    "mkdocs-llmstxt==0.5.0",
    "mkdocs-redirects==1.2.2",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "referencing>=0.35.1",
    "openapi-spec-validator>=0.7.1",
    "yamllint==1.35.1",
]
